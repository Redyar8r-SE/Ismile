<noscript><style>#siteboot{display:none}</style></noscript>
<script>
(function () {
  var page = document.documentElement;
  var lifted = false;
  page.classList.add("siteboot-on", "site-animations-pending");
  var lift = function () {
    if (lifted) return;
    lifted = true;
    page.classList.remove("siteboot-on");
    var cover = document.getElementById("siteboot");
    if (cover) cover.classList.add("is-gone");
    setTimeout(function () {
      page.classList.remove("site-animations-pending");
      page.classList.add("site-ready");
    }, cover ? 500 : 0);
  };
  window.siteReady = lift;
  window.addEventListener("load", function () { setTimeout(lift, 2500); });
  setTimeout(lift, 6000);
})();
</script>
