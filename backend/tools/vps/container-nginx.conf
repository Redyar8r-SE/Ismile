# api.ismile.krd (or __DOMAIN__), inside the "ismile" container. Filled in and
# installed by setup-test-site.sh (__PORT__, __SITE__, __FPM_SOCK__, __AUTH__, __DOMAIN__).
# The host's nginx (HTTPS, certificate) forwards to this port.
#
# ALLOW-LIST: only the public website and the PHP pages of api/ and admin/
# are served. Everything else answers 404: config, backend, server code,
# dot-files, files starting with "_", documents.

server {
    listen __PORT__;
    server_name __DOMAIN__;
    root __SITE__;
    server_tokens off;
    # Redirects stay on the public address (https://__DOMAIN__/...), never
    # this inner port (http://...:__PORT__/...), which nobody can open.
    absolute_redirect off;
    client_max_body_size 12m;

    # The visitor's real address, passed on by the host's nginx (rate limits).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # A browser password in front of the whole test site (see setup script).
    __AUTH__

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Never any hidden file or folder (.env, .git, .htaccess, .user.ini …).
    if ($uri ~ "/\.") { return 404; }

    # The pages. no-cache: browsers check for a newer page every time, so an
    # update shows at once (an add_header here replaces the ones above, so
    # they are repeated).
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header X-Frame-Options "SAMEORIGIN" always; }
    location ~ ^/[a-z-]+\.html$ { try_files $uri =404; add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header X-Frame-Options "SAMEORIGIN" always; }
    location = /favicon.ico { auth_basic off; try_files $uri =404; }

    # Design, scripts, pictures, content: the same public files as ismile.krd,
    # open so payment.html works for a visitor returning from PSOOLA.
    location ^~ /css/    { auth_basic off; try_files $uri =404; }
    location ^~ /js/     { auth_basic off; try_files $uri =404; }
    location ^~ /assets/ { auth_basic off; try_files $uri =404; }
    location = /data/admin-accounts.json { return 404; }
    location ^~ /data/   { auth_basic off; try_files $uri =404; add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; add_header X-Content-Type-Options "nosniff" always; }

    # The admin's own stylesheet and script.
    location ~ ^/admin/(admin|map)\.(css|js)$ { try_files $uri =404; }
    # Local QR decoder for browsers without native BarcodeDetector support.
    location = /admin/vendor/jsQR.js { try_files $uri =404; }
    location = /admin  { return 302 /admin/; }
    location = /admin/ { return 302 /admin/index.php; }

    # Public without the site password (the Owner's decision, 11 Oct 2026):
    # the page a visitor returns to from PSOOLA and PSOOLA's webhook. Each is
    # protected on its own: personal signed links (status, pay, qr) and the
    # webhook's X-Psoola-Signature. The admin and every other API keep the password.
    location = /payment.html { auth_basic off; try_files $uri =404; }
    location ~ ^/api/(status|pay|qr|webhook)\.php$ {
        auth_basic off;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:__FPM_SOCK__;
        fastcgi_read_timeout 60s;
    }

    # PHP: only plain names (a-z, 0-9, -) in api/ and admin/. "_boot.php",
    # "_backend.php" and anything else cannot match, so they are never run.
    location ~ ^/(api|admin)/[a-z0-9-]+\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:__FPM_SOCK__;
        fastcgi_read_timeout 60s;
    }

    # Everything else: not found.
    location / { return 404; }
}
