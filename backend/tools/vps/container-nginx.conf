# test.ismile.krd, inside the "ismile" container. Filled in and installed by
# setup-test-site.sh (__PORT__, __SITE__, __FPM_SOCK__, __AUTH__).
# The host's nginx (HTTPS, certificate) forwards to this port.
#
# ALLOW-LIST: only the public website and the PHP pages of api/ and admin/
# are served. Everything else answers 404: config, backend, server code,
# dot-files, files starting with "_", documents.

server {
    listen __PORT__;
    server_name test.ismile.krd;
    root __SITE__;
    server_tokens off;
    client_max_body_size 12m;

    # The visitor's real address, passed on by the host's nginx (rate limits).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # A browser password in front of the whole test site (see setup script).
    __AUTH__

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Never any hidden file or folder (.env, .git, .htaccess, .user.ini …).
    if ($uri ~ "/\.") { return 404; }

    # The pages.
    location = / { try_files /index.html =404; }
    location ~ ^/[a-z-]+\.html$ { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }

    # Design, scripts, pictures, content.
    location ^~ /css/    { try_files $uri =404; }
    location ^~ /js/     { try_files $uri =404; }
    location ^~ /assets/ { try_files $uri =404; }
    location ^~ /data/   { try_files $uri =404; add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; add_header X-Content-Type-Options "nosniff" always; }

    # The admin's own stylesheet and script.
    location ~ ^/admin/admin\.(css|js)$ { try_files $uri =404; }
    location = /admin  { return 302 /admin/; }
    location = /admin/ { return 302 /admin/index.php; }

    # PHP: only plain names (a-z, 0-9, -) in api/ and admin/. "_boot.php",
    # "_backend.php" and anything else cannot match, so they are never run.
    location ~ ^/(api|admin)/[a-z0-9-]+\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:__FPM_SOCK__;
        fastcgi_read_timeout 60s;
    }

    # Everything else: not found.
    location / { return 404; }
}
