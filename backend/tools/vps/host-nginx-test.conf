# test.ismile.krd on the HOST (the machine with the Let's Encrypt nginx that
# already serves ismile.krd). It only forwards to the container; the live
# ismile.krd server block is not changed.
#
# 1. Cloudflare → DNS → Add record: type A, name "test", the same IPv4 as
#    ismile.krd, Proxied (orange cloud).
# 2. Find the container's address:  lxc list ismile   (or: pct exec <id> -- hostname -I)
#    and put it below in place of CONTAINER_IP.
# 3. Save this file as /etc/nginx/sites-available/ismile-test, then:
#      ln -s /etc/nginx/sites-available/ismile-test /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#      certbot --nginx -d test.ismile.krd          (adds the HTTPS part)
# 4. Open https://test.ismile.krd
#
# If this nginx already turns Cloudflare's addresses into the visitor's real
# address (set_real_ip_from … / real_ip_header CF-Connecting-IP), $remote_addr
# below is the visitor. If not, every visitor looks like Cloudflare to the
# rate limits; fine for a test site, but copy the live site's setting here.

server {
    listen 80;
    listen [::]:80;
    server_name test.ismile.krd;

    client_max_body_size 12m;          # student ID photos (8 MB)

    location / {
        proxy_pass http://CONTAINER_IP:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
