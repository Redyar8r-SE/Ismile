# api.ismile.krd on the HOST (Let's Encrypt nginx that also serves ismile.krd).
# Forwards to the container; the live ismile.krd Node server block is unchanged.
#
# 1. Cloudflare → DNS → A record "api", same IPv4 as ismile.krd (Proxied or DNS only).
# 2. LXD proxy (already on hz-codeflow): listen :3081 → container 127.0.0.1:8081
#    Or set CONTAINER_IP below and proxy_pass http://CONTAINER_IP:8081
# 3. Save as /etc/nginx/sites-available/ismile-api, enable, then:
#      nginx -t && systemctl reload nginx
#      certbot --nginx -d api.ismile.krd
# 4. Open https://api.ismile.krd

server {
    listen 80;
    listen [::]:80;
    server_name api.ismile.krd;

    client_max_body_size 12m;          # student ID photos (8 MB)

    location / {
        proxy_pass http://127.0.0.1:3081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
