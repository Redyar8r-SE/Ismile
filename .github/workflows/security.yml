name: Repository security

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Reject private files and public password verifiers
        run: node tools/check-repository-security.mjs
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          SCANNER_DIR="$RUNNER_TEMP/ismile-security-scanner"
          mkdir -p "$SCANNER_DIR"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$SCANNER_DIR/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $SCANNER_DIR/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$SCANNER_DIR/gitleaks.tar.gz" -C "$SCANNER_DIR"
          "$SCANNER_DIR/gitleaks" git --redact=100 --no-banner --log-opts="--all" .
      - name: Check locked dependencies for known vulnerabilities
        run: npm audit --package-lock-only
