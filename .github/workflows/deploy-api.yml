name: Workshop open-restored-vip
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: open-restored-vip workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'OPEN_RESTORED_VIP'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\{App,Db,Audit};
            foreach(['VipCapacity.php','Settings.php'] as $name){
             $curl=curl_init('https://raw.githubusercontent.com/Redyar8r-SE/Ismile/0660dfd24637e77b64e97e289229229d7d530202/backend/src/'.$name);curl_setopt_array($curl,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_CONNECTTIMEOUT=>10,CURLOPT_TIMEOUT=>30]);$source=curl_exec($curl);$code=curl_getinfo($curl,CURLINFO_HTTP_CODE);curl_close($curl);if($code!==200||!is_string($source)||!str_starts_with($source,'<?php'))throw new RuntimeException('VIP source unavailable');
             $target='/opt/ismile-test/backend/src/'.$name;$temp=$target.'.vip-open';file_put_contents($temp,$source,LOCK_EX);chmod($temp,fileperms($target)&0777);rename($temp,$target);
            }
            Db::transaction(static function(){Db::one("SELECT k FROM settings WHERE k='registration_open' FOR UPDATE");foreach(['registration_open'=>'1','vip_registration_limit'=>'0','vip_package_enabled'=>'0','vip_package_sales_open'=>'0'] as $k=>$v)Db::run('INSERT INTO settings(k,v,updated_at) VALUES(?,?,?) ON DUPLICATE KEY UPDATE v=VALUES(v),updated_at=VALUES(updated_at)',[$k,$v,App::now()]);Audit::log(null,'vip.reopened','setting',null,['website_limit'=>0,'design'=>'previous','price'=>'current provider price']);});
            OPEN_RESTORED_VIP
            runuser -u www-data -- php <<'VERIFY_OPEN_VIP'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $state=\Ismile\Registrations::publicState('en');if(!$state['open']||!$state['vip']['available'])throw new RuntimeException('VIP did not open');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['api'=>'api.ismile.krd','vipAvailable'=>true,'unlimitedWebsiteVip'=>true,'previousDesign'=>true,'providerPrice'=>$state['prices']['vip'],'providerCurrency'=>$state['prices']['vipCurrency']]).PHP_EOL;
            VERIFY_OPEN_VIP
