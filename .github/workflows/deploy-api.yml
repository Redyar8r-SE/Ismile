name: Workshop city-dropdowns-sync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: city-dropdowns-sync workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            node <<'CITY_DROPDOWN_NODE'
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
            const prompts={"en":"Choose your city","ar":"اختر مدينتك","ku":"شارەکەت هەڵبژێرە"},expected=[
              {"value":"Amarah","governorate":"Maysan","name":{"en":"Amarah","ar":"العمارة","ku":"عەمارە"}},
              {"value":"Baghdad","governorate":"Baghdad","name":{"en":"Baghdad","ar":"بغداد","ku":"بەغدا"}},
              {"value":"Baqubah","governorate":"Diyala","name":{"en":"Baqubah","ar":"بعقوبة","ku":"بەعقووبە"}},
              {"value":"Basra","governorate":"Basra","name":{"en":"Basra","ar":"البصرة","ku":"بەسرە"}},
              {"value":"Diwaniyah","governorate":"Al-Qadisiyyah","name":{"en":"Diwaniyah","ar":"الديوانية","ku":"دیوانیە"}},
              {"value":"Duhok","governorate":"Duhok","name":{"en":"Duhok","ar":"دهوك","ku":"دهۆک"}},
              {"value":"Erbil","governorate":"Erbil","name":{"en":"Erbil","ar":"أربيل","ku":"هەولێر"}},
              {"value":"Halabja","governorate":"Halabja","name":{"en":"Halabja","ar":"حلبجة","ku":"هەڵەبجە"}},
              {"value":"Hillah","governorate":"Babil","name":{"en":"Hillah","ar":"الحلة","ku":"حیللە"}},
              {"value":"Karbala","governorate":"Karbala","name":{"en":"Karbala","ar":"كربلاء","ku":"کەربەلا"}},
              {"value":"Kirkuk","governorate":"Kirkuk","name":{"en":"Kirkuk","ar":"كركوك","ku":"کەرکووک"}},
              {"value":"Kut","governorate":"Wasit","name":{"en":"Kut","ar":"الكوت","ku":"کووت"}},
              {"value":"Mosul","governorate":"Nineveh","name":{"en":"Mosul","ar":"الموصل","ku":"مووسڵ"}},
              {"value":"Najaf","governorate":"Najaf","name":{"en":"Najaf","ar":"النجف","ku":"نەجەف"}},
              {"value":"Nasiriyah","governorate":"Dhi Qar","name":{"en":"Nasiriyah","ar":"الناصرية","ku":"ناسیریە"}},
              {"value":"Ramadi","governorate":"Al-Anbar","name":{"en":"Ramadi","ar":"الرمادي","ku":"ڕەمادی"}},
              {"value":"Samawah","governorate":"Al-Muthanna","name":{"en":"Samawah","ar":"السماوة","ku":"سەماوە"}},
              {"value":"Sulaimani","governorate":"Sulaymaniyah","name":{"en":"Sulaimani","ar":"السليمانية","ku":"سلێمانی"}},
              {"value":"Tikrit","governorate":"Salah al-Din","name":{"en":"Tikrit","ar":"تكريت","ku":"تکریت"}}
            ];
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']})),matches=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'js/utils/cities.js')));if(matches.length!==1)throw Error('Expected one deployed site with city dropdowns');
            const current=fs.realpathSync(matches[0].pm2_env.pm_cwd),env=fs.readFileSync(path.join(current,'.env'),'utf8'),match=env.match(/^CONTENT_ROOT=(.*)$/m),shared=match&&match[1].trim()?match[1].trim():path.resolve(current,'../../shared-content'),backup=path.join(path.dirname(shared),'content-backups','city-dropdowns-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            for(const root of [shared,'/opt/ismile-test/site']){for(const p of ['data/cities.json',...['en','ar','ku'].map(lang=>'data/i18n/site-'+lang+'.json')]){const file=path.join(root,p),fallback=path.join(current,p),source=fs.existsSync(file)?file:fallback,raw=fs.readFileSync(source,'utf8'),doc=JSON.parse(raw);fs.writeFileSync(path.join(backup,(root===shared?'public-':'backend-')+p.replaceAll('/','_')),raw,{mode:0o600});if(p==='data/cities.json'){if(JSON.stringify(doc)!==JSON.stringify(expected))throw Error('City list changed before sync');}else{const lang=p.match(/site-(en|ar|ku)/)[1];doc.o_city=prompts[lang];}fs.mkdirSync(path.dirname(file),{recursive:true});const temporary=file+'.city-writing',stat=fs.statSync(source);fs.writeFileSync(temporary,JSON.stringify(doc,null,2)+String.fromCharCode(10));fs.chmodSync(temporary,stat.mode&0o777);fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,file);}}
            console.log('WORKSHOPS_VERIFIED='+JSON.stringify({cityListSynced:true,capitals:19,languages:3,backupSaved:true}));
            CITY_DROPDOWN_NODE
            runuser -u www-data -- php <<'CITY_ADMIN_VERIFICATION'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            if(count(\Ismile\Cities::all())!==19)throw new RuntimeException('Capital list mismatch');
            foreach(['en','ar','ckb'] as $lang){$html=\Ismile\Cities::select('Halabja',$lang);if(substr_count($html,'<option ')!==20||!str_contains($html,'value="Halabja" selected'))throw new RuntimeException('Shared admin dropdown mismatch');}
            echo 'CITY_ADMIN_VERIFIED=19 capitals, all interface languages, selected city retained'.PHP_EOL;
            CITY_ADMIN_VERIFICATION
