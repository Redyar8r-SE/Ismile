name: Workshop varsa-overview-cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: varsa-overview-cleanup workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'VARSA_OVERVIEW_PHP'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\App;use Ismile\Audit;use Ismile\Db;use Ismile\Workshops;use Ismile\WorkshopCatalog;
            $definition=json_decode((string)file_get_contents('/opt/ismile-test/backend/assets/varsa-cbct-workshop-2026.json'),true,512,JSON_THROW_ON_ERROR);
            $suffix=[
             'en'=>"\nFree workshop organized by Varsa.\nRegistration: call 07707171112.",
             'ar'=>"\nورشة مجانية تنظمها فارسا.\nللتسجيل: اتصل على 07707171112.",
             'ku'=>"\nوۆرکشۆپێکی بەخۆڕایی لەلایەن ڤارساوە.\nبۆ تۆمارکردن: پەیوەندی بە 07707171112 بکە.",
            ];
            Db::transaction(static function()use($definition,$suffix):void{
             $row=Db::one('SELECT * FROM workshops WHERE id=? FOR UPDATE',['live-cbct-digital-applications']);
             if(!$row||$row['organizer']!=='company'||$row['company_phone']!=='07707171112'||(int)$row['price']!==0)throw new RuntimeException('Workshop identity differs');
             $fields=[];foreach($suffix as $lang=>$ending){$key='overview_'.$lang;$wanted=$definition[$key];if(str_contains($wanted,"\n"))throw new RuntimeException('Updated overview is not deployed');if($row[$key]!==$wanted&&$row[$key]!==$wanted.$ending)throw new RuntimeException('Existing overview changed');$fields[$key]=$wanted;}
             $owner=(int)Db::value("SELECT id FROM admin_users WHERE role='owner' AND disabled_at IS NULL ORDER BY id LIMIT 1");if(!$owner)throw new RuntimeException('Owner required');
             Db::update('workshops',$fields+['updated_at'=>App::now()],'id=?',[$row['id']]);
             $after=Db::one('SELECT * FROM workshops WHERE id=?',[$row['id']]);$expected=array_replace($row,$fields,['updated_at'=>$after['updated_at']]);if($after!==$expected)throw new RuntimeException('Unexpected workshop field changed');
             Audit::log($owner,'workshop.overview_updated','workshop',null,['id'=>$row['id'],'languages'=>['en','ar','ku']]);
            });
            Workshops::syncWebsite();$workshop=WorkshopCatalog::one('live-cbct-digital-applications',true);
            foreach(['en','ar','ku'] as $lang)if($workshop['overview'][$lang]!==$definition['overview_'.$lang])throw new RuntimeException('Public overview mismatch');
            if($workshop['level']['en']!=='Suitable for all experience levels')throw new RuntimeException('Level changed');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['id'=>$workshop['id'],'overview'=>$workshop['overview'],'level'=>$workshop['level'],'companyPhone'=>$workshop['companyPhone'],'otherFieldsPreserved'=>true],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            VARSA_OVERVIEW_PHP
