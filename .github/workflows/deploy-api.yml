name: Badges PSOOLA QR refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Refresh badge QR codes from PSOOLA (counts only, no QR values)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set -eu
            printf '%s\n' 'b857f71ebd0efb5d519d691d31c1d18a9d22dffd67e95e06743240995137f2f5  /opt/ismile-test/backend/src/PsoolaTickets.php' | sha256sum --check
            printf '%s\n' 'feaa787d946693ca605df070ac707466fe03256d79fab71f75754b4306d8e429  /opt/ismile-test/backend/src/PsoolaTicketQrs.php' | sha256sum --check
            runuser -u www-data -- php <<'QR_REFRESH'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\Db;
            $count = static function (): array {
                $rows = Db::all('SELECT codes FROM badge_ticket_codes');
                $new = 0; $old = 0;
                foreach ($rows as $row) {
                    $list = json_decode((string) $row['codes'], true) ?: [];
                    foreach ($list as $code) { if (str_starts_with((string) $code, 'PSOOLA:')) $new++; else $old++; }
                }
                return ['guests' => count($rows), 'badgeQrNew' => $new, 'badgeQrOldShortCode' => $old];
            };
            $migrated = (bool) Db::value("SELECT name FROM schema_migrations WHERE name = '2026-11-15-badge-codes-psoola-qr.sql'");
            $before = $count();
            $sync = \Ismile\PsoolaTickets::syncCodes(true);
            $after = $count();
            $buyers = \Ismile\PsoolaTicketQrs::syncMissing(100);
            $qrRows = (int) Db::value('SELECT COUNT(*) FROM psoola_ticket_qrs');
            $qrWith = (int) Db::value('SELECT COUNT(*) FROM psoola_ticket_qrs WHERE qr_code IS NOT NULL');
            echo 'QR_REFRESH=' . json_encode(['migrationApplied' => $migrated, 'before' => $before, 'sync' => $sync, 'after' => $after,
                'buyerTicketsSaved' => $qrRows, 'buyerTicketsWithQr' => $qrWith, 'buyerSyncThisRun' => $buyers]) . PHP_EOL;
            QR_REFRESH
