name: Workshop workshop-action-fix-verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: workshop-action-fix-verify workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            printf '%s\n' '7408f3069530b4565a36ac706b90c00f2d4208c4ac86c639a20ae29520e193d9  /opt/ismile-test/site/admin/_workshop_controller.php' | sha256sum --check
            printf '%s\n' 'eaf8f06e0d24ce2cabf0906dc0878fded66f62e2d49bf6bddc8970c1e1a5d5ef  /opt/ismile-test/site/admin/_workshop_workspace.php' | sha256sum --check
            printf '%s\n' '1507b285f5fff9068fa34bb208d610978f742eedcaddb1308aac652a14ae24d8  /opt/ismile-test/site/admin/_workshop_booking.php' | sha256sum --check
            runuser -u www-data -- php <<'WORKSHOP_ACTIONS_VERIFY'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $render=static function(string $query,string $role='owner'):string{$command=['php','/opt/ismile-test/backend/tools/verify-deployment.php','--render','workshops',$query,$role];$process=proc_open($command,[0=>['pipe','r'],1=>['pipe','w'],2=>['pipe','w']],$pipes);fclose($pipes[0]);$html=stream_get_contents($pipes[1]);$err=stream_get_contents($pipes[2]);fclose($pipes[1]);fclose($pipes[2]);if(proc_close($process)!==0)throw new RuntimeException('Render failed: '.$err);return $html;};
            foreach(['guest','cash'] as $mode){$html=$render('id=subperiosteal-implant-protocol&mode='.$mode.'&booking=1');if(!str_contains($html,'class="ws-cash-actions"')||!str_contains($html,'Register (cash)')||!str_contains($html,'Book a guest')||!str_contains($html,'id="ws-book"'))throw new RuntimeException('Workshop actions disappeared');if($mode==='cash'&&(!str_contains($html,'Cash registration unavailable')||!str_contains($html,'0 IQD')))throw new RuntimeException('Zero-price explanation missing');}
            $paid=\Ismile\Db::one("SELECT id FROM workshops WHERE organizer='ismile' AND status='active' AND price>0 AND provider_event_id IS NOT NULL LIMIT 1");if(!$paid)throw new RuntimeException('No paid workshop');
            $html=$render(http_build_query(['id'=>$paid['id'],'mode'=>'cash','booking'=>'1']));if(!str_contains($html,'data-ws-attendee-search')||!str_contains($html,'Book a guest'))throw new RuntimeException('Paid workshop lookup failed');
            $viewer=$render('id=subperiosteal-implant-protocol&mode=cash&booking=1','viewer');if(str_contains($viewer,'class="ws-cash-actions"')||str_contains($viewer,'id="ws-book"'))throw new RuntimeException('Viewer gained booking access');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['cashAndGuestVisible'=>true,'zeroPriceExplained'=>true,'paidLookupWorks'=>true,'viewerRestricted'=>true,'readOnly'=>true]).PHP_EOL;
            WORKSHOP_ACTIONS_VERIFY
