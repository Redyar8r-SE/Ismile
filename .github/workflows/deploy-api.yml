name: Workshop city-values-normalize-verified
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: city-values-normalize-verified workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'CITY_NORMALIZATION'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\App;use Ismile\Db;use Ismile\Audit;
            $mapping=json_decode(base64_decode(''),true,512,JSON_THROW_ON_ERROR);
            $capitals=json_decode(base64_decode('WyJBbWFyYWgiLCJCYWdoZGFkIiwiQmFxdWJhaCIsIkJhc3JhIiwiRGl3YW5peWFoIiwiRHVob2siLCJFcmJpbCIsIkhhbGFiamEiLCJIaWxsYWgiLCJLYXJiYWxhIiwiS2lya3VrIiwiS3V0IiwiTW9zdWwiLCJOYWphZiIsIk5hc2lyaXlhaCIsIlJhbWFkaSIsIlNhbWF3YWgiLCJTdWxhaW1hbmkiLCJUaWtyaXQiXQ=='),true,512,JSON_THROW_ON_ERROR);
            $owner=(int)Db::value("SELECT id FROM admin_users WHERE role='owner' AND disabled_at IS NULL ORDER BY id LIMIT 1");if(!$owner)throw new RuntimeException('Owner required');
            $result=Db::transaction(static function()use($mapping,$capitals,$owner):array{
             $before=[];$updates=[];
             foreach(['registrations','checkouts','sponsor_requests'] as $table){$before[$table]=Db::all('SELECT id,city FROM `'.$table.'` WHERE city IS NOT NULL AND city<>? ORDER BY id FOR UPDATE',['']);
              foreach($before[$table] as $row){if($row['city']==='-')continue;$to=$mapping[$row['city']]??(in_array($row['city'],$capitals,true)?$row['city']:null);if($to===null)throw new RuntimeException('Unmapped city; no changes saved: '.$row['city']);if($to!==$row['city'])$updates[]=[$table,$row['id'],$row['city'],$to];}}
             $folder=App::storage('backups');if(!is_dir($folder)&&!mkdir($folder,0700,true))throw new RuntimeException('Backup folder unavailable');
             $backup=$folder.'/city-normalization-'.gmdate('Ymd-His').'-'.bin2hex(random_bytes(4)).'.json';if(file_put_contents($backup,json_encode($before,JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR),LOCK_EX)===false)throw new RuntimeException('Cannot save city backup');chmod($backup,0600);
             $counts=[];foreach($updates as [$table,$id,$from,$to]){if(Db::run('UPDATE `'.$table.'` SET city=? WHERE id=? AND BINARY city=BINARY ?',[$to,$id,$from])!==1)throw new RuntimeException('City changed during normalization');Audit::log($owner,'city.normalized',$table,(int)$id,['from'=>$from,'to'=>$to]);$counts[$table]=($counts[$table]??0)+1;}
             foreach(['registrations','checkouts','sponsor_requests'] as $table)foreach(Db::all('SELECT DISTINCT city FROM `'.$table.'` WHERE city IS NOT NULL AND city<>?',['']) as $row)if($row['city']!=='-'&&!in_array($row['city'],$capitals,true))throw new RuntimeException('Noncanonical city remains');
             return ['changed'=>$counts,'backupSaved'=>true,'onlyCityFieldsUpdated'=>true];
            });
            echo 'WORKSHOPS_VERIFIED='.json_encode($result,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            CITY_NORMALIZATION
