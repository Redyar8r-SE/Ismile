name: Workshop map-40-inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: map-40-inventory workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'MAP40_INVENTORY'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\Db;
            $positions=Db::all('SELECT * FROM sponsor_map_positions WHERE display_number BETWEEN 22 AND 25 OR display_number=40 ORDER BY display_number');
            $bookings=Db::all("SELECT id,ref,company,package_id,status,booth_number,price_quoted,amount_agreed,amount_paid FROM sponsor_requests WHERE kind='sponsor' AND reserved_booth IN ('25','26','27','28','45') ORDER BY id");
            $counts=Db::all("SELECT package_id,COUNT(*) AS total,SUM(status='confirmed') AS confirmed FROM sponsor_requests WHERE kind='sponsor' GROUP BY package_id");
            echo 'WORKSHOPS_INVENTORY='.json_encode(['positions'=>$positions,'affectedBookings'=>$bookings,'packageCounts'=>$counts,'historicalAt22'=>(int)Db::value("SELECT COUNT(*) FROM sponsor_requests WHERE kind='sponsor' AND booth_number='25'")]).PHP_EOL;
            MAP40_INVENTORY
