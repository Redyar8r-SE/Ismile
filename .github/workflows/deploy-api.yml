name: Workshop city-values-final-verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: city-values-final-verify workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'CITY_FINAL_VERIFY'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $capitals=\Ismile\Cities::values();$result=[];
            foreach(['registrations','checkouts','sponsor_requests'] as $table){$rows=\Ismile\Db::all('SELECT city,COUNT(*) AS records FROM `'.$table.'` GROUP BY BINARY city ORDER BY city');foreach($rows as $row)if($row['city']!==null&&$row['city']!==''&&$row['city']!=='-'&&!in_array($row['city'],$capitals,true))throw new RuntimeException('Unmapped city remains');$result[$table]=$rows;}
            $html=shell_exec('php '.escapeshellarg('/opt/ismile-test/backend/tools/verify-deployment.php').' --render registrations');
            if(!is_string($html)||!preg_match('~<select[^>]*name="city"[^>]*>(.*?)</select>~s',$html,$match))throw new RuntimeException('City filter not rendered');
            preg_match_all('~<option[^>]*value="([^"]*)"~',$match[1],$options);$values=array_values(array_filter(array_map(static fn($v)=>html_entity_decode($v,ENT_QUOTES,'UTF-8'),$options[1]),static fn($v)=>$v!==''));
            if($values!==$capitals)throw new RuntimeException('City filter differs from capital list');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['cityValues'=>$result,'registrationFilterCapitals'=>count($values),'allKnownCitiesCanonical'=>true],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            CITY_FINAL_VERIFY
