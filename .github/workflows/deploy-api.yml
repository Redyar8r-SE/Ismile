name: Publish approved speaker content
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Merge approved speakers with backups
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'SPEAKERS_NODE'
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
            const additions=[{"name":{"en":"Dr. Fatien I. Al-Naqshabandi","ar":"د. فاتن إ. النقشبندي","ku":"د. فاتین ئـ. نەقشبەندی"},"role":{"en":"PhD Conservative, MSc Dental Materials, BDS","ar":"دكتوراه في طب الأسنان التحفظي، ماجستير في مواد طب الأسنان، بكالوريوس طب وجراحة الأسنان","ku":"دکتۆرا لە چارەسەری پارێزگارانەی ددان، ماستەر لە کەرەستەکانی پزیشکیی ددان، بەکالۆریۆس لە پزیشکی و نەشتەرگەریی ددان"},"topic":{"en":"From Preparation Geometry to Digital Verification: The Biomechanics of Posterior Overlays","ar":"من هندسة التحضير إلى التحقق الرقمي: الميكانيكا الحيوية للترميمات التراكبية الخلفية (Overlays)","ku":"لە ئەندازەی ئامادەکردنەوە تا پشتڕاستکردنەوەی دیجیتاڵ: بایۆمیکانیکی ئۆڤەرلەیەکانی ددانی دواوە"},"photo":"assets/speakers/fatien-al-naqshabandi.webp"}],hashes={"assets/speakers/fatien-al-naqshabandi.webp":"8981fa2cba5e22724dab4b00ab1296de80b84d3add822abc8aa05d93a7295865"};
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const candidates=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'.env'))&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'assets/speakers/shkar-hoshear.webp')));if(candidates.length!==1)throw Error('Expected one deployed website with approved speakers');
            const current=fs.realpathSync(candidates[0].pm2_env.pm_cwd);for(const [file,hash] of Object.entries(hashes))if(crypto.createHash('sha256').update(fs.readFileSync(path.join(current,file))).digest('hex')!==hash)throw Error('Deployed portrait mismatch: '+file);
            const env=fs.readFileSync(path.join(current,'.env'),'utf8'),match=env.match(/^CONTENT_ROOT=(.*)$/m),shared=match&&match[1].trim()?match[1].trim():path.resolve(current,'../../shared-content');
            const targets=[{file:path.join(shared,'data/speakers.json'),fallback:path.join(current,'data/speakers.json')},{file:'/opt/ismile-test/site/data/speakers.json',fallback:'/opt/ismile-test/repo/data/speakers.json'}],backup=path.join(path.dirname(shared),'content-backups','speakers-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            for(let i=0;i<targets.length;i++){const {file,fallback}=targets[i];if(!fs.existsSync(file)&&!fs.existsSync(fallback)){console.log('Skipped absent optional site '+i);continue;}const source=fs.existsSync(file)?file:fallback,raw=fs.readFileSync(source,'utf8'),doc=JSON.parse(raw);if(!Array.isArray(doc))throw Error('Invalid speakers');fs.writeFileSync(path.join(backup,i+'-speakers.json'),raw,{mode:0o600});for(const item of additions){const at=doc.findIndex(s=>s.name?.en===item.name.en);if(at>=0)doc[at]=item;else doc.push(item);}fs.mkdirSync(path.dirname(file),{recursive:true});const temp=file+'.speakers-writing';fs.writeFileSync(temp,JSON.stringify(doc,null,2)+String.fromCharCode(10));const stat=fs.statSync(source);fs.chmodSync(temp,stat.mode&0o777);fs.chownSync(temp,stat.uid,stat.gid);fs.renameSync(temp,file);console.log(JSON.stringify({updated:file,count:doc.length}));}
            SPEAKERS_NODE
