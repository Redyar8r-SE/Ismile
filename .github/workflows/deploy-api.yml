name: Workshop kawan-dt-rename
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: kawan-dt-rename
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            cat > /tmp/kawan-dt-rename.php <<'KAWAN_DT_RENAME'
            <?php
            require "/opt/ismile-test/backend/bootstrap.php";
            $rows=\Ismile\Db::all("SELECT id,title_en,speaker_en FROM workshops WHERE speaker_en=?",["Dr. Kawan Saleh"]);
            $done=\Ismile\Db::all("SELECT id FROM workshops WHERE speaker_en=?",["Dt. Kawan Saleh"]);
            if(!$rows && count($done)===1){echo "KAWAN_ALREADY=".json_encode($done)."\n";exit(0);}
            if(count($rows)!==1)throw new RuntimeException("Expected one workshop by Dr. Kawan Saleh, found ".count($rows));
            \Ismile\Backup::run();
            \Ismile\Db::run("UPDATE workshops SET speaker_en=?, updated_at=? WHERE id=?",["Dt. Kawan Saleh",\Ismile\App::now(),$rows[0]["id"]]);
            \Ismile\Workshops::syncWebsite();
            $owner=\Ismile\Db::one("SELECT id FROM admin_users WHERE role='owner' AND disabled_at IS NULL ORDER BY id LIMIT 1");
            if($owner)\Ismile\Audit::log((int)$owner["id"],"workshop.trainer_renamed",null,null,["workshop"=>$rows[0]["id"],"from"=>"Dr. Kawan Saleh","to"=>"Dt. Kawan Saleh"]);
            echo "KAWAN_UPDATED=".json_encode(\Ismile\Db::one("SELECT id,title_en,speaker_en FROM workshops WHERE id=?",[$rows[0]["id"]]))."\n";
            KAWAN_DT_RENAME
            runuser -u www-data -- php /tmp/kawan-dt-rename.php
            rm -f /tmp/kawan-dt-rename.php
