name: Workshop vip-inline-close
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: vip-inline-close workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'CLOSE_VIP_NOW'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\{App,Db};
            $count=(int)Db::value("SELECT COUNT(*) FROM registrations WHERE ticket_type='vip' AND status IN ('paid','complimentary')");if($count<1)throw new RuntimeException('VIP allocation must be reviewed');
            Db::transaction(static function(){foreach(['vip_registration_limit'=>'1','vip_package_sales_open'=>'0'] as $key=>$value)Db::run('INSERT INTO settings(k,v,updated_at) VALUES(?,?,?) ON DUPLICATE KEY UPDATE v=VALUES(v),updated_at=VALUES(updated_at)',[$key,$value,App::now()]);});
            CLOSE_VIP_NOW
            runuser -u www-data -- php <<'VERIFY_VIP_CLOSED'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';$s=\Ismile\Registrations::publicState('en');if($s['vip']['available'])throw new RuntimeException('VIP is still available');echo 'WORKSHOPS_VERIFIED='.json_encode(['vipClosed'=>true,'normalRegistrationOpen'=>$s['open']]).PHP_EOL;
            VERIFY_VIP_CLOSED
