name: Verify live payment reports
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Verify deployed code and receipt calculations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'PAYMENT_REPORT_NODE'
            const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
            const files={"/opt/ismile-test/site/admin/admin.css":"989c0f762b064ddcdd9fb40430a4b69a466addfbf260d331d025869282983c6d","/opt/ismile-test/site/admin/export.php":"167472fb340b29fc2494bb79a657a44d897c2ed97c04542eb8f202163471e97e","/opt/ismile-test/site/admin/lists.php":"7329ba922b9b2eb7092fc19f7f2ff055f4dfecef0727a1f9dec5223086f1b3bf","/opt/ismile-test/backend/src/Admin/Lists.php":"a57375008707867cff8c420f8c3efc3ebc3dba16a4675f7f43ebfbcbb1d3cafd","/opt/ismile-test/backend/src/Admin/PdfReport.php":"d163c9dd81e7ce8d1ae97799aa1518153b5d95c2eeea7f167aa4326f333a398a","/opt/ismile-test/backend/src/Admin/PaymentBreakdown.php":"4a16d4f67e8ac3b2e579f82649ecc2f29147602bd1d41dd73f7b76ec894aca5b","/opt/ismile-test/backend/src/Payments/Payments.php":"0413b6efec168b6aa61a8865500dd6e7fe24f97bde277916f6cec2f56f524188","/opt/ismile-test/backend/tests/payment-breakdown.php":"3a18b373c49a0c4c57dbf03329d8b43bca43d14405e4ea3445a35b34f2c4f8e6"};
            for(const [file,want] of Object.entries(files)){const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');if(actual!==want)throw Error('Deployed file mismatch: '+file);if(file.endsWith('.php'))cp.execFileSync('php',['-l',file],{stdio:'pipe'});console.log('Verified '+file);}
            cp.execFileSync('php',['-r',"require '/opt/ismile-test/backend/vendor/autoload.php'; if(!class_exists('Ismile\\Admin\\PaymentBreakdown'))exit(1); echo 'Deployed payment formatter loads.\n';"],{stdio:'inherit'});
            cp.execFileSync('php',['/opt/ismile-test/backend/tests/payment-breakdown.php'],{stdio:'inherit'});
            console.log('Live payment report code verified without accessing registrations or changing payments.');
            PAYMENT_REPORT_NODE
