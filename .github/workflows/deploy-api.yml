name: Desk readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Check Workshop & Register readiness (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set -eu
            printf '%s\n' 'a6105b6a7166d6e21eb6a617bd409bbd014c171de47966ec98956581546a598d  /opt/ismile-test/site/admin/desk.php' | sha256sum --check
            cd /opt/ismile-test
            R=backend/tools/verify-deployment.php
            REG=$(runuser -u www-data -- php $R --render desk '' volunteer)
            WS=$(runuser -u www-data -- php $R --render desk 'tab=workshop' volunteer)
            has() { printf '%s' "$1" | grep -q -- "$2" && echo yes || echo NO; }
            echo "PAGE register: form=$(has "$REG" 'id="caller-form"') confirm=$(has "$REG" 'id="cash-confirm"') vip=$(has "$REG" 'value="vip"') vipWorkshop=$(has "$REG" 'id="caller-vip-workshop"') photoBox=$(has "$REG" 'caller-id-upload') errors=$(printf '%s' "$REG" | grep -c -E 'Fatal|Warning:|Uncaught')"
            echo "PAGE workshop: search=$(has "$WS" 'Step 1') errors=$(printf '%s' "$WS" | grep -c -E 'Fatal|Warning:|Uncaught')"
            echo "MENU volunteer items: $(printf '%s' "$REG" | grep -o 'class="nav-link' | wc -l)"
            runuser -u www-data -- php <<'DESK'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\Db; use Ismile\Settings;
            $p = \Ismile\Payments\PsoolaPrices::get();
            $out = [
              'volunteerRoleInDatabase' => str_contains((string) Db::value("SELECT COLUMN_TYPE FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'admin_users' AND column_name = 'role'"), "'volunteer'"),
              'volunteerAccounts' => (int) Db::value("SELECT COUNT(*) FROM admin_users WHERE role = 'volunteer' AND disabled_at IS NULL"),
              'gateway' => \Ismile\App::config('payments.gateway'),
              'registrationOpen' => Settings::bool('registration_open'),
              'psoolaPrices' => $p ? ['currency' => $p['currency'], 'dentist' => $p['ticketTypes']['professional'], 'student' => $p['ticketTypes']['student'], 'vip' => $p['ticketTypes']['vip'], 'lunch1' => $p['lunch']['day1'], 'lunch2' => $p['lunch']['day2']] : 'NOT AVAILABLE',
              'pricesReady' => ['dentist' => \Ismile\SiteData::pricesReadyFor(['ticket_type' => 'professional', 'lunch_day1' => 1, 'lunch_day2' => 1]), 'student' => \Ismile\SiteData::pricesReadyFor(['ticket_type' => 'student', 'lunch_day1' => 0, 'lunch_day2' => 0]), 'vip' => \Ismile\SiteData::pricesReadyFor(['ticket_type' => 'vip', 'lunch_day1' => 1, 'lunch_day2' => 1, 'vip_lunch_day' => 1])],
              'vipPackage' => ['enabled' => \Ismile\VipPackages::enabled(), 'salesOpen' => Settings::bool('vip_package_sales_open'), 'ready' => \Ismile\VipPackages::ready()],
              'vipSeatsFull' => \Ismile\VipCapacity::full(false),
              'workshops' => [],
            ];
            foreach (\Ismile\Workshops::all() as $w) {
              if ($w['organizer'] !== 'ismile' || empty($w['providerEventId']) || $w['currency'] !== 'IQD') continue;
              $c = \Ismile\WorkshopCatalog::one($w['id'], true); $q = null;
              try { $q = \Ismile\WorkshopCashSale::quote($w, $c)['iqd']; } catch (\Throwable) {}
              $out['workshops'][$w['id']] = ['priceIQD' => $q, 'seatsLeft' => $c['seatsLeft'] ?? null, 'verified' => $c['availabilityVerified'] ?? false];
            }
            echo 'DESK=' . json_encode($out, JSON_UNESCAPED_SLASHES) . PHP_EOL;
            DESK
