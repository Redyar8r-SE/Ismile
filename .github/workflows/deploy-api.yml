name: Workshop qais-speaker-sync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: qais-speaker-sync workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            node <<'QAIS_SPEAKER_SYNC'
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');
            const speaker={"name":{"en":"Dr. Qais Aljumaily","ar":"د. قيس الجميلي","ku":"د. قەیس ئەلجومەیلی"},"role":{"en":"B.D.S., H.D.D. (Prosthodontics), F.K.H.C.M.S. (Restorative Dentistry)","ar":"B.D.S.، H.D.D. (التعويضات السنية)، F.K.H.C.M.S. (طب الأسنان الترميمي)","ku":"B.D.S.، H.D.D. (جێگرەوەی ددان)، F.K.H.C.M.S. (چاککردنەوەی ددان)"},"topic":{"en":"Beyond the Layers (Deep Impact of Indirect Restorations)","ar":"ما وراء الطبقات (التأثير العميق للترميمات غير المباشرة)","ku":"لە پشت چینەکانەوە (کاریگەریی قووڵی چاککردنەوە ناڕاستەوخۆکانی ددان)"},"photo":"assets/speakers/qais-aljumaily.webp"},expectedHash='1ee8b0c7e61ad2e529b6925a1491b5b94e72d440fd32532f8d993e87d9682ae2';
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']})),matches=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'js/sections/speakers.js')));if(matches.length!==1)throw Error('Website process ambiguous');
            const current=fs.realpathSync(matches[0].pm2_env.pm_cwd),env=fs.readFileSync(path.join(current,'.env'),'utf8'),match=env.match(/^CONTENT_ROOT=(.*)$/m),shared=match?.[1]?.trim()||path.join(current,'.site-content'),targets=[{root:shared,fallback:current},{root:'/opt/ismile-test/site',fallback:'/opt/ismile-test/site'}];
            let total=0;
            for(const [i,target] of targets.entries()){
             const destination=path.join(target.root,'data/speakers.json'),fallback=path.join(target.fallback,'data/speakers.json'),file=fs.existsSync(destination)?destination:fallback;
             const original=fs.readFileSync(file,'utf8'),rows=JSON.parse(original),others=JSON.stringify(rows.filter(s=>!/qais|aljumaily/i.test(s.name?.en||''))),found=rows.map((s,n)=>/qais|aljumaily/i.test(s.name?.en||'')?n:-1).filter(n=>n>=0);if(found.length>1)throw Error('Duplicate Qais identity');
             if(found.length)rows[found[0]]=speaker;else rows.push(speaker);if(JSON.stringify(rows.filter(s=>!/qais|aljumaily/i.test(s.name?.en||'')))!==others)throw Error('Other speakers changed');
             const backup='/opt/ismile-test/backend/storage/tmp/qais-speaker-before-'+i+'.json';if(!fs.existsSync(backup))fs.writeFileSync(backup,original,{mode:0o600});
             const source=path.join(target.fallback,'assets/workshops/qais-aljumaily.webp'),photo=fs.readFileSync(source);if(crypto.createHash('sha256').update(photo).digest('hex')!==expectedHash)throw Error('Portrait differs from approved image');
             const portrait=path.join(target.fallback,speaker.photo),imageStat=fs.statSync(source);fs.mkdirSync(path.dirname(portrait),{recursive:true});fs.writeFileSync(portrait,photo);fs.chmodSync(portrait,imageStat.mode&0o777);fs.chownSync(portrait,imageStat.uid,imageStat.gid);
             const stat=fs.statSync(file),temporary=destination+'.qais-writing';fs.mkdirSync(path.dirname(destination),{recursive:true});fs.writeFileSync(temporary,JSON.stringify(rows,null,2)+String.fromCharCode(10));fs.chmodSync(temporary,stat.mode&0o777);fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,destination);total=rows.length;
            }
            console.log('WORKSHOPS_VERIFIED='+JSON.stringify({speaker:speaker.name.en,topic:speaker.topic.en,speakers:total,languages:3,portraitVerified:true,otherSpeakersPreserved:true}));
            QAIS_SPEAKER_SYNC
