name: Workshop audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: audit workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'WORKSHOP_AUDIT_PHP'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $rows=\Ismile\Db::all("SELECT w.id,w.title_en,w.speaker_en,w.organizer,w.company_en,w.company_phone,w.total_seats,w.price,w.currency,w.status,(SELECT COUNT(*) FROM workshop_bookings b WHERE b.workshop_id=w.id) AS bookings,(SELECT COUNT(*) FROM workshop_bookings b WHERE b.workshop_id=w.id AND b.removed_at IS NULL) AS active_bookings FROM workshops w ORDER BY w.sort_order,w.id");
            echo 'WORKSHOPS_INVENTORY='.json_encode($rows,JSON_UNESCAPED_SLASHES).PHP_EOL;
            WORKSHOP_AUDIT_PHP
            node <<'WORKSHOP_AUDIT_NODE'
            const fs=require('fs'),cp=require('child_process'),path=require('path');
            const secret=fs.readFileSync('/opt/ismile-test/secrets.env','utf8').match(/^SITE_PASS=(.*)$/m)?.[1]?.trim();
            (async()=>{
            for(const route of ['workshops.html','data/workshops.json']){
            const r=await fetch('http://127.0.0.1:8081/'+route,{headers:{Host:'api.ismile.krd',Authorization:'Basic '+Buffer.from('ismile:'+secret).toString('base64')}});
            if(!r.ok)throw Error('Reference HTTP '+r.status);const text=await r.text();
            console.log((route.endsWith('.html')?'WORKSHOP_PAGE_HTML=':'WORKSHOPS_CARDS=')+(route.endsWith('.html')?Buffer.from(text).toString('base64'):text.replace(/\n/g,'')));
            }
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            for(const app of apps){const dir=app.pm2_env?.pm_cwd;if(dir&&fs.existsSync(path.join(dir,'server/node-server.mjs'))){const env=fs.readFileSync(path.join(dir,'.env'),'utf8');const shared=env.match(/^CONTENT_ROOT=(.*)$/m)?.[1]?.trim()||path.resolve(dir,'../../shared-content');console.log('WEBSITE_STATE='+JSON.stringify({name:app.name,current:dir,contentRoot:shared,workshops:fs.existsSync(path.join(shared,'data/workshops.json'))?JSON.parse(fs.readFileSync(path.join(shared,'data/workshops.json'),'utf8')):null}));}}
            })().catch(e=>{console.error(e.message);process.exitCode=1});
            WORKSHOP_AUDIT_NODE
