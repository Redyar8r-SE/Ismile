name: Badges QR missing reasons
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Count why badge QRs are missing (read-only, counts only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set -eu
            printf '%s\n' 'b857f71ebd0efb5d519d691d31c1d18a9d22dffd67e95e06743240995137f2f5  /opt/ismile-test/backend/src/PsoolaTickets.php' | sha256sum --check
            runuser -u www-data -- php <<'QR_REASONS'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\Db;
            $rows = Db::all("SELECT r.id, r.ticket_type, r.status, r.pay_method FROM registrations r JOIN tickets t ON t.registration_id = r.id
                WHERE r.status IN ('paid','complimentary') AND t.cancelled_at IS NULL
                AND NOT EXISTS (SELECT 1 FROM badge_ticket_codes c WHERE c.registration_id = r.id)");
            $gateway = new \Ismile\Payments\PsoolaGateway();
            $reasons = [];
            $add = static function (string $key) use (&$reasons): void { $reasons[$key] = ($reasons[$key] ?? 0) + 1; };
            foreach ($rows as $r) {
                $prefix = $r['ticket_type'] . '/' . $r['status'] . ': ';
                $source = \Ismile\PsoolaTickets::source((int) $r['id']);
                if (!$source || !$source['id']) {
                    $gw = (string) Db::value('SELECT gateway FROM payments WHERE registration_id = ? ORDER BY id DESC LIMIT 1', [$r['id']]);
                    $add($prefix . 'no PSOOLA order (payment gateway: ' . ($gw !== '' ? $gw : 'none') . ', method: ' . $r['pay_method'] . ')');
                    continue;
                }
                try {
                    $order = $gateway->getOrder((string) $source['id']);
                    $statuses = array_count_values(array_map(static fn ($t) => (string) ($t['status'] ?? '?'), (array) ($order['tickets'] ?? [])));
                    ksort($statuses);
                    $add($prefix . 'PSOOLA order ' . ($order['status'] ?? '?') . ', tickets ' . ($statuses ? json_encode($statuses) : 'none'));
                } catch (\Throwable $error) {
                    $add($prefix . 'PSOOLA lookup failed');
                }
            }
            ksort($reasons);
            echo 'QR_MISSING=' . json_encode(['missing' => count($rows), 'reasons' => $reasons]) . PHP_EOL;
            QR_REASONS
