name: Workshop vip-capacity-sync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: vip-capacity-sync workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            node <<'VIP_COPY_SYNC'
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),labels={"en":"Unavailable","ar":"غير متاح","ku":"بەردەست نییە"};
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']})),matches=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'js/sections/registration.js')));if(matches.length!==1)throw Error('Website process ambiguous');const current=fs.realpathSync(matches[0].pm2_env.pm_cwd),env=fs.readFileSync(path.join(current,'.env'),'utf8'),m=env.match(/^CONTENT_ROOT=(.*)$/m),shared=m&&m[1].trim()?m[1].trim():path.resolve(current,'../../shared-content'),backup=path.join(path.dirname(shared),'content-backups','vip-capacity-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            for(const root of [shared,'/opt/ismile-test/site'])for(const [lang,label]of Object.entries(labels)){const p='data/i18n/site-'+lang+'.json',file=path.join(root,p),source=fs.existsSync(file)?file:path.join(current,p),raw=fs.readFileSync(source,'utf8'),doc=JSON.parse(raw),stat=fs.statSync(source);fs.writeFileSync(path.join(backup,(root===shared?'public-':'backend-')+lang+'.json'),raw,{mode:0o600});doc.vip_unavailable=label;const temporary=file+'.vip-writing';fs.writeFileSync(temporary,JSON.stringify(doc,null,2)+String.fromCharCode(10));fs.chmodSync(temporary,stat.mode&0o777);fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,file);}
            VIP_COPY_SYNC
            runuser -u www-data -- php <<'VIP_LIVE_VERIFY'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $state=\Ismile\Registrations::publicState('en');$count=(int)\Ismile\Db::value("SELECT COUNT(*) FROM registrations WHERE ticket_type='vip' AND status IN ('paid','complimentary')");
            if(\Ismile\VipCapacity::LIMIT!==6||array_keys($state['vip'])!==['available']||$count>6)throw new RuntimeException('VIP limit verification failed');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['vipLimit'=>6,'existingVip'=>$count,'available'=>$state['vip']['available'],'publicCountsExposed'=>false,'labelsSynced'=>true]).PHP_EOL;
            VIP_LIVE_VERIFY
