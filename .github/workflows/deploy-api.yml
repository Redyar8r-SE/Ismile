name: Workshop free-workshop-api-v2-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: free-workshop-api-v2-check workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'FREE_WORKSHOP_API_V2_PHP'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\App;use Ismile\Db;use Ismile\Payments\PsoolaGateway;
            $id='subperiosteal-implant-protocol';$file=App::storage('tmp/'.$id.'-psoola-management.json');$lock=fopen($file.'.lock','c');if(!$lock||!flock($lock,LOCK_EX|LOCK_NB))throw new RuntimeException('Free workshop management is busy');
            $state=json_decode((string)file_get_contents($file),true,512,JSON_THROW_ON_ERROR);$gateway=new PsoolaGateway();
            $save=static function()use(&$state,$file):void{file_put_contents($file.'.writing',json_encode($state,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR),LOCK_EX);chmod($file.'.writing',0600);rename($file.'.writing',$file);};
            if(!isset($state['ticketTypeId'])){
             $body=['showId'=>$state['showId'],'ticket'=>['name'=>'Workshop Admission','description'=>'Dr. Ako Omar and Dr. Rezhin Kawa, assisted by Dr. Zhiwar Omar. Free workshop registration. A paid iSmile summit ticket is required. Suitable for all experience levels.','price'=>0,'quantity'=>30,'maxPerOrder'=>1]];
             $key='ismile-ws-'.$id.'-free-ticket-v2';$request=['method'=>'POST','path'=>'events/'.$state['eventId'].'/ticket-types','body'=>$body,'key'=>$key];if(isset($state['requests']['free-ticket-v2'])&&$state['requests']['free-ticket-v2']!==$request)throw new RuntimeException('Saved free ticket request changed');$state['requests']['free-ticket-v2']=$request;$save();
             $answer=$gateway->partnerRequest('POST','manage/'.$request['path'],$body,['Idempotency-Key: '.$key]);if(!in_array($answer['status'],[200,201],true))throw new RuntimeException('Free ticket HTTP '.$answer['status'].' '.json_encode($answer['json']));
             $state['responses']['free-ticket-v2']=$answer['json'];$tickets=array_values(array_filter($answer['json']['ticketTypes']??[],static fn($t)=>$t['showId']===$state['showId']&&$t['name']==='Workshop Admission'&&(int)$t['price']===0&&(int)$t['quantity']===30&&($t['maxPerOrder']??null)===1));if(count($tickets)!==1)throw new RuntimeException('Free ticket does not match 0 IQD, 30 seats, max 1 per order');$state['ticketTypeId']=$tickets[0]['_id'];$save();
            }
            $bookings=(int)Db::value('SELECT COUNT(*) FROM workshop_bookings WHERE workshop_id=? AND removed_at IS NULL',[$id]);$native=(int)Db::value("SELECT COUNT(*) FROM workshop_checkouts WHERE workshop_id=? AND provider_status='paid' AND provider_session_id IS NULL",[$id]);
            echo 'WORKSHOPS_INVENTORY='.json_encode(['workshopId'=>$id,'eventId'=>$state['eventId'],'showId'=>$state['showId'],'ticketTypeId'=>$state['ticketTypeId'],'price'=>0,'seats'=>30,'maxPerOrder'=>1,'existingBookings'=>$bookings,'nativeConfirmedRegistrations'=>$native,'published'=>false],JSON_UNESCAPED_SLASHES).PHP_EOL;
            FREE_WORKSHOP_API_V2_PHP
