name: Publish Komar partner content
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT TARGET; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Update persistent partner lists with backups
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET: ${{ env.TARGET }}
        with:
          envs: TARGET
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'KOMAR_CONTENT_NODE'
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
            const base=process.env.TARGET;if(!base||!path.isAbsolute(base))throw Error('Missing deploy target');
            const current=fs.realpathSync(path.join(base,'current'));
            const environment=fs.readFileSync(path.join(current,'.env'),'utf8');
            const match=environment.match(/^CONTENT_ROOT=(.*)$/m);const shared=match&&match[1].trim()?match[1].trim():path.join(base,'shared-content');
            const asset=path.join(current,"assets/partners/komar-2026.png");if(crypto.createHash('sha256').update(fs.readFileSync(asset)).digest('hex')!=="9212f23525a104d53233b2529435c436a7d9e3b1b54b0683ece68206b8146c74")throw Error('Deployed logo does not match');
            const partner={"kind":"scientific","role":{"en":"Scientific Partner","ar":"الشريك العلمي","ku":"هاوبەشی زانستی"},"name":{"en":"Komar University of Science and Technology","ar":"جامعة كومار للعلوم والتكنولوجيا","ku":"زانکۆی کۆمار بۆ زانست و تەکنەلۆژیا"},"note":{"en":"زانکۆی کۆمار بۆ زانست و تەکنەلۆژیا","ar":"جامعة كومار للعلوم والتكنولوجيا","ku":"زانکۆی کۆمار بۆ زانست و تەکنەلۆژیا"},"logo":"assets/partners/komar-2026.png","logo2":null};
            const targets=[{file:path.join(shared,'data/summit-partners.json'),fallback:path.join(current,'data/summit-partners.json')},{file:'/opt/ismile-test/site/data/summit-partners.json',fallback:'/opt/ismile-test/repo/data/summit-partners.json'}];
            const backup=path.join(base,'content-backups','komar-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            for(let i=0;i<targets.length;i++){const {file,fallback}=targets[i],source=fs.existsSync(file)?file:fallback;const original=fs.readFileSync(source,'utf8'),doc=JSON.parse(original);if(!Array.isArray(doc.partners))throw Error('Invalid partners');fs.writeFileSync(path.join(backup,i+'-summit-partners.json'),original,{mode:0o600});const old=doc.partners.findIndex(p=>/komar|کۆمار|كومار/i.test(JSON.stringify(p.name)));if(old>=0)doc.partners.splice(old,1);let index=doc.partners.findLastIndex(p=>p.kind==='scientific')+1;if(!index)index=doc.partners.findIndex(p=>p.kind==='accreditation');doc.partners.splice(index<0?doc.partners.length:index,0,partner);fs.mkdirSync(path.dirname(file),{recursive:true});const temporary=file+'.komar-writing';fs.writeFileSync(temporary,JSON.stringify(doc,null,2)+'\n');const stat=fs.statSync(source);fs.chmodSync(temporary,stat.mode&0o777);fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,file);console.log(JSON.stringify({updated:file,partners:doc.partners.length}));}
            KOMAR_CONTENT_NODE
