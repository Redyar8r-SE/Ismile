name: PSOOLA zero-price catalogue check (GET only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load existing SSH connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Read PSOOLA catalogue and encrypt the result
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'PSOOLA_READ_ONLY_CATALOGUE'
            const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
            let report;
            try{report=JSON.parse(cp.execFileSync('php',['-r',"\nrequire '/opt/ismile-test/backend/bootstrap.php';\n$event=(new \\Ismile\\Payments\\PsoolaGateway())->fetchEvent();\n$configured=(array)\\Ismile\\App::config('payments.psoola.ticket_types',[]);\n$showId=(string)\\Ismile\\App::config('payments.psoola.show_id','');\n$report=['checked_at'=>gmdate('c'),'request_method'=>'GET','endpoint'=>'events/{configured-event-id}',\n 'issuance_paused'=>!\\Ismile\\SponsoredTickets::issuanceAvailable(),\n 'configured_event_id'=>\\Ismile\\App::config('payments.psoola.event_id'),\n 'configured_show_id'=>$showId,'configured_ticket_types'=>$configured,\n 'configured_free_ticket_types'=>\\Ismile\\App::config('payments.psoola.free_ticket_types',[]),'tickets'=>[]];\nforeach(($event['shows']??[]) as $show)foreach(($show['ticketTypes']??[]) as $type){\n $name=$type['name']??$type['title']??null;\n if(is_array($name))$name=$name['en']??null;\n $report['tickets'][]=['show_id'=>$show['id']??null,'configured_show'=>($show['id']??null)===$showId,\n  'id'=>$type['id']??null,'name'=>$name,'price'=>$type['price']??null,\n  'currency'=>$type['currency']??$event['currency']??null,'available'=>$type['available']??null,\n  'configured_as'=>array_search($type['id']??null,$configured,true)?:null];\n}\necho json_encode($report,JSON_THROW_ON_ERROR|JSON_UNESCAPED_UNICODE);\n"],{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:60000}));}
            catch(error){report={checked_at:new Date().toISOString(),request_method:'GET',catalogue_lookup_failed:true,exit_code:error.status??null};}
            const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
            const data=Buffer.concat([cipher.update(JSON.stringify(report),'utf8'),cipher.final()]);
            const wrapped=crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAljm7KakUW8zw1A50X95G\npIdqhWx7T1GxPsIsSyTJDw/pX7I77/Vr435lcS9txQHM1y4qaAw+ZLC+COEQJLg2\n0+a5uMLPSxWCQVD+0dtv7UeLtxMCeKZ1do27E6Nv5QK8CDiKUj4qN16HtErguGZZ\naAhWG0JsCFgHQdxYBxNAnOmLnf8hRdvTNYfIoTCVl2xbO8xMMo6+Og/oSD0SdCiN\nU3Mk9ee7chGU1B85RdIhx32A+QthnEJ9nmvttfMSgXHRQN5atyNsIFMKx16YSKzW\n/cU1x96aMn31udXW2RJjVuenYXtWJkh152d7Q5misfA+cbyS840r74o4BJ0t+R6n\nTtkB1sYw189Cj8xPyxHi/kQ/fK9q3jgwC+fH9EbHNI3U1ZEz8ZrEkr2oCixNP2ee\nib9oenOHF6DOAF0oVbnLbh9r8S8hStSZVX1vFXKZQbTBM8aRhIoVqGUM1ykZUmo/\nHEjpuAGb8VP6Zp0R/OqXMDdzeDp5OV+idRdwfAvZ/AXjAgMBAAE=\n-----END PUBLIC KEY-----\n",oaepHash:'sha256'},key);
            console.log('ENCRYPTED_CATALOGUE:'+Buffer.from(JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')})).toString('base64'));
            PSOOLA_READ_ONLY_CATALOGUE
