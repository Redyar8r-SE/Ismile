name: Workshop online-verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: online-verify workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'WORKSHOP_ONLINE_VERIFY'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            if(!(int)\Ismile\Db::value("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='workshop_checkouts'"))throw new RuntimeException('Checkout table missing.');
            if(!str_contains((string)file_get_contents('/opt/ismile-test/site/api/workshop-register.php'),'WorkshopCheckout::start'))throw new RuntimeException('Email registration is not using checkout.');
            if(!str_contains((string)file_get_contents('/opt/ismile-test/backend/src/Payments/Payments.php'),'WorkshopCheckout::reconcile'))throw new RuntimeException('Workshop payment webhook mapping missing.');
            $bookings=(int)\Ismile\Db::value('SELECT COUNT(*) FROM workshop_bookings');$attempts=(int)\Ismile\Db::value('SELECT COUNT(*) FROM workshop_checkouts');
            try{\Ismile\WorkshopCheckout::start('crown-vs-veneer','online-not-registered@example.invalid');throw new RuntimeException('Unregistered attendee could open checkout.');}catch(\Ismile\UserError $e){if($e->key!=='wd_err_not_registered')throw $e;}
            try{\Ismile\WorkshopCheckout::status(str_repeat('a',64));throw new RuntimeException('Unknown token could query a payment.');}catch(\Ismile\UserError $e){if($e->status!==404)throw $e;}
            if($bookings!==(int)\Ismile\Db::value('SELECT COUNT(*) FROM workshop_bookings')||$attempts!==(int)\Ismile\Db::value('SELECT COUNT(*) FROM workshop_checkouts'))throw new RuntimeException('Negative eligibility checks changed registrations.');
            $rows=\Ismile\WorkshopCatalog::all();foreach($rows as $w)if(!$w['availabilityVerified'])throw new RuntimeException('Provider unavailable.');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['flow'=>'email -> PSOOLA checkout -> verified payment -> paid workshop registration','unregistered_blocked'=>true,'unknown_payment_token_blocked'=>true,'workshop_count'=>count($rows),'no_purchase_created_by_verification'=>true,'checkout_attempts'=>$attempts,'existing_bookings'=>$bookings],JSON_UNESCAPED_SLASHES).PHP_EOL;
            WORKSHOP_ONLINE_VERIFY
