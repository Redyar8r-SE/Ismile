name: Publish approved sponsor content
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Merge approved sponsors into persistent content with backups
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'SPONSORS_CONTENT_NODE'
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const candidates=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'.env'))&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'assets/sponsors/dentstar-silver-white.webp')));
            if(candidates.length!==1)throw Error('Expected one deployed website containing approved sponsor artwork');
            const current=fs.realpathSync(candidates[0].pm2_env.pm_cwd),hashes={"assets/sponsors/dental-blueprint-gold.webp":"660ec6ecf0b1e7fc30c25ba41450dd3ea6ddfd2b900864103d2f63f104e1b1c9","assets/sponsors/dentstar-silver-white.webp":"9eafb3944e60e86487e6cae6d0f13923b66cb2bfa7ee94d93244edb464241bc5","assets/sponsors/venus-dental-lab-silver.webp":"8a52ed5ea8b9d29998bd9146ed3efcc061f3e31aa687e7c4e260b2fee6faaafe","assets/sponsors/elite-dental-silver.webp":"8abcb4253dc2793ebbe79bec3b20e638415098e753ec3e1d025987b5381784a6","assets/sponsors/dentick-bronze-hq.webp":"886b1a35d8045e79c31c9aad4c0d8f255d3d173df9fd533aa7e0851f1aadbfc6"},additions=[{"name":"Dental Blueprint","tier":"gold","logo":"assets/sponsors/dental-blueprint-gold.webp","bg":"#18363F","tile":true},{"name":"DentStar Company","tier":"silver","logo":"assets/sponsors/dentstar-silver-white.webp","bg":"#18363F","tile":true},{"name":"Venus Dental Lab","tier":"silver","logo":"assets/sponsors/venus-dental-lab-silver.webp","bg":"#18363F","tile":true},{"name":"Elite Dental","tier":"silver","logo":"assets/sponsors/elite-dental-silver.webp","bg":"#18363F","tile":true},{"name":"Dentick Company","tier":"bronze","logo":"assets/sponsors/dentick-bronze-hq.webp","bg":"#18363F","tile":true}];
            for(const [file,hash] of Object.entries(hashes)){if(crypto.createHash('sha256').update(fs.readFileSync(path.join(current,file))).digest('hex')!==hash)throw Error('Deployed image mismatch: '+file);}
            const environment=fs.readFileSync(path.join(current,'.env'),'utf8'),match=environment.match(/^CONTENT_ROOT=(.*)$/m);const shared=match&&match[1].trim()?match[1].trim():path.resolve(current,'../../shared-content');
            const targets=[{file:path.join(shared,'data/sponsors.json'),fallback:path.join(current,'data/sponsors.json')},{file:'/opt/ismile-test/site/data/sponsors.json',fallback:'/opt/ismile-test/repo/data/sponsors.json'}];
            const backup=path.join(path.dirname(shared),'content-backups','sponsors-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            for(let i=0;i<targets.length;i++){const {file,fallback}=targets[i];if(!fs.existsSync(file)&&!fs.existsSync(fallback)){console.log('Skipped absent optional site '+i);continue;}const source=fs.existsSync(file)?file:fallback,raw=fs.readFileSync(source,'utf8'),doc=JSON.parse(raw);if(!Array.isArray(doc.sponsors))throw Error('Invalid sponsor content');fs.writeFileSync(path.join(backup,i+'-sponsors.json'),raw,{mode:0o600});for(const item of additions){const at=doc.sponsors.findIndex(s=>s.name===item.name);if(at>=0)doc.sponsors[at]=item;else{const last=doc.sponsors.findLastIndex(s=>s.tier===item.tier);doc.sponsors.splice(last<0?doc.sponsors.length:last+1,0,item);}}fs.mkdirSync(path.dirname(file),{recursive:true});const temp=file+'.sponsors-writing';fs.writeFileSync(temp,JSON.stringify(doc,null,2)+'\n');const stat=fs.statSync(source);fs.chmodSync(temp,stat.mode&0o777);fs.chownSync(temp,stat.uid,stat.gid);fs.renameSync(temp,file);console.log(JSON.stringify({updated:file,count:doc.sponsors.length}));}
            SPONSORS_CONTENT_NODE
