name: Check-ins readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Check PSOOLA check-in copy (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set -eu
            printf '%s\n' 'e5deb43f70dbfd9e8ace7bd24b140c1aea5551212b07fba25a5fe55b017f81d8  /opt/ismile-test/backend/src/Payments/PsoolaCheckIns.php' | sha256sum --check
            CRON=$(grep -c 'run.php five' /etc/cron.d/ismile-test || true)
            runuser -u www-data -- env CRON_FIVE="$CRON" php <<'CHECKINS'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\Db; use Ismile\Settings; use Ismile\Payments\PsoolaCheckIns;
            $scans = []; $cursor = null; $pages = 0; $gateway = new \Ismile\Payments\PsoolaGateway();
            do { $page = $gateway->listCheckIns($cursor); array_push($scans, ...$page['checkIns']); $cursor = $page['next']; } while ($cursor !== null && ++$pages < 100);
            $find = new ReflectionMethod(PsoolaCheckIns::class, 'ticketIdFor');
            $matched = 0; $onEventDays = 0; $scanDates = [];
            foreach ($scans as $scan) {
                if ($find->invoke(null, $scan) !== null) $matched++;
                if (PsoolaCheckIns::days($scan)) $onEventDays++;
                $ms = $scan['firstScannedAt'] ?? null;
                if (is_int($ms) || is_float($ms)) { $d = date('Y-m-d', (int) floor($ms / 1000)); $scanDates[$d] = ($scanDates[$d] ?? 0) + 1; }
            }
            ksort($scanDates);
            echo 'CHECKINS=' . json_encode([
                'gatewayIsPsoola' => PsoolaCheckIns::active(),
                'eventDay1' => Settings::get('event_day1'), 'eventDay2' => Settings::get('event_day2'),
                'serverTimezone' => date_default_timezone_get(), 'serverNow' => date('Y-m-d H:i'),
                'fiveMinuteCronInstalled' => (int) getenv('CRON_FIVE') > 0,
                'lastCopiedFromPsoola' => Settings::get('psoola_checkins_synced_at'),
                'psoolaScansSoFar' => count($scans), 'scansMatchedToOurGuests' => $matched, 'scansOnEventDays' => $onEventDays, 'scanDates' => $scanDates,
                'attendanceRows' => Db::all('SELECT event_day, checkin_method, COUNT(*) AS n FROM ticket_attendance GROUP BY event_day, checkin_method'),
            ]) . PHP_EOL;
            CHECKINS
