name: Workshop checkout-preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: checkout-preflight workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'WORKSHOP_CHECKOUT_PREFLIGHT'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $hosts=[];foreach(\Ismile\Db::all("SELECT redirect_url FROM payments WHERE gateway='psoola' AND redirect_url IS NOT NULL ORDER BY id DESC LIMIT 20") as $row){$host=parse_url($row['redirect_url'],PHP_URL_HOST);if($host)$hosts[$host]=true;}
            echo 'WORKSHOPS_VERIFIED='.json_encode(['existing_checkout_hosts'=>array_keys($hosts),'workshop_bookings'=>(int)\Ismile\Db::value('SELECT COUNT(*) FROM workshop_bookings'),'workshop_orders'=>(int)\Ismile\Db::value('SELECT COUNT(*) FROM workshop_ticket_orders')]).PHP_EOL;
            WORKSHOP_CHECKOUT_PREFLIGHT
