name: Workshop workshop-paid-cash-verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: workshop-paid-cash-verify workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            printf '%s\n' '8b1000c206d28b20b0b497236b3d3c34ac1ef441cccc6746a7edc49203b85d39  /opt/ismile-test/site/admin/_workshop_controller.php' | sha256sum --check
            printf '%s\n' 'b77584195b6bdccc35272de89e888707a11b076ffce7ed60253486a9b7f1040d  /opt/ismile-test/site/admin/_workshop_workspace.php' | sha256sum --check
            printf '%s\n' '98fe8c83b4b6bb24d3030fb03a1b724f0e29800b1aa7d3ca3fc0f75a2d229374  /opt/ismile-test/site/admin/_workshop_booking.php' | sha256sum --check
            printf '%s\n' 'ae99446f2b7503aff6376922ff127a91a1ad64106a1a09727e864b3112bc43e7  /opt/ismile-test/site/admin/_workshop_cash_sale.php' | sha256sum --check
            printf '%s\n' '2bb359251ee09dd6817bd90888b1831e6d813159fb3c61e9c8623b44f18cca49  /opt/ismile-test/site/admin/workshops.js' | sha256sum --check
            printf '%s\n' '6f0bd53a50d8f2cbf1fe2e755d60a39a57b825fcd65b298680d3a67da51ba2cb  /opt/ismile-test/site/admin/workshops.css' | sha256sum --check
            printf '%s\n' '91878397ad6a129349eeadf9895dd736b6a35556eaacb41301038347bb99fe43  /opt/ismile-test/backend/src/WorkshopCashSale.php' | sha256sum --check
            printf '%s\n' '69e38e9d4ae3c23b8bee34031b227b1ade603e253dafc0a809d42e75b9dc4a90  /opt/ismile-test/backend/src/WorkshopTickets.php' | sha256sum --check
            runuser -u www-data -- php <<'PAID_CASH_VERIFY'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $columns=\Ismile\Db::all('SHOW COLUMNS FROM workshop_cash_receipts');
            if(!in_array('amount_iqd',array_column($columns,'Field'),true))throw new RuntimeException('Receipt schema missing');
            $render=static function(string $query):string{$command='php '.escapeshellarg('/opt/ismile-test/backend/tools/verify-deployment.php').' --render workshops '.escapeshellarg($query);exec($command,$lines,$status);if($status!==0)throw new RuntimeException('Cash admin render failed');return implode("\n",$lines);};
            $normal=$render('id=crown-vs-veneer');if(!str_contains($normal,'Register (cash)')||!str_contains($normal,'Book a guest — free'))throw new RuntimeException('Separate cash and free actions missing');
            $w=\Ismile\Db::one("SELECT * FROM workshops WHERE organizer='ismile' AND status='active' AND provider_event_id IS NOT NULL AND display_currency='USD' AND display_price>0 ORDER BY id LIMIT 1");
            if(!$w)throw new RuntimeException('No saved USD workshop quote found');
            $person=\Ismile\Db::one("SELECT r.id FROM registrations r WHERE r.status='paid' AND NOT EXISTS (SELECT 1 FROM workshop_bookings b WHERE b.registration_id=r.id AND b.workshop_id=? AND b.removed_at IS NULL) AND NOT EXISTS (SELECT 1 FROM workshop_checkouts c WHERE c.registration_id=r.id AND c.workshop_id=? AND c.provider_status IN ('created','unknown','awaiting_payment','paid')) AND NOT EXISTS (SELECT 1 FROM guest_workshop_orders g WHERE g.registration_id=r.id AND g.workshop_id=? AND g.active_pair IS NOT NULL) LIMIT 1",[$w['id'],$w['id'],$w['id']]);
            if(!$person)throw new RuntimeException('No eligible read-only form fixture');
            $cash=$render(http_build_query(['id'=>$w['id'],'mode'=>'cash','booking'=>'1','rid'=>$person['id']]));
            foreach(['Paid workshop registration','name="cash_currency"','value="USD"','Register &amp; issue paid ticket','IQD amount for PSOOLA'] as $copy)if(!str_contains($cash,$copy))throw new RuntimeException('Cash form verification failed');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['separateCashButton'=>true,'freeGuestButton'=>true,'cashReceiptSchema'=>true,'savedUsdQuote'=>true,'paidCashForm'=>true,'readOnly'=>true]).PHP_EOL;
            PAID_CASH_VERIFY
