name: Publish approved sponsor content
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Merge approved sponsors into persistent content with backups
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'SPONSORS_CONTENT_NODE'
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const candidates=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'.env'))&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'assets/sponsors/bnama-medical-platinum-20261111.webp')));
            if(candidates.length!==1)throw Error('Expected one deployed website containing approved sponsor artwork');
            const current=fs.realpathSync(candidates[0].pm2_env.pm_cwd),hashes={"assets/sponsors/bnama-medical-platinum-20261111.webp":"e1988469aaa4338118246ddd197663dc109c6a558d686915093a869069949df8","assets/sponsors/normon-platinum-20261111.webp":"322eb61de5e36715b9396691c6b44cb5b96956c8f4545a376a6fbdc081b49e0a"},additions=[{"name":"Bnama Medical","tier":"platinum","logo":"assets/sponsors/bnama-medical-platinum-20261111.webp","bg":"#18363F","tile":true},{"name":"NORMON","tier":"platinum","logo":"assets/sponsors/normon-platinum-20261111.webp","bg":"#18363F","tile":true}];
            for(const [file,hash] of Object.entries(hashes)){if(crypto.createHash('sha256').update(fs.readFileSync(path.join(current,file))).digest('hex')!==hash)throw Error('Deployed image mismatch: '+file);}
            const environment=fs.readFileSync(path.join(current,'.env'),'utf8'),match=environment.match(/^CONTENT_ROOT=(.*)$/m);const shared=match&&match[1].trim()?match[1].trim():path.resolve(current,'../../shared-content');
            const targets=[{file:path.join(shared,'data/sponsors.json'),fallback:path.join(current,'data/sponsors.json')},{file:'/opt/ismile-test/site/data/sponsors.json',fallback:'/opt/ismile-test/repo/data/sponsors.json'}];
            const backup=path.join(path.dirname(shared),'content-backups','sponsors-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            for(let i=0;i<targets.length;i++){const {file,fallback}=targets[i];if(!fs.existsSync(file)&&!fs.existsSync(fallback)){console.log('Skipped absent optional site '+i);continue;}const source=fs.existsSync(file)?file:fallback,raw=fs.readFileSync(source,'utf8'),clean=raw.endsWith(String.fromCharCode(92,110))?raw.slice(0,-2):raw,doc=JSON.parse(clean);if(!Array.isArray(doc.sponsors))throw Error('Invalid sponsor content');fs.writeFileSync(path.join(backup,i+'-sponsors.json'),raw,{mode:0o600});for(const item of additions){const at=doc.sponsors.findIndex(s=>s.name===item.name);if(at>=0)doc.sponsors[at]=item;else{const last=doc.sponsors.findLastIndex(s=>s.tier===item.tier);doc.sponsors.splice(last<0?doc.sponsors.length:last+1,0,item);}}fs.mkdirSync(path.dirname(file),{recursive:true});const temp=file+'.sponsors-writing';fs.writeFileSync(temp,JSON.stringify(doc,null,2)+String.fromCharCode(10));const stat=fs.statSync(source);fs.chmodSync(temp,stat.mode&0o777);fs.chownSync(temp,stat.uid,stat.gid);fs.renameSync(temp,file);console.log(JSON.stringify({updated:file,count:doc.sponsors.length}));}
            try { console.log(cp.execFileSync("php",["-r","$paths=['/opt/ismile-test/backend/bootstrap.php','/opt/ismile-test/repo/backend/bootstrap.php']; foreach($paths as $path){if(is_file($path)){require $path;break;}} $rows=Ismile\\Db::all(\"SELECT id,company,package_id,booth_number,reserved_booth,status FROM sponsor_requests WHERE kind='sponsor' AND (reserved_booth IN (2,22) OR LOWER(company) LIKE '%merqab%' OR LOWER(company) LIKE '%vitis%')\"); echo json_encode(['booth_audit'=>$rows],JSON_UNESCAPED_UNICODE);"],{encoding:"utf8",stdio:["ignore","pipe","pipe"]})); } catch(e) { console.log("Booth audit unavailable; no database changes made."); }
            SPONSORS_CONTENT_NODE
