name: PSOOLA complimentary permission audit (GET only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load existing SSH connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Inspect saved complimentary refusal and verify read-only API access
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'PSOOLA_READ_ONLY_CATALOGUE'
            const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
            let report;
            try{report=JSON.parse(cp.execFileSync('php',['-r',"\nrequire '/opt/ismile-test/backend/bootstrap.php';\nuse Ismile\\App;use Ismile\\Db;use Ismile\\GuestOrders;use Ismile\\Payments\\PsoolaGateway;\n$reference='0PrvUNvOpoIxBG-6';\n$rows=Db::all('SELECT id,status,last_error,support_request_id,provider_order_id,provider_amount,is_complimentary,request_json,partner_reference,attempt_key,created_at,updated_at FROM sponsored_ticket_orders WHERE support_request_id=? ORDER BY id DESC LIMIT 1',[$reference]);\n$exact=!!$rows;\nif(!$rows)$rows=Db::all(\"SELECT id,status,last_error,support_request_id,provider_order_id,provider_amount,is_complimentary,request_json,partner_reference,attempt_key,created_at,updated_at FROM sponsored_ticket_orders WHERE last_error='COMPLIMENTARY_ISSUE_NOT_ENABLED' ORDER BY id DESC LIMIT 3\");\n$gateway=new PsoolaGateway();\n$report=['checked_at'=>gmdate('c'),'request_method'=>'GET only','exact_support_match'=>$exact,'local_issuance_enabled'=>GuestOrders::enabled(),'api_host'=>parse_url((string)(getenv('PSOOLA_API_BASE_URL')?:App::config('payments.psoola.api_base')),PHP_URL_HOST),'requests'=>[]];\nforeach($rows as $row){\n $body=json_decode($row['request_json'],true,512,JSON_THROW_ON_ERROR);\n $safe=false;try{GuestOrders::assertRequest($body);$safe=true;}catch(Throwable){}\n $workshop=Db::one('SELECT workshop_id,state,booking_id FROM guest_workshop_orders WHERE attempt_key=?',[$row['attempt_key']]);\n $lookup=$gateway->partnerRequest('GET','orders?'.http_build_query(['partnerReference'=>$row['partner_reference']]));\n $matched=$lookup['status']===200&&($lookup['json']['partnerReference']??null)===$row['partner_reference'];\n $report['requests'][]=['local_id'=>(int)$row['id'],'status'=>$row['status'],'provider_error_code'=>$row['last_error'],'support_reference'=>$row['support_request_id'],'created_at'=>$row['created_at'],'updated_at'=>$row['updated_at'],'issuance_type'=>$body['issuanceType']??null,'complimentary_flag'=>(bool)$row['is_complimentary'],'request_passes_no_price_guard'=>$safe,'reason_present'=>trim((string)($body['complimentaryReason']??''))!=='','quantities'=>array_column($body['items']??[],'quantity'),'workshop'=>$workshop['workshop_id']??null,'workshop_state'=>$workshop['state']??null,'has_local_booking'=>!empty($workshop['booking_id']),'has_saved_provider_order'=>!empty($row['provider_order_id']),'saved_provider_amount'=>$row['provider_amount'],'provider_lookup_http'=>$lookup['status'],'provider_order_matched'=>$matched,'matched_order_complimentary'=>$matched?($lookup['json']['isComplimentary']??null):null,'matched_order_total'=>$matched?($lookup['json']['order']['totalAmount']??null):null];\n}\n$events=$gateway->partnerRequest('GET','events');\n$report['catalogue_http']=$events['status'];$report['event_count']=is_array($events['json']['events']??null)?count($events['json']['events']):null;\n$signals=[];$visit=static function($value,$path='')use(&$visit,&$signals):void{if(!is_array($value))return;foreach($value as $key=>$v){$p=$path===''?(string)$key:$path.'.'.$key;if(preg_match('/complimentary|permission|directIssuance/i',(string)$key))$signals[$p]=is_bool($v)?$v:get_debug_type($v);if(is_array($v))$visit($v,$p);}};\n$visit($events['json']??[]);$report['permission_signals']=$signals;\necho json_encode($report,JSON_THROW_ON_ERROR|JSON_UNESCAPED_SLASHES);\n"],{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:60000}));}
            catch(error){report={checked_at:new Date().toISOString(),request_method:'GET',catalogue_lookup_failed:true,exit_code:error.status??null};}
            const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
            const data=Buffer.concat([cipher.update(JSON.stringify(report),'utf8'),cipher.final()]);
            const wrapped=crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA0Bxb2I8xOE8GvhBl2RCZ\nncgJgm7Klu2Wbdit9IFLWkmcIqxRCxvkKdtix6t65J6zw3KFZb0eyASZU4CQlr/G\ngr40YNiEHSPsjXLeETZHosJyQXn1oTP/zms8ktd6GYVU4PrPfT26wiAuywpqAUYO\nr+EqFuRh74J6JLvcLaBs5+hZ0NxD3sr04fCZVCziP2JPwoLV3lHwRmCxNELkfSSq\n0ITKF0j1xgurOoemoBnORmK7u6cEClba6AK8JilvKPgujFGivPgq3En/cB7ptuaX\nAYa9DxrEt2pj1M64H3FOWAuLH08cH2jobrHauSALRzeCP8QwQuQsqG+2CpTxf+Br\n74I7p7DR9F6ERkmZZLJ1I1mHUyesDkmTq/ObiSm5N3/cfDLs0tY9SmN+HM6qBLpO\nMR1+KqLQpmmlELuZkxHsjjhGxhUVK061g813/sqXsirFDM/WjqI4/xvu2HZ9vlbc\n/NE4wWwBeFR+PyxgM8JI2JJCVItDyfNKViTP0WHI8rlFAgMBAAE=\n-----END PUBLIC KEY-----\n",oaepHash:'sha256'},key);
            console.log('ENCRYPTED_CATALOGUE:'+Buffer.from(JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')})).toString('base64'));
            PSOOLA_READ_ONLY_CATALOGUE
