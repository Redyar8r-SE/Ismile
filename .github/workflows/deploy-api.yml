name: Workshop seat-final
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: seat-final workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'WORKSHOP_FINAL_SEATS'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            foreach(\Ismile\Db::all("SELECT provider_session_id,partner_reference FROM workshop_checkouts WHERE provider_status='awaiting_payment' AND expires_at<=?",[\Ismile\App::now()]) as $attempt)\Ismile\WorkshopCheckout::reconcile($attempt['provider_session_id'],$attempt['partner_reference']);
            $rows=[];foreach(\Ismile\Workshops::all() as $local){$w=\Ismile\WorkshopCatalog::one($local['id'],true);$rows[]=['id'=>$w['id'],'available'=>$w['seatsLeft'],'capacity'=>$w['totalSeats'],'registered'=>$w['paidRegistrations'],'awaiting_payment'=>$w['pendingPayments'],'provider_verified'=>$w['availabilityVerified']];}
            echo 'WORKSHOPS_VERIFIED='.json_encode(['at'=>\Ismile\App::now(),'workshops'=>$rows,'checkout_statuses'=>\Ismile\Db::all('SELECT provider_status,COUNT(*) AS n FROM workshop_checkouts GROUP BY provider_status'),'admin_uses_same_catalog'=>str_contains((string)file_get_contents('/opt/ismile-test/site/admin/workshops.php'),'WorkshopCatalog::all()')],JSON_UNESCAPED_SLASHES).PHP_EOL;
            WORKSHOP_FINAL_SEATS
