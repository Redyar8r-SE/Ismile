name: PSOOLA latest complimentary results (GET only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load existing SSH connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Inspect saved complimentary refusal and verify read-only API access
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'PSOOLA_READ_ONLY_CATALOGUE'
            const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
            let report;
            try{report=JSON.parse(cp.execFileSync('php',['-r',"\nrequire '/opt/ismile-test/backend/bootstrap.php';\nuse Ismile\\App;use Ismile\\Db;use Ismile\\GuestOrders;use Ismile\\Payments\\PsoolaGateway;\n$rows=Db::all('SELECT id,status,last_error,support_request_id,provider_order_id,is_complimentary,created_at,updated_at,event_id FROM sponsored_ticket_orders WHERE is_complimentary=1 ORDER BY id DESC LIMIT 10');\n$report=['checked_at'=>gmdate('c'),'requests'=>'GET only','production_host'=>parse_url((string)(getenv('PSOOLA_API_BASE_URL')?:App::config('payments.psoola.api_base')),PHP_URL_HOST),'local_issuance_enabled'=>GuestOrders::enabled(),'latest_local_requests'=>[]];\nforeach($rows as $row){$workshop=Db::one('SELECT workshop_id,state FROM guest_workshop_orders g JOIN sponsored_ticket_orders o ON o.attempt_key=g.attempt_key WHERE o.id=?',[$row['id']]);$report['latest_local_requests'][]=['id'=>(int)$row['id'],'status'=>$row['status'],'error_code'=>$row['last_error'],'support_reference'=>$row['support_request_id'],'has_provider_order'=>!!$row['provider_order_id'],'created_at'=>$row['created_at'],'updated_at'=>$row['updated_at'],'kind'=>$workshop?'workshop':'summit','workshop'=>$workshop['workshop_id']??null];}\n$gateway=new PsoolaGateway();$events=$gateway->partnerRequest('GET','events');$report['events_http']=$events['status'];$report['provider_pages']=[];\nforeach($events['json']['events']??[] as $event){$answer=$gateway->partnerRequest('GET','orders?'.http_build_query(['eventId'=>$event['id'],'limit'=>100]));$orders=$answer['json']['orders']??[];$comp=array_values(array_filter($orders,static fn($order)=>($order['isComplimentary']??false)===true));$times=[];foreach($comp as $order)if(isset($order['createdAt']))$times[]=$order['createdAt'];$report['provider_pages'][]=['http'=>$answer['status'],'kind'=>$event['id']===App::config('payments.psoola.event_id')?'summit':'workshop','returned_orders'=>count($orders),'complimentary_orders'=>count($comp),'complimentary_created_at'=>$times];}\necho json_encode($report,JSON_THROW_ON_ERROR|JSON_UNESCAPED_SLASHES);\n"],{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:60000}));}
            catch(error){report={checked_at:new Date().toISOString(),request_method:'GET',catalogue_lookup_failed:true,exit_code:error.status??null};}
            const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
            const data=Buffer.concat([cipher.update(JSON.stringify(report),'utf8'),cipher.final()]);
            const wrapped=crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAseucYgd7LdFyqKevUyDK\nHVjY4RXKO4WGXLrzr9MlqvQdJjy/HmXufk+4l4v4uIo1+5WOUF++U/hDF4TwLaLM\nNA48wv6xI2/D4paHlUycSDfcPHUHv9LflxRbzoll3b5sRplPCapZNMy4fXZQNlUS\nIZ0EGaHePnitEyCE42vunig2JrSzwSvVpRzCw+VbLwgXNY0MN1ORMax3bZ8Sb8bJ\nglN8Alh5t07DGJ90gq26JKyltZmrayRVdzWW5B9ClWWqYxt5Wst2P8MX10bFVgY+\n9ZOIBK8c+wBtyOr5SCWGxColI6tjiJSYLK3YJnHMLGwzAOCM7Br5KNkBO37ImNDJ\ng4Zh9tOWk6JNMIcLk3bKvo6IMkAYaFZZFtNTINMdvLCwIY14WgoE2OTDvpmgAvwz\nruBJyr2rIDkMy7PjPTsFH0U0/zZJjU0FNcQJI22HIMOYOUaVx1csk2reppDxey2K\nyns3vk6+Kv63ZrIxiNKGDxAwHJDOLYlczIR35EYxtHNhAgMBAAE=\n-----END PUBLIC KEY-----\n",oaepHash:'sha256'},key);
            console.log('ENCRYPTED_CATALOGUE:'+Buffer.from(JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')})).toString('base64'));
            PSOOLA_READ_ONLY_CATALOGUE
