name: Workshop verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: verify workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'WORKSHOPS_VERIFY_PHP'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $expected=['simplified-direct-veneers'=>['2026-11-20','13:00','17:00',100000],'mastering-zirconia-veneers'=>['2026-11-20','11:00','13:00',100000],'crown-vs-veneer'=>['2026-11-19','13:00','17:00',120000]];
            $rows=\Ismile\Workshops::all();
            if(count($rows)!==3)throw new RuntimeException('Expected exactly three real workshops.');
            $verified=[];
            foreach($rows as $row){
             $w=\Ismile\WorkshopCatalog::one($row['id'],true);$e=$expected[$row['id']]??null;
             if(!$e || !$w['availabilityVerified'] || [$w['scheduledDate'],$w['startTime'],$w['endTime'],$w['price']]!==$e || $w['totalSeats']!==25)throw new RuntimeException('Workshop live provider mismatch: '.json_encode($w));
             if($w['id']==='mastering-zirconia-veneers' && $w['companyPhones']!==['0771 366 6464','0751 420 3598'])throw new RuntimeException('Company phones mismatch.');
             $verified[]=['id'=>$w['id'],'title'=>$w['title']['en'],'date'=>$w['scheduledDate'],'start'=>$w['startTime'],'end'=>$w['endTime'],'price'=>$w['price'],'capacity'=>$w['totalSeats'],'available'=>$w['seatsLeft'],'organizer'=>$w['organizer']];
            }
            $before=(int)\Ismile\Db::value('SELECT COUNT(*) FROM workshop_bookings');
            try {\Ismile\Workshops::registerOnline('crown-vs-veneer','unregistered-live-check@example.invalid');throw new RuntimeException('Unregistered email was accepted!');}catch(\Ismile\UserError $e){if($e->getMessage()!=='wd_err_not_registered')throw $e;}
            if($before!==(int)\Ismile\Db::value('SELECT COUNT(*) FROM workshop_bookings'))throw new RuntimeException('Rejected request altered bookings.');
            if((int)\Ismile\Db::value('SELECT COUNT(*) FROM workshop_ticket_orders')!==0)throw new RuntimeException('Unexpected initial workshop order.');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['workshops'=>$verified,'unregistered_blocked'=>true,'provider_orders_created'=>0,'demos_remaining'=>(int)\Ismile\Db::value("SELECT COUNT(*) FROM workshops WHERE id IN ('implant','dsd','endo','scan','soft-tissue-implants','composite-restorations')")],JSON_UNESCAPED_SLASHES).PHP_EOL;
            WORKSHOPS_VERIFY_PHP
