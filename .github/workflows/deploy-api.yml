name: Workshop vip-200-prepare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: vip-200-prepare workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            test "$(git -C /opt/ismile-test/repo rev-parse HEAD)" = b378cebf4507e6ec06383322411b7a873f0525ac
            runuser -u www-data -- php /opt/ismile-test/backend/tools/configure-vip-package.php --prepare
            runuser -u www-data -- php <<'VIP_PACKAGE_CONTENT'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\App;
            $keys=['vip_explore','xp_extras_note','vip_package_not_ready','vip_workshop_required','vip_workshop_full','vip_lunch_one'];
            $files=['data/tickets.json'=>['vip']];foreach(['en','ar','ku'] as $lang)$files['data/i18n/site-'.$lang.'.json']=$keys;
            foreach($files as $relative=>$selected){
             $file=App::siteFile($relative);$source='/opt/ismile-test/repo/'.$relative;
             if(!is_file($file)||!is_file($source))throw new RuntimeException('VIP content file missing');
             $original=(string)file_get_contents($file);$before=json_decode($original,true,512,JSON_THROW_ON_ERROR);$latest=json_decode(file_get_contents($source),true,512,JSON_THROW_ON_ERROR);
             $backup=App::storage('tmp/vip-200-before-'.str_replace('/','-',$relative));if(!is_file($backup))file_put_contents($backup,$original,LOCK_EX);
             foreach($selected as $key){if(!array_key_exists($key,$latest))throw new RuntimeException('VIP content key missing');$before[$key]=$latest[$key];}
             $temp=$file.'.vip-package';file_put_contents($temp,json_encode($before,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR).PHP_EOL,LOCK_EX);chmod($temp,fileperms($file)&0777);rename($temp,$file);
            }
            VIP_PACKAGE_CONTENT
            node <<'VIP_SHARED_CONTENT'
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));const matches=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'js/sections/registration.js')));if(matches.length!==1)throw Error('Website process ambiguous');
            const current=fs.realpathSync(matches[0].pm2_env.pm_cwd),env=fs.readFileSync(path.join(current,'.env'),'utf8'),match=env.match(/^CONTENT_ROOT=(.*)$/m),root=match?.[1]?.trim()||path.join(current,'.site-content');
            const selected=['vip_explore','xp_extras_note','vip_package_not_ready','vip_workshop_required','vip_workshop_full','vip_lunch_one'];let updated=0;
            for(const name of ['data/tickets.json',...['en','ar','ku'].map(lang=>'data/i18n/site-'+lang+'.json')]){
             const file=path.join(root,name);if(!fs.existsSync(file))continue;const data=JSON.parse(fs.readFileSync(file,'utf8')),source=JSON.parse(fs.readFileSync('/opt/ismile-test/repo/'+name,'utf8')),keys=name==='data/tickets.json'?['vip']:selected;
             const before=JSON.stringify(Object.fromEntries(Object.entries(data).filter(([key])=>!keys.includes(key))));for(const key of keys)data[key]=source[key];if(JSON.stringify(Object.fromEntries(Object.entries(data).filter(([key])=>!keys.includes(key))))!==before)throw Error('Unrelated content changed');
             const stat=fs.statSync(file),temporary=file+'.vip-package';fs.writeFileSync(temporary,JSON.stringify(data,null,2)+'\n');fs.chmodSync(temporary,stat.mode&0o777);fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,file);updated++;
            }
            console.log('VIP_SHARED_UPDATED='+updated);
            VIP_SHARED_CONTENT
            runuser -u www-data -- php <<'VIP_PACKAGE_VERIFY'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\{Db,Settings,VipPackages,Registrations};
            $choices=(bool)Db::value("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='vip_package_choices'");
            $state=Registrations::publicState('en');
            if(!$choices||!VipPackages::enabled()||Settings::bool('vip_package_sales_open')||VipPackages::ready()||Settings::int('vip_registration_limit')!==0||$state['vip']['available']||($state['prices']['vipPackageEnabled']??false)!==true)throw new RuntimeException('VIP preparation state mismatch');
            $foreignKeys=(int)Db::value("SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema=DATABASE() AND table_name='vip_package_choices' AND constraint_type='FOREIGN KEY'");
            if($foreignKeys!==5)throw new RuntimeException('VIP choice relations are incomplete');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['vipChoiceTable'=>true,'databaseRelations'=>$foreignKeys,'packageUsd'=>200,'workshops'=>VipPackages::WORKSHOPS,'unlimitedWebsiteVip'=>true,'salesOpen'=>false,'checkoutAvailable'=>false,'existingVipCount'=>(int)Db::value("SELECT COUNT(*) FROM registrations WHERE ticket_type='vip' AND status IN ('paid','complimentary')"),'savedPackageChoices'=>(int)Db::value('SELECT COUNT(*) FROM vip_package_choices')]).PHP_EOL;
            VIP_PACKAGE_VERIFY
