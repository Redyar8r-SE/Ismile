name: Workshop vip-capacity-inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: vip-capacity-inventory workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'VIP_CAPACITY_READ'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            echo 'WORKSHOPS_INVENTORY='.json_encode(['vipRegistrations'=>\Ismile\Db::all("SELECT status,COUNT(*) AS records FROM registrations WHERE ticket_type='vip' GROUP BY status"),'vipOpenPayments'=>(int)\Ismile\Db::value("SELECT COUNT(DISTINCT c.id) FROM checkouts c JOIN payments p ON p.checkout_id=c.id WHERE c.ticket_type='vip' AND c.status='open' AND p.status IN ('created','waiting')")]).PHP_EOL;
            VIP_CAPACITY_READ
