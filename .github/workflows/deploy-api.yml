name: Verify PDF list columns
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Verify deployed code and receipt calculations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'PAYMENT_REPORT_NODE'
            const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
            const files={"/opt/ismile-test/site/admin/export.php":"1d068d3be923146dd8ee6793db18e00492a8a19406d2d0c3a4dc59990d59f5c8","/opt/ismile-test/backend/src/Admin/Lists.php":"8d70d80ceaec44d70d9f067ab6640fa1efd5dc35f1dbc3e5f1fca532ae498cc4"};
            for(const [file,want] of Object.entries(files)){const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');if(actual!==want)throw Error('Deployed file mismatch: '+file);if(file.endsWith('.php'))cp.execFileSync('php',['-l',file],{stdio:'pipe'});console.log('Verified '+file);}
            cp.execFileSync('php',['-r',"require '/opt/ismile-test/backend/vendor/autoload.php'; if(!class_exists('Ismile\\Admin\\PaymentBreakdown'))exit(1); echo 'Deployed payment formatter loads.\n';"],{stdio:'inherit'});
            cp.execFileSync('php',['/opt/ismile-test/backend/tests/payment-breakdown.php'],{stdio:'inherit'});
            cp.execFileSync('php',['-r',"require '/opt/ismile-test/backend/vendor/autoload.php'; $hidden=['100 USD in IQD','Rate source']; $pdf=Ismile\\Admin\\Lists::reportRows('registered',[],false)[0]; $excel=Ismile\\Admin\\Lists::reportRows('registered',[])[0]; if(array_intersect($hidden,$pdf) || count(array_intersect($hidden,$excel))!==2)throw new RuntimeException('PDF column check failed'); echo 'PDF exchange rate columns hidden; Excel columns retained.\\n';"],{stdio:'inherit'});
            console.log('Live payment report code verified without accessing registrations or changing payments.');
            PAYMENT_REPORT_NODE
