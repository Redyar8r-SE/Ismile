name: Workshop kawan-draft
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: kawan-draft workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'KAWAN_DRAFT_PHP'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $payload=json_decode(base64_decode(''),true,512,JSON_THROW_ON_ERROR);$row=$payload['row'];
            $before=\Ismile\Db::all('SELECT * FROM workshops ORDER BY id');
            $owner=\Ismile\Db::one("SELECT * FROM admin_users WHERE role='owner' AND disabled_at IS NULL ORDER BY id LIMIT 1");
            if(!$owner)throw new RuntimeException('An enabled Owner is required');
            $existing=\Ismile\Db::one('SELECT * FROM workshops WHERE id=?',[$row['id']]);
            if($existing){foreach($row as $key=>$value)if((string)($existing[$key]??'')!==(string)($value??''))throw new RuntimeException('Draft already differs: '.$key);}
            else \Ismile\Backup::run();
            $image=base64_decode($payload['image'],true);if(hash('sha256',$image)!==$payload['hash'])throw new RuntimeException('Portrait hash mismatch');
            $info=getimagesizefromstring($image);if(!$info || $info[2]!==IMAGETYPE_WEBP || strlen($image)>\Ismile\Workshops::PHOTO_MAX_BYTES)throw new RuntimeException('Invalid portrait');
            $photo=\Ismile\App::siteFile($row['photo']);if(!is_dir(dirname($photo)))mkdir(dirname($photo),0755,true);
            if(is_file($photo)&&hash_file('sha256',$photo)!==$payload['hash'])throw new RuntimeException('A different photo already exists');
            if(!is_file($photo)){if(file_put_contents($photo.'.writing',$image,LOCK_EX)===false)throw new RuntimeException('Could not save photo');chmod($photo.'.writing',0644);rename($photo.'.writing',$photo);}
            if(!$existing){\Ismile\Db::transaction(static function()use($row,$owner):void{
             if(\Ismile\Db::one('SELECT id FROM workshops WHERE id=? FOR UPDATE',[$row['id']]))throw new RuntimeException('Workshop was created concurrently');
             \Ismile\Db::insert('workshops',$row+['sort_order'=>(int)\Ismile\Db::value('SELECT COALESCE(MAX(sort_order),0)+1 FROM workshops'),'created_at'=>\Ismile\App::now(),'updated_at'=>\Ismile\App::now()]);
             \Ismile\Audit::log((int)$owner['id'],'workshop.create','workshop',null,['id'=>$row['id'],'status'=>'hidden','organizer'=>'ismile','price'=>25000,'currency'=>'IQD','total_seats'=>25,'awaiting'=>'PSOOLA event, show and ticket type']);
            });}
            $after=\Ismile\Db::all('SELECT * FROM workshops WHERE id<>? ORDER BY id',[$row['id']]);
            $previous=array_values(array_filter($before,static fn($w)=>$w['id']!==$row['id']));
            if($after!==$previous)throw new RuntimeException('Existing workshops changed');
            $draft=\Ismile\Workshops::find($row['id']);
            if(!$draft||$draft['status']!=='hidden'||$draft['organizer']!=='ismile'||$draft['totalSeats']!==25||$draft['price']!==25000||$draft['providerEventId']!==null)throw new RuntimeException('Saved workshop mismatch');
            foreach(\Ismile\Workshops::all() as $public)if($public['id']===$row['id'])throw new RuntimeException('Unlinked draft was publicly listed');
            if(hash_file('sha256',\Ismile\App::siteFile($draft['photo']))!==$payload['hash'])throw new RuntimeException('Saved portrait mismatch');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['draft'=>$draft,'portraitVerified'=>true,'existingWorkshopsUnchanged'=>true,'publicListing'=>'hidden pending PSOOLA','providerOrdersCreated'=>0],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            KAWAN_DRAFT_PHP
