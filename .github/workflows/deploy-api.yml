name: Workshop kawan-catalog
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: kawan-catalog workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            php <<'KAWAN_CATALOG_PHP'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $gateway=new \Ismile\Payments\PsoolaGateway();
            $response=$gateway->workshopRequest('GET','events');
            if($response['status']!==200)throw new RuntimeException('PSOOLA events HTTP '.$response['status']);
            $json=$response['json'];
            $events=$json['events']??$json;
            $summary=[];
            foreach($events as $event){
             if(!is_array($event))continue;
             $summary[]=$event;
            }
            echo 'WORKSHOPS_INVENTORY='.json_encode(['providerEvents'=>$summary,'current'=>\Ismile\Db::all('SELECT id,title_en,speaker_en,organizer,total_seats,price,provider_event_id,provider_show_id,provider_ticket_type_id FROM workshops'),'responseKeys'=>array_keys($json)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
            KAWAN_CATALOG_PHP
