name: Workshop five-speakers-sync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: five-speakers-sync
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            node <<'FIVE_SPEAKERS_SYNC'
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');
            const add=[{"name":{"en":"Dr. Kazhan Mohammed","ar":"د. كاژان محمد","ku":"د. کاژان محەممەد"},"role":{"en":"B.D.S., M.Sc. in Conservative Dentistry","ar":"B.D.S.، M.Sc. في طب الأسنان التحفظي","ku":"B.D.S.، M.Sc. لە چارەسەری پارێزگارانەی ددان"},"topic":{"en":"The Invisible Approach to a Natural Smile","ar":"النهج غير المرئي لابتسامة طبيعية","ku":"ڕێگای نەبینراو بۆ زەردەخەنەیەکی سروشتی"},"photo":"assets/speakers/kazhan-mohammed.webp"},{"name":{"en":"Assist. Prof. Dr. Mustafa Rasul Muhammed","ar":"الأستاذ المساعد د. مصطفى رسول محمد","ku":"پ. ی. د. مستەفا ڕەسوڵ محەممەد"},"role":{"en":"Oral and Maxillofacial Surgeon · BDS, MSc (OMFS), PhD (OS)","ar":"جرّاح الفم والوجه والفكين · BDS، MSc (OMFS)، PhD (OS)","ku":"نەشتەرگەری دەم و ڕوو و چەناگە · BDS، MSc (OMFS)، PhD (OS)"},"topic":{"en":"Effect of Dextrose Prolotherapy on Internal Derangement of the Temporomandibular Joint","ar":"تأثير العلاج التكاثري بالدكستروز على الاضطراب الداخلي للمفصل الصدغي الفكي","ku":"کاریگەریی چارەسەری پرۆلۆتێراپی بە دێکسترۆز لەسەر تێکچوونی ناوەوەی جومگەی شەویلگە"},"photo":"assets/speakers/mustafa-rasul-muhammed.webp"},{"name":{"en":"Dr. Sozyar Omer","ar":"د. سوزيار عمر","ku":"د. سۆزیار عومەر"},"role":{"en":"BDS · GDP · FKHCMS in Restorative Dentistry","ar":"BDS · GDP · FKHCMS في طب الأسنان الترميمي","ku":"BDS · GDP · FKHCMS لە چاککردنەوەی ددان"},"topic":{"en":"Design Before You Treat: Digital Smile Planning for Predictable Esthetic Outcomes","ar":"صمّم قبل أن تعالج: التخطيط الرقمي للابتسامة لنتائج تجميلية متوقعة","ku":"پێش چارەسەر دیزاین بکە: پلاندانانی دیجیتاڵیی زەردەخەنە بۆ ئەنجامی جوانکاریی پێشبینیکراو"},"photo":"assets/speakers/sozyar-omer.webp"},{"name":{"en":"Dr. Faisal Muteb Awad","ar":"د. فيصل متعب عواد","ku":"د. فەیسەڵ موتعیب عەواد"},"role":{"en":"Prosthodontist · BDS, MFD RCSI, M-Prosth RCSEd","ar":"أخصائي التعويضات السنية · BDS، MFD RCSI، M-Prosth RCSEd","ku":"پسپۆڕی جێگرەوەکانی ددان · BDS، MFD RCSI، M-Prosth RCSEd"},"topic":{"en":"The Digital Continuum: Merging Implant Scanning, Facial Scanning, and Esthetic Smile Design","ar":"الاستمرارية الرقمية: دمج مسح الزرعات ومسح الوجه وتصميم الابتسامة التجميلية","ku":"زنجیرەی دیجیتاڵ: تێکەڵکردنی سکانی چاندن، سکانی ڕوخسار و دیزاینی جوانکاریی زەردەخەنە"},"photo":"assets/speakers/faisal-muteb-awad.webp"},{"name":{"en":"Dr. Hiwa Karim","ar":"د. هيوا كريم","ku":"د. هیوا کەریم"},"role":{"en":"Oral and Maxillofacial Surgeon · BDS, FKHCMS · Lecturer, College of Dentistry, Hawler Medical University","ar":"جرّاح الفم والوجه والفكين · BDS، FKHCMS · محاضر في كلية طب الأسنان، جامعة هولير الطبية","ku":"نەشتەرگەری دەم و ڕوو و چەناگە · BDS، FKHCMS · وانەبێژ لە کۆلێژی پزیشکیی ددان، زانکۆی پزیشکیی هەولێر"},"topic":{"en":"Soft Tissue Change After Orthognathic Surgery","ar":"تغيرات الأنسجة الرخوة بعد جراحة تقويم الفكين","ku":"گۆڕانی شانە نەرمەکان دوای نەشتەرگەریی ڕاستکردنەوەی چەناگە"},"photo":"assets/speakers/hiwa-karim.webp"}],hashes={"assets/speakers/kazhan-mohammed.webp":"8e916368a84169845909fe2a617e75e4dbdda7cec1df19cf638cb400e955adde","assets/speakers/mustafa-rasul-muhammed.webp":"84e51f483d4edde231bf275e83e8e6ac428b7ccb4dcce98108ebf84c0d0a1125","assets/speakers/sozyar-omer.webp":"ea159ccd528528e9bd2255bb4d21f158c3ced53b7a757acfedb9c9f20bbc3431","assets/speakers/faisal-muteb-awad.webp":"60089e32029c5ec42edc68f0cf1011475f1a45a5ab70fbab7493d3075b2c6977","assets/speakers/hiwa-karim.webp":"ab0b5fc8cca32309703fca584842cb2aa4b56e93384663368a527ff471ce2b8a"};
            const key=s=>String(s.name?.en||'').trim().toLowerCase();
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']})),matches=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'js/sections/speakers.js')));if(matches.length!==1)throw Error('Website process ambiguous');
            const current=fs.realpathSync(matches[0].pm2_env.pm_cwd),env=fs.readFileSync(path.join(current,'.env'),'utf8'),m=env.match(/^CONTENT_ROOT=(.*)$/m),shared=m?.[1]?.trim()||path.join(current,'.site-content');
            for(const s of add){const p=path.join(current,s.photo);if(crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')!==hashes[s.photo])throw Error('Portrait differs: '+s.photo);}
            const targets=[{root:shared,fallback:current}];if(fs.existsSync('/opt/ismile-test/site/data/speakers.json'))targets.push({root:'/opt/ismile-test/site',fallback:'/opt/ismile-test/site'});
            const out=[];
            for(const [i,t] of targets.entries()){
             const destination=path.join(t.root,'data/speakers.json'),fallback=path.join(t.fallback,'data/speakers.json'),file=fs.existsSync(destination)?destination:fallback;
             const original=fs.readFileSync(file,'utf8'),rows=JSON.parse(original),before=JSON.stringify(rows),count=rows.length;
             const have=new Set(rows.map(key));let added=0;
             for(const s of add){if(have.has(key(s)))continue;rows.push(s);have.add(key(s));added++;}
             if(JSON.stringify(rows.slice(0,count))!==before)throw Error('Other speakers changed');
             for(const s of add){const dest=path.join(t.fallback,s.photo);if(!fs.existsSync(dest)){const src=path.join(current,s.photo);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.copyFileSync(src,dest);fs.chmodSync(dest,0o644);try{const ds=fs.statSync(path.dirname(dest));fs.chownSync(dest,ds.uid,ds.gid);}catch{}}}
             if(added){
              try{fs.writeFileSync('/opt/ismile-test/backend/storage/tmp/five-speakers-before-'+i+'-'+Date.now()+'.json',original,{mode:0o600});}catch{}
              const st=fs.statSync(file),tmp=destination+'.five-writing';fs.mkdirSync(path.dirname(destination),{recursive:true});fs.writeFileSync(tmp,JSON.stringify(rows,null,2)+String.fromCharCode(10));fs.chmodSync(tmp,st.mode&0o777);try{fs.chownSync(tmp,st.uid,st.gid);}catch{}fs.renameSync(tmp,destination);
             }
             out.push({target:i?'test':'live',added,speakers:rows.length});
            }
            console.log('SPEAKERS_VERIFIED='+JSON.stringify(out));
            FIVE_SPEAKERS_SYNC
