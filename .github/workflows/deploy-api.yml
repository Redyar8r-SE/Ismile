name: Workshop kawan-api-connections
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: kawan-api-connections workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'WORKSHOP_CONNECTIONS_PHP'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $url=static function(string $value):string{$u=parse_url($value);return ($u['scheme']??'').'://'.($u['host']??'').(isset($u['port'])?':'.$u['port']:'').($u['path']??'');};
            $reflection=new ReflectionClass(\Ismile\App::class);$property=$reflection->getProperty('config');$configuration=$property->getValue();
            $configured=[];
            $walk=static function(array $values,string $prefix='')use(&$walk,&$configured,$url):void{
             foreach($values as $key=>$value){$name=$prefix===''?(string)$key:$prefix.'.'.$key;
              if(is_array($value)){$walk($value,$name);continue;}
              if(preg_match('/psoola|api_base|api_url|endpoint|gateway/i',$name)){
               $entry=['field'=>$name,'configured'=>$value!==null&&$value!==''];
               if(is_string($value)&&preg_match('~^https?://~i',$value))$entry['endpoint']=$url($value);
               elseif(str_ends_with($name,'.gateway'))$entry['gateway']=$value;
               $configured[]=$entry;
              }
             }
            };
            $walk($configuration);
            $gateway=new \Ismile\Payments\PsoolaGateway();$gatewayReflection=new ReflectionClass($gateway);$base=$gatewayReflection->getProperty('base')->getValue($gateway);
            $catalog=$gateway->workshopRequest('GET','events');
            $catalogSummary=['status'=>$catalog['status'],'events'=>array_map(static fn($e)=>['id'=>$e['id']??null,'title'=>$e['title']??null],$catalog['json']['events']??[])];
            $creation=$gateway->workshopRequest('POST','events',[],['Idempotency-Key: ismile-workshop-live-route-check-20261108']);
            $environment=[];foreach(getenv() as $name=>$value)if(preg_match('/PSOOLA|(?:WEBSITE|BOOTH|WORKSHOP|PARTNER)_API/',$name)){$entry=['name'=>$name,'configured'=>$value!==''];if(preg_match('~^https?://~i',$value))$entry['endpoint']=$url($value);$environment[]=$entry;}
            echo 'WORKSHOPS_VERIFIED='.json_encode(['configurationRoots'=>array_keys($configuration),'configuredPsoolaFields'=>$configured,'environment'=>$environment,'effectiveWorkshopPartnerApi'=>$url($base).'/api/partner/v1','workshopBaseSource'=>getenv('PSOOLA_API_BASE_URL')?'environment':'payments.psoola.api_base','workshopKeySource'=>getenv('PSOOLA_API_KEY')?'environment':'payments.psoola.api_key','liveWorkshopCatalog'=>$catalogSummary,'creationRoute'=>['method'=>'POST','path'=>'events','status'=>$creation['status'],'response'=>$creation['json']??mb_substr($creation['body'],0,500)]],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;
            WORKSHOP_CONNECTIONS_PHP
            node <<'WORKSHOP_CONNECTIONS_NODE'
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
            const safe=value=>{try{const u=new URL(value);return u.protocol+'//'+u.hostname+(u.port?':'+u.port:'')+u.pathname;}catch{return '[not a URL]';}};
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const summaries=[];
            for(const app of apps){const dir=app.pm2_env?.pm_cwd;if(!dir||!fs.existsSync(path.join(dir,'server/workshops.mjs')))continue;
             const file=path.join(dir,'.env');const text=fs.existsSync(file)?fs.readFileSync(file,'utf8'):'';
             const values=Object.fromEntries(text.split(/\r?\n/).map(l=>l.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/)).filter(Boolean).map(m=>[m[1],m[2].replace(/^['"]|['"]$/g,'')]));
             const env={...values,...app.pm2_env.env};
             const fields=Object.entries(env).filter(([name])=>/PSOOLA|(?:WEBSITE|BOOTH|WORKSHOP|PARTNER)_API/.test(name)).map(([name,value])=>({name,configured:!!value,...(/^https?:\/\//i.test(String(value))?{endpoint:safe(value)}:{})}));
             summaries.push({application:app.name,fields,workshopBackendSource:env.WEBSITE_API_URL?'WEBSITE_API_URL':env.BOOTH_API_URL?'BOOTH_API_URL':'none'});
            }
            console.log('WEBSITE_STATE='+JSON.stringify({applications:summaries}));
            WORKSHOP_CONNECTIONS_NODE
