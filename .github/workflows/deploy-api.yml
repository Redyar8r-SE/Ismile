name: Save approved VITIS booth booking
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Save the approved sponsor through normal booking validation
        uses: appleboy/ssh-action@v1.2.0
        env:
          SPONSOR_BOOKING_JSON: ${{ secrets.ISMILE_VITIS_BOOKING_20261103 }}
        with:
          envs: SPONSOR_BOOKING_JSON
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            task_file=$(mktemp)
            trap 'rm -f "$task_file"' EXIT
            cat > "$task_file" <<'VITIS_BOOKING_PHP'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\{App,Audit,Auth,Backup,BoothPlan,Db,Sponsors,Validate};
            $input=json_decode((string)getenv('SPONSOR_BOOKING_JSON'),true,512,JSON_THROW_ON_ERROR);
            if(($input['company']??'')!=='Vitis - DentAid'||($input['package_id']??'')!=='bronze'||($input['booth_number']??'')!=='22')throw new RuntimeException('Unexpected booking scope.');
            $position=BoothPlan::positions()[22]??null;
            if(!$position||$position['display_number']!==19||$position['tier']!=='bronze')throw new RuntimeException('Booth numbering changed.');
            BoothPlan::assertDatabaseMatches();
            $input['phone']=Validate::phone((string)$input['phone'])??throw new RuntimeException('Contact phone is invalid.');
            $matches=Db::all("SELECT * FROM sponsor_requests WHERE kind='sponsor' AND (LOWER(company) LIKE '%vitis%' OR LOWER(company) LIKE '%dentaid%' OR phone=?)",[$input['phone']]);
            if(count($matches)>1)throw new RuntimeException('Multiple matching sponsor records; no changes made.');
            $existing=$matches[0]??null;
            if($existing&&in_array($existing['status'],['declined','waiting_list','cancelled'],true))throw new RuntimeException('Matching record is inactive; no changes made.');
            $occupied=Db::one('SELECT id FROM sponsor_requests WHERE reserved_booth=22');
            if($occupied&&(!$existing||(int)$occupied['id']!==(int)$existing['id']))throw new RuntimeException('Booth 19 is already reserved for another booking; no changes made.');
            $owner=Db::one("SELECT * FROM admin_users WHERE role='owner' AND disabled_at IS NULL ORDER BY id LIMIT 1")??throw new RuntimeException('Owner account unavailable.');
            if(!Auth::canManageMap($owner))throw new RuntimeException('Authorised map access required.');
            Backup::run();
            echo "Pre-booking database backup saved.\n";
            if($existing){
              $save=$input+['loaded_at'=>$existing['updated_at'],'assigned_to'=>$existing['assigned_to'],'notes'=>$existing['notes']??''];
              Sponsors::saveDetails((int)$existing['id'],$save,$owner);
              $record=Sponsors::find((int)$existing['id']);
              if($record['status']!==$existing['status']||$record['amount_paid']!==$existing['amount_paid']||$record['amount_agreed']!==$existing['amount_agreed'])throw new RuntimeException('Existing financial details changed unexpectedly.');
              $action='updated_existing';
            }else{
              $record=Sponsors::createByStaff($input+['kind'=>'sponsor','email'=>'','lang'=>'en','notes'=>'Booth 19 booking authorised by the owner with the supplied company and contact details.'],$owner);
              $action='created';
            }
            if(!$record||$record['company']!==$input['company']||$record['contact_name']!==$input['contact']||$record['phone']!==$input['phone']||$record['package_id']!=='bronze'||(int)$record['reserved_booth']!==22)throw new RuntimeException('Saved booking verification failed.');
            if(!in_array(22,Sponsors::bookedBooths(),true))throw new RuntimeException('Map reservation verification failed.');
            echo json_encode(['vitis_booking'=>['action'=>$action,'id'=>(int)$record['id'],'tier'=>'bronze','display_booth'=>19,'reserved_position'=>22,'contact_details_verified'=>true,'status'=>$record['status']]],JSON_THROW_ON_ERROR)."\n";
            VITIS_BOOKING_PHP
            php -l "$task_file"
            chown www-data:www-data "$task_file"
            chmod 600 "$task_file"
            runuser -u www-data -- php "$task_file"
