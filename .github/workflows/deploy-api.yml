name: PSOOLA original QR button check (GET only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load existing SSH connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Verify original PSOOLA QR on an existing registration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'PSOOLA_READ_ONLY_CATALOGUE'
            const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
            let report;
            try{report=JSON.parse(cp.execFileSync('php',['-r',"\n$tool='/opt/ismile-test/backend/tools/verify-psoola-ticket.php';\n$report=['request_method'=>'GET only','registration_id'=>264,'deployed'=>is_file($tool),'verified'=>false,'orders_created'=>0,'private_ticket_data_stored'=>false];\nif(is_file($tool)){\n $command=escapeshellarg(PHP_BINARY).' '.escapeshellarg($tool).' 264';\n exec($command.' 2>/dev/null',$lines,$status);\n $report['verified']=$status===0;\n}\necho json_encode($report,JSON_THROW_ON_ERROR);\n"],{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:60000}));}
            catch(error){report={checked_at:new Date().toISOString(),request_method:'GET',catalogue_lookup_failed:true,exit_code:error.status??null};}
            const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
            const data=Buffer.concat([cipher.update(JSON.stringify(report),'utf8'),cipher.final()]);
            const wrapped=crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEApKOZ5t/juPkeZJr2WAJ1\n3jfy55NzjKASjArJ3uJc0nrTqOd6z2UqQ+LlmoYfJkpTSta7lTOg5+Sg3d6DnNCn\nARLT0/jNkzsrGivImM+WJlFhyWqNskI5fVEolnSVMYYRfePtqM6MzmSGxUqpQ+1I\nS9hlffHH4q547EFyVwEDJY103kJGelu4dnNbVEU+2P6xCJgx+Ke0QIXiICBxv/Ix\n1Oa+pWasVf0Uw9zRMcpFWOdQvcXxmwV0xanbTSKCX4MaLB50L1n8xX5obirqG6Wv\nhG71YLd7LQT94QjAyjSLuTlMijIQ5m4o+OidCEqQmMj60T2C0Kiec2T26JURud3P\nCpFGAlBwig+7D62Kn2AV7Krgp3PghBWih4+uh/S3lqcPeXPUhLTrlG79LssVlDF7\nOT8KAHMP/nVMbYPmVlxB7pE+idJzZoJUOo/G5gjgjtOlpJp7GD1oRUEESi4rB2rA\nPZQjonpA6ithcmT7mWF4/zAdl94F12VCoFjYg2jddGphAgMBAAE=\n-----END PUBLIC KEY-----\n",oaepHash:'sha256'},key);
            console.log('ENCRYPTED_CATALOGUE:'+Buffer.from(JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')})).toString('base64'));
            PSOOLA_READ_ONLY_CATALOGUE
