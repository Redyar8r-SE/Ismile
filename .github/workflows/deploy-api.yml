name: Workshop usd-workshop-support
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: usd-workshop-support workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'USD_WORKSHOP_PHP'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\App;
            use Ismile\Payments\PsoolaGateway;
            $gateway=new PsoolaGateway();$id=(string)App::config('payments.psoola.event_id','');
            $answer=$gateway->partnerRequest('GET','manage/events/'.$id);
            if($answer['status']!==200)throw new RuntimeException('Management catalog HTTP '.$answer['status']);
            $doc=$answer['json'];
            echo 'WORKSHOPS_INVENTORY='.json_encode(['eventId'=>$id,'commerce'=>$doc['commerce']??null,'ticketTypes'=>$doc['ticketTypes']??[],'addOns'=>$doc['addOns']??[]],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;
            USD_WORKSHOP_PHP
