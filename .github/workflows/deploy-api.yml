name: Workshop seat-audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: seat-audit workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'WORKSHOP_SEAT_AUDIT'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $gateway=new \Ismile\Payments\PsoolaGateway();$out=[];
            foreach(\Ismile\Workshops::all() as $w){
             $r=$gateway->workshopRequest('GET','events/'.rawurlencode($w['providerEventId']));if($r['status']!==200)throw new RuntimeException('Catalog HTTP '.$r['status']);
             $event=$r['json']['event'];$show=null;$ticket=null;foreach(($event['shows']??[]) as $s)if($s['id']===$w['providerShowId'])$show=$s;foreach(($show['ticketTypes']??[]) as $t)if($t['id']===$w['providerTicketTypeId'])$ticket=$t;
             $orders=$gateway->workshopRequest('GET','orders?'.http_build_query(['eventId'=>$w['providerEventId'],'limit'=>100]));
             $safe=[];foreach(($orders['json']['orders']??[]) as $order)$safe[]=['id'=>$order['id']??null,'status'=>$order['status']??null,'ticketCount'=>$order['order']['ticketCount']??$order['ticketCount']??null,'reference'=>$order['partnerReference']??null];
             $out[]=['id'=>$w['id'],'local_bookings'=>\Ismile\Db::all('SELECT payment_status,removed_at,COUNT(*) AS n FROM workshop_bookings WHERE workshop_id=? GROUP BY payment_status,removed_at',[$w['id']]),'local_checkouts'=>\Ismile\Db::all('SELECT id,provider_status,provider_session_id,expires_at,booking_id,created_at,updated_at FROM workshop_checkouts WHERE workshop_id=? ORDER BY id',[$w['id']]),'provider_ticket'=>array_intersect_key($ticket??[],array_flip(['id','price','available','quantity','capacity','sold','held','reserved','total','totalQuantity'])),'provider_ticket_fields'=>array_keys($ticket??[]),'provider_orders_http'=>$orders['status'],'provider_orders'=>$safe,'next_cursor'=>!empty($orders['json']['nextCursor'])];
            }
            echo 'WORKSHOPS_VERIFIED='.json_encode(['audited_at'=>\Ismile\App::now(),'workshops'=>$out],JSON_UNESCAPED_SLASHES).PHP_EOL;
            WORKSHOP_SEAT_AUDIT
