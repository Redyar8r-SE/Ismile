name: Workshop pediatric-company-150
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: pediatric-company-150 workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'PEDIATRIC_COMPANY_PRICE'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\App;use Ismile\Db;use Ismile\Audit;use Ismile\Workshops;use Ismile\WorkshopCatalog;
            $id='pediatric-dentistry-masterclass';
            Db::transaction(static function()use($id):void{
             $row=Db::one('SELECT * FROM workshops WHERE id=? FOR UPDATE',[$id]);
             if(!$row||$row['organizer']!=='company'||$row['company_phone']!=='07708252200'||$row['company_phone_secondary']!=='07709005881')throw new RuntimeException('Company workshop or contact details changed');
             if((int)Db::value('SELECT COUNT(*) FROM workshop_bookings WHERE workshop_id=? AND removed_at IS NULL',[$id])>0&&(string)$row['currency']!=='USD')throw new RuntimeException('Existing bookings require price review');
             if(Db::value("SELECT id FROM workshop_checkouts WHERE workshop_id=? AND provider_status IN ('created','unknown','awaiting_payment') LIMIT 1",[$id]))throw new RuntimeException('An existing online order needs review');
             if(!is_file(App::storage('tmp/pediatric-company-150-before.json')))file_put_contents(App::storage('tmp/pediatric-company-150-before.json'),json_encode($row),LOCK_EX);
             $team=json_decode($row['presenters_json'],true,512,JSON_THROW_ON_ERROR);$matched=0;foreach($team as &$trainer){if(in_array($trainer['name']['en']??'', ['Halqurd Salih Jaf','Dr. Halqurd Salih Jaf'],true)){$trainer['name']['en']='Dr. Halqurd Salih Jaf';$matched++;}}unset($trainer);if($matched!==1)throw new RuntimeException('Trainer identity changed');
             $fields=['price'=>150,'currency'=>'USD','display_price'=>null,'display_currency'=>null,'presenters_json'=>json_encode($team,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),'speaker_en'=>str_replace('& Halqurd Salih Jaf','& Dr. Halqurd Salih Jaf',$row['speaker_en']),'updated_at'=>App::now()];
             Db::update('workshops',$fields,'id=?',[$id]);
             $after=Db::one('SELECT * FROM workshops WHERE id=?',[$id]);if($after!==array_replace($row,$fields))throw new RuntimeException('Unexpected workshop fields changed');
             $owner=(int)Db::value("SELECT id FROM admin_users WHERE role='owner' AND disabled_at IS NULL ORDER BY id LIMIT 1");if(!$owner)throw new RuntimeException('Owner required');
             Audit::log($owner,'workshop.price_updated','workshop',null,['id'=>$id,'price'=>150,'currency'=>'USD','source'=>'Confirmed workshop poster']);
            });
            Workshops::syncWebsite();$w=WorkshopCatalog::one($id,true);if($w['organizer']!=='company'||$w['price']!==150||$w['currency']!=='USD')throw new RuntimeException('Company catalog price mismatch');
            if(!in_array('Dr. Halqurd Salih Jaf',array_column(array_column($w['presenters'],'name'),'en'),true))throw new RuntimeException('Trainer title mismatch');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['id'=>$id,'organizer'=>$w['organizer'],'price'=>$w['price'],'currency'=>$w['currency'],'trainer'=>'Dr. Halqurd Salih Jaf','companyPhones'=>$w['companyPhones'],'date'=>$w['scheduledDate'],'start'=>$w['startTime'],'end'=>$w['endTime'],'otherDetailsPreserved'=>true]).PHP_EOL;
            PEDIATRIC_COMPANY_PRICE
            node <<'COMPANY_PRICE_SHARED'
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']})),matches=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'js/sections/registration.js')));if(matches.length!==1)throw Error('Website process ambiguous');
            const current=fs.realpathSync(matches[0].pm2_env.pm_cwd),env=fs.readFileSync(path.join(current,'.env'),'utf8'),match=env.match(/^CONTENT_ROOT=(.*)$/m),shared=match&&match[1].trim()?match[1].trim():path.resolve(current,'../../shared-content'),file=path.join(shared,'data/workshops.json');
            const rows=JSON.parse(fs.readFileSync(file,'utf8')),source=JSON.parse(fs.readFileSync('/opt/ismile-test/site/data/workshops.json','utf8')),id='pediatric-dentistry-masterclass',card=source.find(w=>w.id===id),index=rows.findIndex(w=>w.id===id);if(!card||index<0||card.organizer!=='company'||card.price!==150||card.currency!=='USD')throw Error('Company card mismatch');
            const stat=fs.statSync(file),before=JSON.stringify(rows.map(w=>w.id===id?null:w));rows[index]=card;if(JSON.stringify(rows.map(w=>w.id===id?null:w))!==before)throw Error('Other cards changed');
            const temp=file+'.company-price';fs.writeFileSync(temp,JSON.stringify(rows,null,2)+String.fromCharCode(10));fs.chmodSync(temp,stat.mode&0o777);fs.chownSync(temp,stat.uid,stat.gid);fs.renameSync(temp,file);
            console.log('COMPANY_PRICE_SHARED='+JSON.stringify({company:true,price:150,currency:'USD',otherCardsPreserved:true}));
            COMPANY_PRICE_SHARED
