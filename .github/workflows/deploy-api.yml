name: Workshop november-workshops-live
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: november-workshops-live workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'ELITE_WORKSHOPS_PHP'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\App;use Ismile\Audit;use Ismile\Db;use Ismile\Workshops;use Ismile\WorkshopCatalog;use Ismile\WorkshopCheckout;
            $definitions=json_decode((string)file_get_contents('/opt/ismile-test/backend/assets/november-new-workshops-2026.json'),true,512,JSON_THROW_ON_ERROR);
            $owner=Db::one("SELECT * FROM admin_users WHERE role='owner' AND disabled_at IS NULL ORDER BY id LIMIT 1");if(!$owner)throw new RuntimeException('Owner required');
            $ids=[];
            foreach($definitions as $definition){
             if($definition['organizer']!=='company')continue;
             $id=$definition['id'];if($definition['currency']!=='USD'||$definition['price']!==100||$definition['total_seats']!==25||$definition['company_en']!=='Elite Dental'||$definition['company_phone']!=='0773 059 6161')throw new RuntimeException('Poster definition mismatch');
             if(!is_file('/opt/ismile-test/site/'.$definition['photo']))throw new RuntimeException('Portrait is missing');
             Db::transaction(static function()use($id,$definition,$owner):void{
              $existing=Db::one('SELECT * FROM workshops WHERE id=? FOR UPDATE',[$id]);
              if($existing){if($existing['organizer']!=='company'||$existing['provider_event_id']||$existing['provider_show_id']||$existing['provider_ticket_type_id']||(int)$existing['price']!==100||$existing['currency']!=='USD'||(int)$existing['total_seats']!==25)throw new RuntimeException('Existing workshop differs; inspect before changing');return;}
              Db::insert('workshops',array_replace($definition,['status'=>'active','sort_order'=>(int)Db::value('SELECT COALESCE(MAX(sort_order),0)+1 FROM workshops'),'created_at'=>App::now(),'updated_at'=>App::now()]));
              Audit::log((int)$owner['id'],'workshop.company_publication','workshop',null,['id'=>$id,'price'=>100,'currency'=>'USD','total_seats'=>25,'registration'=>'company-phone']);
             });
             $catalog=WorkshopCatalog::one($id,true);if(!$catalog||$catalog['organizer']!=='company'||$catalog['currency']!=='USD'||$catalog['price']!==100||$catalog['totalSeats']!==25||$catalog['companyPhone']!=='0773 059 6161')throw new RuntimeException('Live company workshop mismatch');
             try{WorkshopCheckout::start($id,'company-workshop-check@example.invalid');throw new RuntimeException('Company workshop allowed online registration');}catch(\Ismile\UserError $e){if($e->getMessage()!=='wd_err_by_phone')throw $e;}
             $ids[]=$catalog;
            }
            Workshops::syncWebsite();echo 'WORKSHOPS_PUBLISHED='.json_encode(['workshops'=>$ids,'providerOrdersCreated'=>false],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            ELITE_WORKSHOPS_PHP
            
            runuser -u www-data -- php <<'PEDIATRIC_MASTERCLASS_PHP'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\App;use Ismile\Audit;use Ismile\Db;use Ismile\Workshops;use Ismile\WorkshopCatalog;use Ismile\WorkshopCheckout;use Ismile\Payments\PsoolaGateway;
            $workshopId='pediatric-dentistry-masterclass';$file=App::storage('tmp/'.$workshopId.'-psoola-management.json');
            $lock=fopen($file.'.lock','c');if(!$lock||!flock($lock,LOCK_EX|LOCK_NB))throw new RuntimeException('Workshop management is busy');
            $state=json_decode((string)file_get_contents($file),true,512,JSON_THROW_ON_ERROR);
            $quote=$state['usdQuote']??null;if(!$quote||$quote['amountUSD']!==150||$quote['amountIQD']!== (int)round(150*$quote['rate']))throw new RuntimeException('Provider USD quote is missing');
            $eventId=$state['eventId'];$showId=$state['showId'];$ticketId=$state['ticketTypeId'];
            $definitions=json_decode((string)file_get_contents('/opt/ismile-test/backend/assets/november-new-workshops-2026.json'),true,512,JSON_THROW_ON_ERROR);$definition=null;foreach($definitions as $item)if($item['id']===$workshopId)$definition=$item;
            if(!$definition||$definition['organizer']!=='ismile'||$definition['currency']!=='USD'||$definition['price']!==150||$definition['total_seats']!==25||count(json_decode($definition['presenters_json'],true))!==3)throw new RuntimeException('Pediatric poster definition does not match');
            if(!Db::value("SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='workshops' AND column_name='display_price'"))throw new RuntimeException('USD display price migration is not deployed');
            if(!is_file('/opt/ismile-test/site/'.$definition['photo']))throw new RuntimeException('Team portrait missing');
            $owner=Db::one("SELECT * FROM admin_users WHERE role='owner' AND disabled_at IS NULL ORDER BY id LIMIT 1");if(!$owner)throw new RuntimeException('Owner required');
            $save=static function()use(&$state,$file):void{$json=json_encode($state,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR);if(file_put_contents($file.'.writing',$json,LOCK_EX)===false)throw new RuntimeException('Cannot save publication progress');chmod($file.'.writing',0600);rename($file.'.writing',$file);};
            $gateway=new PsoolaGateway();
            $request=static function(string $step,string $method,string $path,?array $body=null)use(&$state,$save,$gateway):array{
             $key='ismile-ws-pediatric-dentistry-masterclass-'.$step;
             if(strlen($key)>64)throw new RuntimeException('Idempotency key is too long.');
             if($method!=='GET'){
              $record=['method'=>$method,'path'=>$path,'body'=>$body,'key'=>$key];
              if(isset($state['requests'][$step])&&$state['requests'][$step]!==$record)throw new RuntimeException('Saved request changed: '.$step);
              $state['requests'][$step]=$record;$save();
              if(isset($state['responses'][$step]))return $state['responses'][$step];
             }
             for($attempt=0;$attempt<2;$attempt++){
              $result=$gateway->partnerRequest($method,'manage/'.$path,$body,$method==='GET'?[]:['Idempotency-Key: '.$key]);
              $json=$result['json']??[];$requestId=$json['requestId']??null;
              App::log($result['status']>=400?'error':'info','PSOOLA workshop management',['workshop'=>'pediatric-dentistry-masterclass','method'=>$method,'path'=>'manage/'.$path,'status'=>$result['status'],'requestId'=>$requestId]);
              echo 'MANAGEMENT_CALL='.json_encode(['step'=>$step,'method'=>$method,'path'=>'manage/'.$path,'status'=>$result['status'],'requestId'=>$requestId]).PHP_EOL;
              if($result['status']!==429)break;
              // Six writes are below the normal limit. Retain the identical request for retry.
              sleep(5);
             }
             if(!in_array($result['status'],[200,201],true))throw new RuntimeException('PSOOLA '.$step.': HTTP '.$result['status'].' '.($json['error']['code']??'').' '.($json['error']['message']??'Request failed').' requestId='.($requestId??'none'));
             if($method!=='GET'){$state['responses'][$step]=$json;$save();}
             return $json;
            };
            
            $category='td785em4z4zsgk26cencfv067587a1xd';$start=1795154400000;$end=1795165200000;
            $before=$request('pre-publish-read','GET','events/'.$eventId);$selected=array_values(array_filter($before['ticketTypes']??[],static fn($t)=>$t['_id']===$ticketId));
            if(count($selected)!==1||(int)$selected[0]['price']!==$quote['amountIQD']||$selected[0]['currency']!=='IQD'||(int)$selected[0]['quantity']!==25||($before['event']['showOnPsoola']??null)!==false)throw new RuntimeException('Provider admission ticket does not match the saved USD quote');
            Db::transaction(static function()use($workshopId,$definition,$quote,$eventId,$showId,$ticketId):void{
             $row=Db::one('SELECT * FROM workshops WHERE id=? FOR UPDATE',[$workshopId]);
             if($row){if($row['organizer']!=='ismile'||$row['provider_event_id']!==$eventId||(int)$row['price']!==$quote['amountIQD']||$row['currency']!=='IQD'||(int)$row['display_price']!==150||$row['display_currency']!=='USD')throw new RuntimeException('Existing pediatric workshop changed');return;}
             Db::insert('workshops',array_replace($definition,['price'=>$quote['amountIQD'],'currency'=>'IQD','display_price'=>150,'display_currency'=>'USD','provider_event_id'=>$eventId,'provider_show_id'=>$showId,'provider_ticket_type_id'=>$ticketId,'status'=>'hidden','sort_order'=>(int)Db::value('SELECT COALESCE(MAX(sort_order),0)+1 FROM workshops'),'created_at'=>App::now(),'updated_at'=>App::now()]));
            });
            $artwork=[
             'coverImageWeb'=>['r2Key'=>'events/ismile-2026/web-3qta010q.jpg','url'=>'https://assets.psoola.com/events/ismile-2026/web-3qta010q.jpg','width'=>1200,'height'=>1500,'mimeType'=>'image/jpeg'],
             'coverImageMobile'=>['r2Key'=>'events/ismile-2026/mobile-dvgbspt1.jpg','url'=>'https://assets.psoola.com/events/ismile-2026/mobile-dvgbspt1.jpg','width'=>1300,'height'=>900,'mimeType'=>'image/jpeg'],
             'heroImageDesktop'=>['r2Key'=>'events/ismile-2026/heroDesktop-9bs8nfyv.jpg','url'=>'https://assets.psoola.com/events/ismile-2026/heroDesktop-9bs8nfyv.jpg','width'=>1920,'height'=>1080,'mimeType'=>'image/jpeg'],
             'heroImagePhone'=>['r2Key'=>'events/ismile-2026/heroPhone-y90cw3b5.jpg','url'=>'https://assets.psoola.com/events/ismile-2026/heroPhone-y90cw3b5.jpg','width'=>1080,'height'=>1350,'mimeType'=>'image/jpeg']
            ];
            $request('artwork','PATCH','events/'.$eventId,['event'=>$artwork]);
            $request('on-sale','PATCH','events/'.$eventId.'/shows/'.$showId,['status'=>'on_sale']);
            $request('publish','POST','events/'.$eventId.'/status',['status'=>'published']);
            $managed=$request('verify','GET','events/'.$eventId);
            $event=$managed['event']??[];
            $shows=array_values(array_filter($managed['shows']??[],static fn($s)=>($s['_id']??'')===$showId));
            $tickets=array_values(array_filter($managed['ticketTypes']??[],static fn($t)=>($t['_id']??'')===$ticketId));
            if(($event['status']??'')!=='published'||($event['showOnPsoola']??null)!==false||($managed['commerce']['categoryId']??'')!==$category||count($shows)!==1||count($tickets)!==1||$shows[0]['status']!=='on_sale'||(int)$shows[0]['dateTime']!==$start||(int)$shows[0]['endTime']!==$end||(int)$tickets[0]['price']!==$quote['amountIQD']||(int)$tickets[0]['quantity']!==25||$tickets[0]['currency']!=='IQD')throw new RuntimeException('Provider verification failed.');
            foreach($artwork as $key=>$value)if(($event[$key]??null)!=$value)throw new RuntimeException('Provider artwork mismatch: '.$key);
            
            $sales=$gateway->partnerRequest('GET','events/'.$eventId);if($sales['status']!==200)throw new RuntimeException('Pediatric workshop is absent from the sales API');
            $candidate=Workshops::find($workshopId);$catalog=WorkshopCatalog::fromEvent($sales['json']['event'],$candidate);
            if($catalog['price']!==$quote['amountIQD']||$catalog['currency']!=='IQD'||$catalog['scheduledDate']!=='2026-11-20'||$catalog['startTime']!=='09:00'||$catalog['endTime']!=='12:00'||$catalog['seatsLeft']<0||$catalog['seatsLeft']>25)throw new RuntimeException('Pediatric sales catalog mismatch');
            Db::transaction(static function()use($workshopId,$quote,$eventId,$owner):void{
             $row=Db::one('SELECT * FROM workshops WHERE id=? FOR UPDATE',[$workshopId]);if(!$row||$row['provider_event_id']!==$eventId||(int)$row['price']!==$quote['amountIQD']||$row['currency']!=='IQD'||(int)$row['total_seats']!==25)throw new RuntimeException('Workshop changed before publication');
             Db::update('workshops',['status'=>'active','updated_at'=>App::now()],'id=?',[$workshopId]);Audit::log((int)$owner['id'],'workshop.psoola_publication','workshop',null,['id'=>$workshopId,'provider_event_id'=>$eventId,'price'=>$quote['amountIQD'],'currency'=>'IQD','display_price'=>150,'display_currency'=>'USD','total_seats'=>25,'conversion_source'=>$quote]);
            });
            Workshops::syncWebsite();$verified=WorkshopCatalog::one($workshopId,true);
            if(!$verified||!$verified['availabilityVerified']||$verified['price']!==$quote['amountIQD']||$verified['currency']!=='IQD'||$verified['displayPrice']!==['amount'=>150,'currency'=>'USD']||count($verified['presenters'])!==3)throw new RuntimeException('Public pediatric catalog does not match');
            $probe='pediatric-workshop-check@example.invalid';if(Db::value('SELECT id FROM registrations WHERE LOWER(email)=?',[$probe]))throw new RuntimeException('Verification address unexpectedly exists');
            try{WorkshopCheckout::start($workshopId,$probe);throw new RuntimeException('Unregistered email was accepted');}catch(\Ismile\UserError $e){if($e->getMessage()!=='wd_err_not_registered')throw $e;}
            $state['completedAt']=App::now();$state['verifiedCatalog']=$verified;$save();
            echo 'WORKSHOPS_VERIFIED='.json_encode(['workshop'=>$verified,'quote'=>$quote,'providerEventId'=>$eventId,'providerShowId'=>$showId,'providerTicketTypeId'=>$ticketId,'showOnPsoola'=>false,'testBookingCreated'=>false],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;
            
            PEDIATRIC_MASTERCLASS_PHP
