name: Workshop chenar-paytekht-design-fix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: chenar-paytekht-design-fix workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php /opt/ismile-test/backend/tools/publish-chenar-workshop.php --apply --update-portrait
            node <<'CHENAR_DESIGN_CONTENT'
            
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');
            const sponsor={"name":"PAYTEKHT","tier":"silver","logo":"assets/sponsors/paytekht-silver-designed-20261111.png","bg":"#18363F","tile":true},previous={"oldPhoto":"assets/workshops/chenar-subhi.png","newPhoto":"assets/workshops/chenar-subhi-cutout-20261111.png","oldLogo":"assets/sponsors/paytekht-silver-20261111.jpeg"},hashes={"assets/workshops/chenar-subhi-cutout-20261111.png":"d5991e84b1e5d0fd03d635ba7ccfa1268328d507697866d8070230264a97ae2e","assets/sponsors/paytekht-silver-designed-20261111.png":"46fcfd57b5757e495d8c87cc3c3525ac3fd72282a37360323ce6111cbac028f4"};
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const candidates=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,sponsor.logo)));
            if(candidates.length!==1)throw Error('Expected one deployed website with the corrected artwork');
            const current=fs.realpathSync(candidates[0].pm2_env.pm_cwd);
            for(const [file,hash] of Object.entries(hashes))if(crypto.createHash('sha256').update(fs.readFileSync(path.join(current,file))).digest('hex')!==hash)throw Error('Artwork differs: '+file);
            const environment=fs.readFileSync(path.join(current,'.env'),'utf8'),match=environment.match(/^CONTENT_ROOT=(.*)$/m);
            const shared=match&&match[1].trim()?match[1].trim():path.resolve(current,'../../shared-content');
            const backendSite='/opt/ismile-test/site',rows=JSON.parse(fs.readFileSync(path.join(backendSite,'data/workshops.json'),'utf8'));
            const workshop=rows.find(w=>w.id==='implant-digital-prosthetic-workflow');
            if(!workshop||workshop.photoStyle!=='cutout'||workshop.photo!==previous.newPhoto||workshop.organizer!=='company'||workshop.price!==0||workshop.totalSeats!==25||workshop.companyPhone!=='0750 427 0507')throw Error('Workshop design or business details differ');
            const backup=path.join(path.dirname(shared),'content-backups','chenar-design-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            function update(file,kind,index){
             const raw=fs.readFileSync(file,'utf8'),doc=JSON.parse(raw),stat=fs.statSync(file);
             fs.writeFileSync(path.join(backup,index+'-'+path.basename(file)),raw,{mode:0o600});
             if(kind==='sponsors'){
              if(!Array.isArray(doc.sponsors))throw Error('Invalid sponsor content');
              const matches=doc.sponsors.filter(s=>s.name===sponsor.name);
              if(matches.length!==1||matches[0].tier!=='silver'||![previous.oldLogo,sponsor.logo].includes(matches[0].logo))throw Error('Unexpected sponsor source');
              matches[0].logo=sponsor.logo;matches[0].bg=sponsor.bg;
             }else{
              if(!Array.isArray(doc))throw Error('Invalid workshop content');
              const matches=doc.filter(w=>w.id===workshop.id);
              if(matches.length!==1||![previous.oldPhoto,workshop.photo].includes(matches[0].photo))throw Error('Unexpected workshop source');
              matches[0].photo=workshop.photo;matches[0].photoStyle='cutout';
             }
             const temporary=file+'.design-writing';fs.writeFileSync(temporary,JSON.stringify(doc,null,2)+String.fromCharCode(10));fs.chmodSync(temporary,stat.mode&0o777);fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,file);
             console.log(JSON.stringify({updated:file,kind}));
            }
            update(path.join(shared,'data/sponsors.json'),'sponsors',0);update(path.join(backendSite,'data/sponsors.json'),'sponsors',1);update(path.join(shared,'data/workshops.json'),'workshops',2);
            console.log('WORKSHOPS_PUBLISHED='+JSON.stringify({id:workshop.id,photo:workshop.photo,photoStyle:workshop.photoStyle,free:true,totalSeats:25,sponsor:sponsor.name,sponsorLogo:sponsor.logo,imagesVerified:true}));
            
            CHENAR_DESIGN_CONTENT
