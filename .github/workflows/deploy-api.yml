name: Workshop vip-200-activate-nov10
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: vip-200-activate-nov10 workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php /opt/ismile-test/backend/tools/configure-vip-package.php --verify
            runuser -u www-data -- php /opt/ismile-test/backend/tools/configure-vip-package.php --open
            runuser -u www-data -- php <<'VIP_VERIFY'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\{Db,Settings,VipPackages,Registrations,WorkshopCatalog};
            $s=Registrations::publicState('en');
            $fk=(int)Db::value("SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema=DATABASE() AND table_name='vip_package_choices' AND constraint_type='FOREIGN KEY'");
            if(!VipPackages::ready()||!Settings::bool('vip_package_sales_open')||!$s['vip']['available']||$fk!==5||Settings::int('vip_registration_limit')!==0)throw new RuntimeException('VIP activation verification failed');
            $workshops=[];foreach(VipPackages::WORKSHOPS as $id){$w=WorkshopCatalog::one($id,true);$workshops[]=['id'=>$id,'availabilityVerified'=>$w['availabilityVerified'],'seatsLeft'=>$w['seatsLeft']];}
            echo 'WORKSHOPS_VERIFIED='.json_encode(['salesOpen'=>true,'checkoutReady'=>true,'usd'=>200,'prices'=>$s['prices'],'databaseRelations'=>$fk,'savedChoices'=>(int)Db::value('SELECT COUNT(*) FROM vip_package_choices'),'websiteLimit'=>0,'workshops'=>$workshops]).PHP_EOL;
            VIP_VERIFY
