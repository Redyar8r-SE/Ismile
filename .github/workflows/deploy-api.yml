name: Workshop snow-platinum-newdent-gold
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: snow-platinum-newdent-gold workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            node <<'SPONSOR_TIER_MOVES'
            
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');
            const changes=[{"previous":{"name":"SNOW","tier":"silver","logo":"assets/sponsors/snow-white-20261110.webp","bg":"#18363F","tile":true},"next":{"name":"SNOW","tier":"platinum","logo":"assets/sponsors/snow-white-20261110.webp","bg":"#18363F","tile":true}},{"previous":{"name":"NEWDENT","tier":"silver","logo":"assets/sponsors/newdent-silver-20261110.webp","bg":"#18363F","tile":true},"next":{"name":"NEWDENT","tier":"gold","logo":"assets/sponsors/newdent-gold-20261111.webp","bg":"#18363F","tile":true}}],hash="2b0e482aea2fdd57f5144a9b0d8847e8bfe380bd5687663aa33e03792cd9e87a",newdent=changes.find(c=>c.next.name==='NEWDENT').next;
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const candidates=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,newdent.logo)));
            if(candidates.length!==1)throw Error('Expected one website with the approved Gold artwork');
            const current=fs.realpathSync(candidates[0].pm2_env.pm_cwd);
            if(crypto.createHash('sha256').update(fs.readFileSync(path.join(current,newdent.logo))).digest('hex')!==hash)throw Error('Gold artwork differs');
            const environment=fs.readFileSync(path.join(current,'.env'),'utf8'),match=environment.match(/^CONTENT_ROOT=(.*)$/m),shared=match&&match[1].trim()?match[1].trim():path.resolve(current,'../../shared-content');
            const backup=path.join(path.dirname(shared),'content-backups','sponsor-tier-moves-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            const names=changes.map(c=>c.next.name);
            for(const [index,file] of [path.join(shared,'data/sponsors.json'),'/opt/ismile-test/site/data/sponsors.json'].entries()){
             const raw=fs.readFileSync(file,'utf8'),doc=JSON.parse(raw),stat=fs.statSync(file);
             const otherBefore=JSON.stringify(doc.sponsors.filter(s=>!names.includes(s.name)));
             fs.writeFileSync(path.join(backup,index+'-sponsors.json'),raw,{mode:0o600});
             for(const {previous,next} of changes){
              const matches=doc.sponsors.filter(s=>s.name===next.name);
              if(matches.length!==1||![JSON.stringify(previous),JSON.stringify(next)].includes(JSON.stringify(matches[0])))throw Error('Sponsor changed before publication: '+next.name);
              doc.sponsors=doc.sponsors.filter(s=>s.name!==next.name);doc.sponsors.splice(doc.sponsors.findLastIndex(s=>s.tier===next.tier)+1,0,next);
             }
             if(JSON.stringify(doc.sponsors.filter(s=>!names.includes(s.name)))!==otherBefore)throw Error('Other sponsors changed');
             const temporary=file+'.tier-writing';fs.writeFileSync(temporary,JSON.stringify(doc,null,2)+String.fromCharCode(10));fs.chmodSync(temporary,stat.mode&0o777);fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,file);
             console.log('WORKSHOPS_PUBLISHED='+JSON.stringify({updated:file,changes:changes.map(c=>({name:c.next.name,tier:c.next.tier})),otherSponsorsPreserved:true,artworkVerified:true}));
            }
            
            SPONSOR_TIER_MOVES
