name: Publish approved speaker content
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Merge approved speakers with backups
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'SPEAKERS_NODE'
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
            const additions=[{"name":{"en":"Dr. Shkar Hoshear","ar":"د. شكار هوشيار","ku":"د. شکار هۆشیار"},"role":{"en":"Consultant pediatric dentist · DDS, MSc · EAPD Specialized pediatric dentist","ar":"استشاري طب أسنان الأطفال · DDS، ماجستير · طبيب أسنان أطفال متخصص (EAPD)","ku":"ڕاوێژکاری پزیشکیی ددانی منداڵان · DDS، ماستەر · پزیشکی پسپۆڕی ددانی منداڵان (EAPD)"},"topic":{"en":"From Limited Cooperation to Comprehensive Care. The Role of General Anesthesia in Pediatric Dentistry.","ar":"من التعاون المحدود إلى الرعاية الشاملة. دور التخدير العام في طب أسنان الأطفال.","ku":"لە هاوکاریی سنووردارەوە بۆ چاودێریی گشتگیر. ڕۆڵی بێهۆشکردنی گشتی لە پزیشکیی ددانی منداڵاندا."},"photo":"assets/speakers/shkar-hoshear.webp"},{"name":{"en":"Dr. Mahmood Fawzi Chawshli","ar":"د. محمود فوزي چاوشلي","ku":"د. مەحمود فەوزی چاوشلی"},"role":{"en":"Ph.D. in Conservative Dentistry","ar":"دكتوراه في طب الأسنان التحفظي","ku":"دکتۆرا لە چارەسەری پارێزگارانەی ددان"},"topic":{"en":"Beyond the Scan: Digital Dentistry in Advanced Prosthodontic Rehabilitation","ar":"ما وراء المسح: طب الأسنان الرقمي في إعادة التأهيل المتقدم بالتعويضات السنية","ku":"لە دەرەوەی سکان: پزیشکیی ددانی دیجیتاڵ لە دووبارە توانابەخشینەوەی پێشکەوتوو بە جێگرەوەکانی ددان"},"photo":"assets/speakers/mahmood-fawzi-chawshli.webp"},{"name":{"en":"Dr. Zardasht Bradosty","ar":"د. زردشت برادوستي","ku":"د. زەردەشت برادۆستی"},"role":{"en":"Specialist in Esthetic & Restorative Dentistry · B.D.S – PG Dip – M.Sc – PhD","ar":"أخصائي طب الأسنان التجميلي والترميمي · B.D.S – PG Dip – M.Sc – PhD","ku":"پسپۆڕی پزیشکیی ددانی جوانکاری و نۆژەنکردنەوە · B.D.S – PG Dip – M.Sc – PhD"},"topic":{"en":"Navigating Biocompatibility in Resin Composites: Uncovering Chemical Risks and Clinical Realities","ar":"استكشاف التوافق الحيوي في المركبات الراتنجية: كشف المخاطر الكيميائية والواقع السريري","ku":"لێکۆڵینەوە لە گونجاوی زیندەیی لە کۆمپۆزیتە ڕەزینییەکاندا: ئاشکراکردنی مەترسییە کیمیاییەکان و ڕاستییە کلینیکییەکان"},"photo":"assets/speakers/zardasht-bradosty.webp"}],hashes={"assets/speakers/shkar-hoshear.webp":"b5486781a0624849bfdc2fcdb0affdd87b2e32ce01d06a119010aed7a1f203e5","assets/speakers/mahmood-fawzi-chawshli.webp":"3633a1a9791d0144a2e9b1eb3b0f95de1afacfd76cc67d08cb93d429bf1c4542","assets/speakers/zardasht-bradosty.webp":"52b99bf39c50c6960eac61ff0b0e4259724de85b5d3a5a6d0df9e814b683b277"};
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const candidates=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'.env'))&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'assets/speakers/shkar-hoshear.webp')));if(candidates.length!==1)throw Error('Expected one deployed website with approved speakers');
            const current=fs.realpathSync(candidates[0].pm2_env.pm_cwd);for(const [file,hash] of Object.entries(hashes))if(crypto.createHash('sha256').update(fs.readFileSync(path.join(current,file))).digest('hex')!==hash)throw Error('Deployed portrait mismatch: '+file);
            const env=fs.readFileSync(path.join(current,'.env'),'utf8'),match=env.match(/^CONTENT_ROOT=(.*)$/m),shared=match&&match[1].trim()?match[1].trim():path.resolve(current,'../../shared-content');
            const targets=[{file:path.join(shared,'data/speakers.json'),fallback:path.join(current,'data/speakers.json')},{file:'/opt/ismile-test/site/data/speakers.json',fallback:'/opt/ismile-test/repo/data/speakers.json'}],backup=path.join(path.dirname(shared),'content-backups','speakers-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            for(let i=0;i<targets.length;i++){const {file,fallback}=targets[i];if(!fs.existsSync(file)&&!fs.existsSync(fallback)){console.log('Skipped absent optional site '+i);continue;}const source=fs.existsSync(file)?file:fallback,raw=fs.readFileSync(source,'utf8'),doc=JSON.parse(raw);if(!Array.isArray(doc))throw Error('Invalid speakers');fs.writeFileSync(path.join(backup,i+'-speakers.json'),raw,{mode:0o600});for(const item of additions){const at=doc.findIndex(s=>s.name?.en===item.name.en);if(at>=0)doc[at]=item;else doc.push(item);}fs.mkdirSync(path.dirname(file),{recursive:true});const temp=file+'.speakers-writing';fs.writeFileSync(temp,JSON.stringify(doc,null,2)+'\n');const stat=fs.statSync(source);fs.chmodSync(temp,stat.mode&0o777);fs.chownSync(temp,stat.uid,stat.gid);fs.renameSync(temp,file);console.log(JSON.stringify({updated:file,count:doc.length}));}
            SPEAKERS_NODE
