name: Workshop workshop-zero-staff-verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: workshop-zero-staff-verify workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'ZERO_STAFF_VERIFY'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            $render=static function(string $query,string $role='owner'):string{$process=proc_open(['php','/opt/ismile-test/backend/tools/verify-deployment.php','--render','workshops',$query,$role],[0=>['pipe','r'],1=>['pipe','w'],2=>['pipe','w']],$pipes);fclose($pipes[0]);$html=stream_get_contents($pipes[1]);$err=stream_get_contents($pipes[2]);fclose($pipes[1]);fclose($pipes[2]);if(proc_close($process)!==0)throw new RuntimeException('Render failed: '.$err);return $html;};
            $id='subperiosteal-implant-protocol';$catalog=\Ismile\WorkshopCatalog::one($id,true);$workshop=\Ismile\Workshops::find($id);$quote=\Ismile\WorkshopCashSale::quote($workshop,$catalog);if($quote['iqd']!==0)throw new RuntimeException('Zero IQD quote not verified');
            $person=\Ismile\Db::one("SELECT r.id FROM registrations r WHERE r.status='paid' AND NOT EXISTS(SELECT 1 FROM workshop_bookings b WHERE b.registration_id=r.id AND b.workshop_id=? AND b.removed_at IS NULL) AND NOT EXISTS(SELECT 1 FROM workshop_checkouts c WHERE c.registration_id=r.id AND c.workshop_id=? AND c.provider_status IN('created','unknown','awaiting_payment','paid')) AND NOT EXISTS(SELECT 1 FROM guest_workshop_orders g WHERE g.registration_id=r.id AND g.workshop_id=? AND g.active_pair IS NOT NULL) LIMIT 1",[$id,$id,$id]);if(!$person)throw new RuntimeException('No read-only form fixture');
            foreach(['owner','registration'] as $role){$html=$render(http_build_query(['id'=>$id,'mode'=>'cash','booking'=>'1','rid'=>$person['id']]),$role);foreach(['data-workshop-free','name="free_registration"','Register &amp; issue free ticket','0 IQD'] as $text)if(!str_contains($html,$text))throw new RuntimeException('Free staff form missing '.$text);if(str_contains($html,'name="cash_amount"')||str_contains($html,'name="cash_received"'))throw new RuntimeException('Free form requires cash');}
            $html=$render('id='.$id.'&mode=cash&booking=1','registration');if(!str_contains($html,'data-ws-attendee-search')||str_contains($html,'Cash registration unavailable'))throw new RuntimeException('Staff attendee lookup blocked');
            $paid=\Ismile\Db::one("SELECT w.id FROM workshops w WHERE w.organizer='ismile' AND w.status='active' AND w.price>0 AND w.provider_event_id IS NOT NULL AND NOT EXISTS(SELECT 1 FROM workshop_bookings b WHERE b.workshop_id=w.id AND b.registration_id=? AND b.removed_at IS NULL) AND NOT EXISTS(SELECT 1 FROM workshop_checkouts c WHERE c.workshop_id=w.id AND c.registration_id=? AND c.provider_status IN('created','unknown','awaiting_payment','paid')) AND NOT EXISTS(SELECT 1 FROM guest_workshop_orders g WHERE g.workshop_id=w.id AND g.registration_id=? AND g.active_pair IS NOT NULL) LIMIT 1",[$person['id'],$person['id'],$person['id']]);if(!$paid)throw new RuntimeException('No paid form fixture');$html=$render(http_build_query(['id'=>$paid['id'],'mode'=>'cash','booking'=>'1','rid'=>$person['id']]),'registration');if(!str_contains($html,'data-workshop-cash')||!str_contains($html,'name="cash_received"'))throw new RuntimeException('Paid cash form changed');
            $viewer=$render('id='.$id.'&mode=cash&booking=1','viewer');if(str_contains($viewer,'data-workshop-free')||str_contains($viewer,'id="ws-book"'))throw new RuntimeException('Viewer access changed');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['zeroIqdApiPrice'=>true,'staffFreeForm'=>true,'noCashRequired'=>true,'attendeeLookup'=>true,'paidCashForm'=>true,'viewerRestricted'=>true,'readOnly'=>true]).PHP_EOL;
            ZERO_STAFF_VERIFY
