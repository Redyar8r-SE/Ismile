name: Registration diagnostics (encrypted, read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load existing SSH connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Read error logs and encrypt for local investigation
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'ISMILE_DIAGNOSTIC_NODE'
            const fs=require('node:fs'), crypto=require('node:crypto'), cp=require('node:child_process');
            const report={time:new Date().toISOString(),logs:[],versions:{}};
            if(fs.existsSync('/var/log/nginx'))for(const name of fs.readdirSync('/var/log/nginx').filter(name=>/^(access|error)\.log/.test(name))) {
             const file='/var/log/nginx/'+name;
             if(fs.statSync(file).size>40000000)continue;
             let buffer=fs.readFileSync(file);
             if(name.endsWith('.gz'))buffer=require('node:zlib').gunzipSync(buffer,{maxOutputLength:80000000});
             const lines=buffer.toString('utf8').split('\n').filter(line=>/register\.php/.test(line)&&(/22\/Oct\/2026:1[567]:/.test(line)||/2026\/10\/22 1[567]:/.test(line)));
             if(lines.length)report.logs.push({file,lines:lines.slice(-100)});
            }
            for(const file of ['/var/log/nginx/access.log','/var/log/nginx/error.log','/var/log/php8.3-fpm.log','/root/.pm2/logs/ismile-error.log']) {
             if(!fs.existsSync(file))continue;
             const fd=fs.openSync(file,'r'),size=fs.fstatSync(fd).size,buffer=Buffer.alloc(Math.min(size,2000000));
             fs.readSync(fd,buffer,0,buffer.length,Math.max(0,size-buffer.length));fs.closeSync(fd);
             report.logs.push({file,lines:buffer.toString('utf8').split('\n').filter(line=>/register\.php|Fatal error|upstream|ECONN|fetch failed|timed out/.test(line)).slice(-100)});
            }
            for(const folder of ['/opt/ismile-test/backend/storage/logs','/opt/ismile/backend/storage/logs']) {
             if(!fs.existsSync(folder))continue;
             for(const name of fs.readdirSync(folder).filter(n=>/^app-2026-10.*\.log$/.test(n))) {
              const file=folder+'/'+name;
              const fd=fs.openSync(file,'r'),size=fs.fstatSync(fd).size,buffer=Buffer.alloc(Math.min(size,1500000));
              fs.readSync(fd,buffer,0,buffer.length,Math.max(0,size-buffer.length));fs.closeSync(fd);
              report.logs.push({file,lines:buffer.toString('utf8').split('\n').filter(line=>/API error|Could not start a payment|register\.php|Fatal error/.test(line)).slice(-150)});
             }
            }
            for(const [name,args] of [['php',['-v']],['git',['-C','/opt/ismile-test/repo','rev-parse','HEAD']]]) {
             try{report.versions[name]=cp.execFileSync(name,args,{encoding:'utf8',stdio:['ignore','pipe','ignore']}).trim();}catch{report.versions[name]='unavailable';}
            }
            const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
            const encrypted=Buffer.concat([cipher.update(JSON.stringify(report),'utf8'),cipher.final()]);
            const wrapped=crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAzPimixJUCBVhLURmrG+Y\noQziRLqlpZrjuXfRN6gmRkXgCp+vz1Rx9k6PC7Qz0eb9NnLMvKBvZy7XS7bB5LhV\nWTwH2H/az1/rvD5k92Fdk33AivfO3KXRPtVBzhTKiQPfRzAraobUfF+pV3JgIMWp\nZ+RBQIVy3K28MF8bNHLQY/e912Ak0AjWjI1ZA1cH2iw0H3uTkXQKbCe0d4eUasY7\noHnZ8/KLTosq/Z+1GMChDdVWvFu+E04N+2157lMdd1MLXURIIYzhWgDrpX+Qt3Mv\nhb8g9BJ0rp/YLuNbo9M8pFq91KTp53Xx6KV6kTzWNLGMiPHlH5IJFaPQlv9RCLdU\niPuuuAPBlbcWpORICfEWx4cUpg4MyIwnr79QeDlSSOG8onL8wndOXRexxvxgIG+S\ngzUumcL9pTBFIZBnU8WK7fo585ezZ2YETDJ8WUWGM3OjvaSEMhG6xExFKxlZL4qJ\neW3+6kba/2KHZw60M2rkvxyxux5TXtBTpiROxB8zm7iXAgMBAAE=\n-----END PUBLIC KEY-----\n",oaepHash:'sha256'},key);
            console.log('ENCRYPTED_DIAGNOSTICS:'+Buffer.from(JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:encrypted.toString('base64')})).toString('base64'));
            ISMILE_DIAGNOSTIC_NODE
