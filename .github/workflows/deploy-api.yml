name: Workshop map-40-apply
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: map-40-apply workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'MAP40_MOVE'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\Db;use Ismile\BoothPlan;use Ismile\Map40Upgrade;
            BoothPlan::assertDatabaseMatches();
            $before=Db::all('SELECT * FROM sponsor_requests ORDER BY id');$calls=Db::all('SELECT * FROM sponsor_calls ORDER BY id');$emails=(int)Db::value('SELECT COUNT(*) FROM emails');
            $target=Db::one("SELECT * FROM sponsor_requests WHERE ref='SPN26-XJ7U4' AND kind='sponsor'");
            if(!$target||(int)$target['id']!==31)throw new RuntimeException('The authorised transfer target changed.');
            foreach(Db::all("SELECT reserved_booth,package_id FROM sponsor_requests WHERE reserved_booth IN ('26','27','28')") as $row)if($row['package_id']!=='bronze')throw new RuntimeException('An affected row acquired a mismatched booking. Review it before proceeding.');
            $result=Map40Upgrade::transfer('SPN26-XJ7U4');
            $after=Db::all('SELECT * FROM sponsor_requests ORDER BY id');$expected=$before;
            foreach($expected as &$row)if((int)$row['id']===31){$row['booth_number']='45';$row['reserved_booth']='45';$row['updated_at']=Db::value('SELECT updated_at FROM sponsor_requests WHERE id=31');}unset($row);
            if($after!==$expected||Db::all('SELECT * FROM sponsor_calls ORDER BY id')!==$calls||(int)Db::value('SELECT COUNT(*) FROM emails')!==$emails)throw new RuntimeException('Booking, call or email preservation verification failed.');
            $view=Db::one('SELECT * FROM `15_sponsor_map` WHERE `Map position`=40');
            if(!$view||$view['Company']!==$target['company']||(int)$view['Internal position ID']!==45||Db::value("SELECT id FROM sponsor_requests WHERE reserved_booth='25'"))throw new RuntimeException('Booth 40 report or released booth 22 does not match.');
            foreach(['silver'=>14,'bronze'=>13] as $tier=>$count)if((int)Db::value('SELECT places FROM sponsor_packages WHERE id=?',[$tier])!==$count)throw new RuntimeException('Tier capacity mismatch.');
            $report=Db::one('SELECT * FROM `07_sponsors` WHERE `Reference`=?',[$target['ref']]);if(!$report||(int)$report['Map position']!==40||$report['Company']!==$target['company'])throw new RuntimeException('Sponsor list/export view did not follow the transfer.');
            $lines=[];exec('php '.escapeshellarg('/opt/ismile-test/backend/tools/verify-deployment.php').' --render map '.escapeshellarg('format=json&number=45'),$lines,$status);if($status!==0)throw new RuntimeException('Live admin map JSON render failed.');$map=json_decode(implode("\n",$lines),true,512,JSON_THROW_ON_ERROR);if(!$map['ok']||(int)$map['number']!==45||(int)$map['detail']['id']!==31||$map['detail']['company']!==$target['company'])throw new RuntimeException('Live admin booth 40 detail did not follow the transfer.');
            echo 'WORKSHOPS_VERIFIED='.json_encode(['mapPositions'=>BoothPlan::count(),'bookingMovedFrom'=>22,'bookingMovedTo'=>40,'bookingIdPreserved'=>true,'allDetailsPreserved'=>true,'allCallsPreserved'=>true,'unrelatedBookingsPreserved'=>true,'emailsSent'=>0,'reportMatches'=>true,'booth22Available'=>true]).PHP_EOL;
            MAP40_MOVE
            node <<'MAP40_CONTENT'
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']})),matches=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'js/config/booth-layout.js')));if(matches.length!==1)throw Error('Website process ambiguous');
            const current=fs.realpathSync(matches[0].pm2_env.pm_cwd),env=fs.readFileSync(path.join(current,'.env'),'utf8'),m=env.match(/^CONTENT_ROOT=(.*)$/m),shared=m&&m[1].trim()?m[1].trim():path.resolve(current,'../../shared-content');
            const plan=JSON.parse(fs.readFileSync('/opt/ismile-test/site/data/booth-tiers.json')),bundle=JSON.parse(fs.readFileSync(path.join(current,'data/booth-tiers.json')));if(plan.layoutVersion!=='2026-11-09-40'||bundle.layoutVersion!==plan.layoutVersion)throw Error('Both source deployments must be on map 40');
            const backup=path.join(path.dirname(shared),'content-backups','map-40-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            function write(root,relative,update){const target=path.join(root,relative),original=fs.existsSync(target)?target:path.join(current,relative),raw=fs.readFileSync(original,'utf8'),stat=fs.statSync(original),doc=update(JSON.parse(raw));const saved=path.join(backup,(root===shared?'public-':'backend-')+relative.replaceAll('/','-'));fs.writeFileSync(saved,raw,{mode:0o600});const temporary=target+'.map40-writing';fs.writeFileSync(temporary,JSON.stringify(doc,null,2)+'\n');fs.chmodSync(temporary,stat.mode&0o777);fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,target);}
            for(const root of [shared,'/opt/ismile-test/site']){
             write(root,'data/booth-tiers.json',()=>plan);
             write(root,'data/sponsors.json',doc=>{for(const tier of doc.tiers){const count={platinum:6,gold:7,silver:14,bronze:13}[tier.id];if(!count)continue;tier.spots=count;for(const lang of ['en','ar','ku'])if(typeof tier.subtitle?.[lang]==='string')tier.subtitle[lang]=tier.subtitle[lang].replace(/^\d+/,String(count));}return doc;});
             for(const lang of ['en','ar','ku'])write(root,'data/i18n/site-'+lang+'.json',doc=>{for(const key of ['bm_intro','pg_map_text','pm_text'])if(typeof doc[key]==='string')doc[key]=doc[key].replace(/(?<![0-9٠-٩])(?:39|44|٣٩|٤٤)(?![0-9٠-٩])/g,x=>/[٠-٩]/.test(x)?'٤٠':'40');return doc;});
            }
            console.log('WORKSHOPS_PUBLISHED='+JSON.stringify({publicMap:40,backendMap:40,capacities:{platinum:6,gold:7,silver:14,bronze:13},editedLogosPreserved:true,translationsSynced:true}));
            MAP40_CONTENT
