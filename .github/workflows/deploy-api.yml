name: Badges QR count
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Count badge QRs (read-only, counts only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set -eu
            printf '%s\n' '49081b27464552a778cea91fb37652b6922b62261599c3497ef6527a4425cbaa  /opt/ismile-test/backend/src/PsoolaTickets.php' | sha256sum --check
            runuser -u www-data -- php <<'QR_COUNT'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\Db;
            $rows = Db::all("SELECT r.ticket_type, c.codes FROM registrations r JOIN tickets t ON t.registration_id = r.id LEFT JOIN badge_ticket_codes c ON c.registration_id = r.id
                WHERE r.status IN ('paid','complimentary') AND t.cancelled_at IS NULL");
            $out = [];
            foreach ($rows as $row) {
                $kind = $row['ticket_type'] === 'vip' ? 'vip' : 'listed';
                $out[$kind]['guests'] = ($out[$kind]['guests'] ?? 0) + 1;
                if ($row['codes'] === null) { $out[$kind]['qrMissing'] = ($out[$kind]['qrMissing'] ?? 0) + 1; continue; }
                foreach ((array) json_decode((string) $row['codes'], true) as $code) {
                    $key = str_starts_with((string) $code, 'PSOOLA:') ? 'badgeQrPsoola' : 'badgeQrShortCode';
                    $out[$kind][$key] = ($out[$kind][$key] ?? 0) + 1;
                }
            }
            echo 'QR_COUNT=' . json_encode($out) . PHP_EOL;
            QR_COUNT
