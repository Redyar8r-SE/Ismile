name: Speaker QR check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Check speaker QR delivery (read-only, no personal data printed)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set -eu
            cd /opt/ismile-test
            runuser -u www-data -- php <<'SPEAKERQR'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\Db; use Ismile\App;
            $gw = new \Ismile\Payments\PsoolaGateway();
            $mask = static function ($v) {
              if (!is_string($v)) return $v;
              if (preg_match('/@|\+?\d{7,}/', $v)) return '[hidden]';
              return mb_substr($v, 0, 80);
            };
            // Values of status-like keys only (no names, emails, phones, QR codes).
            $walk = static function ($node, string $path = '') use (&$walk, $mask): array {
              $out = [];
              if (!is_array($node)) return $out;
              foreach ($node as $k => $v) {
                $p = is_int($k) ? $path . '[' . $k . ']' : ($path === '' ? (string) $k : $path . '.' . $k);
                if (is_array($v)) { $out = array_merge($out, $walk($v, $p)); continue; }
                if (preg_match('/status|error|reason|consent|deliver|notif|sent|fail|whatsapp|channel|message|acknowledg|categor|source/i', (string) $k) && !preg_match('/qr|(?<!error)code$|email$|phone$|name$/i', (string) $k)) {
                  $out[$p] = $mask($v);
                }
              }
              return $out;
            };
            $keys = static function ($n, $p = '') use (&$keys): array { $o = []; if (!is_array($n)) return $o; foreach ($n as $k => $v) { $q = is_int($k) ? $p . '[]' : ($p === '' ? $k : $p . '.' . $k); $o[] = $q; if (is_array($v)) $o = array_merge($o, $keys($v, $q)); } return array_values(array_unique($o)); };
            $phoneShape = static fn ($p) => is_string($p) ? (preg_match('/^\+9647\d{9}$/', $p) ? 'iraq-mobile-ok' : (preg_match('/^\+[1-9]\d{7,14}$/', $p) ? 'intl-' . strlen($p) : 'BAD')) : 'none';
            $emailShape = static fn ($e) => is_string($e) && filter_var($e, FILTER_VALIDATE_EMAIL) ? 'ok@' . substr(strrchr($e, '@'), 1) : 'BAD';
            $rows = Db::all("SELECT st.id sid, st.created_at, o.id oid, o.status, o.provider_order_id, o.provider_status, o.email_status, o.whatsapp_status, o.last_error, o.request_json, o.registration_id, r.status reg_status, r.whatsapp_consent_at
              FROM speaker_tickets st JOIN sponsored_ticket_orders o ON o.attempt_key = st.attempt_key LEFT JOIN registrations r ON r.id = o.registration_id ORDER BY st.id");
            echo 'SQRCOUNT=' . count($rows) . PHP_EOL;
            $keysShown = false;
            foreach ($rows as $r) {
              $req = json_decode((string) $r['request_json'], true) ?: [];
              $buyer = $req['buyer'] ?? [];
              $line = ['speaker' => (int) $r['sid'], 'added' => substr((string) $r['created_at'], 0, 16), 'order' => $r['status'], 'reg' => $r['reg_status'],
                'dbEmail' => $r['email_status'], 'dbWhatsapp' => $r['whatsapp_status'], 'lastError' => $r['last_error'],
                'sentConsent' => $buyer['whatsappConsent'] ?? false, 'regConsentAt' => $r['whatsapp_consent_at'] !== null,
                'phone' => $phoneShape($buyer['phone'] ?? null), 'email' => $emailShape($buyer['email'] ?? null), 'locale' => $req['locale'] ?? null,
                'requestKeys' => array_keys($req), 'buyerKeys' => array_keys($buyer)];
              if ($r['provider_order_id']) {
                $a = $gw->partnerRequest('GET', 'orders/' . rawurlencode((string) $r['provider_order_id']));
                $line['live'] = $a['status'] === 200 ? $walk($a['json'] ?? []) : 'HTTP ' . $a['status'];
                if ($a['status'] === 200 && !$keysShown) { $keysShown = true; echo 'SQRKEYS=' . json_encode($keys($a['json']), JSON_UNESCAPED_SLASHES) . PHP_EOL; }
                usleep(400000);
              }
              echo 'SQRROW=' . json_encode($line, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . PHP_EOL;
            }
            // All guest tickets grouped, speakers and not, to see if the problem is only speakers.
            echo 'SQRGUESTS=' . json_encode(Db::all("SELECT (st.id IS NOT NULL) speaker, o.status, o.email_status, o.whatsapp_status, COUNT(*) n,
              SUM(JSON_EXTRACT(o.request_json, '$.buyer.whatsappConsent') IS NOT NULL) with_consent, MIN(o.created_at) first, MAX(o.created_at) last
              FROM sponsored_ticket_orders o LEFT JOIN speaker_tickets st ON st.attempt_key = o.attempt_key
              GROUP BY speaker, o.status, o.email_status, o.whatsapp_status")) . PHP_EOL;
            $other = Db::all("SELECT o.provider_order_id, o.created_at FROM sponsored_ticket_orders o LEFT JOIN speaker_tickets st ON st.attempt_key = o.attempt_key
              WHERE st.id IS NULL AND o.status = 'issued' AND o.created_at >= '2026-11-18 00:00:00' ORDER BY o.id DESC LIMIT 30");
            foreach ($other as $o) {
              $a = $gw->partnerRequest('GET', 'orders/' . rawurlencode((string) $o['provider_order_id']));
              echo 'SQRGUESTLIVE=' . substr((string) $o['created_at'], 0, 16) . ' ' . json_encode($a['status'] === 200 ? $walk($a['json'] ?? []) : 'HTTP ' . $a['status'], JSON_UNESCAPED_SLASHES) . PHP_EOL;
              usleep(400000);
            }
            // Server log lines about speakers, guest tickets or WhatsApp (emails and numbers hidden).
            foreach (glob(App::storage('logs') . '/app-2026-11.log') ?: [] as $f) {
              foreach (file($f) as $l) {
                if (preg_match('/speaker|guest|whatsapp|complimentary|consent/i', $l)) echo 'SQRLOG=' . preg_replace(['/[\w.+-]+@[\w-]+\.[\w.]+/', '/\+?\d{9,}/'], ['[email]', '[num]'], mb_substr(trim($l), 0, 300)) . PHP_EOL;
              }
            }
            SPEAKERQR
