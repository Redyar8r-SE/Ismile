name: Workshop pediatric-usd-response
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: pediatric-usd-response workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'PEDIATRIC_USD_RESPONSE_PHP'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\App;
            use Ismile\Payments\PsoolaGateway;
            $state=json_decode((string)file_get_contents(App::storage('tmp/pediatric-dentistry-masterclass-psoola-management.json')),true,512,JSON_THROW_ON_ERROR);
            $request=$state['requests']['ticket'];$gateway=new PsoolaGateway();
            $response=$gateway->partnerRequest($request['method'],'manage/'.$request['path'],$request['body'],['Idempotency-Key: '.$request['key']]);
            $catalog=$gateway->partnerRequest('GET','events/'.App::config('payments.psoola.event_id'));
            $prices=[];foreach($catalog['json']['event']['shows']??[] as $show)foreach($show['ticketTypes']??[] as $ticket){$prices[]=['name'=>$ticket['name']??null,'price'=>$ticket['price']??null,'currency'=>$ticket['currency']??null,'originalPrice'=>$ticket['originalPrice']??null];}
            echo 'WORKSHOPS_INVENTORY='.json_encode(['usdTicketResponse'=>['status'=>$response['status'],'json'=>$response['json']],'mainTicketPrices'=>$prices],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;
            PEDIATRIC_USD_RESPONSE_PHP
