name: Workshop joint-providership-nov11
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: joint-providership-nov11 workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            node <<'JOINT_PROVIDERSHIP_CONTENT'
            
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
            const previous={"kind":"accreditation","role":{"en":"Joint Accreditation Provider Partner","ar":"شريك مزوّد الاعتماد المشترك","ku":"هاوبەشی دابینکەری ئیعتیمادی هاوبەش"},"name":{"en":"CAPP & ADA","ar":"CAPP و ADA","ku":"CAPP و ADA"},"note":{"en":"Continuing-education accreditation","ar":"اعتماد التعليم الطبي المستمر","ku":"ئیعتیمادی خوێندنی بەردەوامی پزیشکی"},"logo":"assets/partners/capp-2026.webp","logo2":"assets/partners/ada-2026.webp"},next={"kind":"accreditation","role":{"en":"Joint Providership","ar":"تقديم مشترك","ku":"پێشکەشکردنی هاوبەش"},"name":{"en":"CAPP & iSMILE","ar":"CAPP & iSMILE","ku":"CAPP & iSMILE"},"note":{"en":"14 CE ADA Credits","ar":"14 رصيدًا للتعليم المستمر ADA","ku":"14 کرێدیتی CE ADA"},"logo":"assets/partners/capp-2026.webp","logo2":null};
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const candidates=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'data/summit-partners.json')));
            if(candidates.length!==1)throw Error('Expected one deployed public website');
            const current=fs.realpathSync(candidates[0].pm2_env.pm_cwd),environment=fs.readFileSync(path.join(current,'.env'),'utf8'),match=environment.match(/^CONTENT_ROOT=(.*)$/m),shared=match&&match[1].trim()?match[1].trim():path.resolve(current,'../../shared-content');
            const backup=path.join(path.dirname(shared),'content-backups','joint-providership-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            for(const [index,file] of [path.join(shared,'data/summit-partners.json'),'/opt/ismile-test/site/data/summit-partners.json'].entries()){
             const fallback=path.join(current,'data/summit-partners.json'),source=fs.existsSync(file)?file:fallback;
             const raw=fs.readFileSync(source,'utf8'),doc=JSON.parse(raw),stat=fs.statSync(fs.existsSync(file)?file:path.dirname(file));
             const matches=doc.partners.filter(p=>p.kind==='accreditation');if(matches.length!==1||![JSON.stringify(previous),JSON.stringify(next)].includes(JSON.stringify(matches[0])))throw Error('Partner card changed before publication');
             const otherBefore=JSON.stringify(doc.partners.filter(p=>p.kind!=='accreditation'));
             fs.writeFileSync(path.join(backup,index+'-summit-partners.json'),raw,{mode:0o600});
             doc.partners[doc.partners.indexOf(matches[0])]=next;
             if(JSON.stringify(doc.partners.filter(p=>p.kind!=='accreditation'))!==otherBefore)throw Error('Other partner cards changed');
             const temporary=file+'.joint-writing';fs.writeFileSync(temporary,JSON.stringify(doc,null,2)+String.fromCharCode(10));fs.chmodSync(temporary,fs.existsSync(file)?stat.mode&0o777:0o644);fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,file);
             console.log('WORKSHOPS_PUBLISHED='+JSON.stringify({updated:file,role:next.role.en,name:next.name.en,credits:next.note.en,adaLogo:false,otherPartnersPreserved:true}));
            }
            
            JOINT_PROVIDERSHIP_CONTENT
