name: Workshop subperiosteal-free-live
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: subperiosteal-free-live workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'NATIVE_FREE_WORKSHOP_PHP'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            
            use Ismile\App;
            use Ismile\Audit;
            use Ismile\Db;
            use Ismile\WorkshopCatalog;
            use Ismile\WorkshopCheckout;
            use Ismile\Workshops;
            use Ismile\Payments\PsoolaGateway;
            
            $workshopId='subperiosteal-implant-protocol';
            $file=App::storage('tmp/subperiosteal-implant-protocol-native-free-publication.json');
            $lock=fopen($file.'.lock','c');
            if(!$lock||!flock($lock,LOCK_EX|LOCK_NB))throw new RuntimeException('Matrix Effect creation is already running.');
            $definition=json_decode((string)file_get_contents('/opt/ismile-test/backend/assets/subperiosteal-workshop-2026.json'),true,512,JSON_THROW_ON_ERROR);
            if(!Db::value("SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='workshops' AND column_name='presenters_json'"))throw new RuntimeException('Workshop presenters migration is not deployed.');
            if(!Db::value('SELECT id FROM workshops WHERE id=?',[$workshopId]))Db::insert('workshops',$definition+['sort_order'=>(int)Db::value('SELECT COALESCE(MAX(sort_order),0)+1 FROM workshops'),'created_at'=>App::now(),'updated_at'=>App::now()]);
            $row=Db::one('SELECT * FROM workshops WHERE id=?',[$workshopId]);
            if(!$row||$row['organizer']!=='ismile'||(int)$row['price']!==0||(int)$row['total_seats']!==30||$row['scheduled_date']!=='2026-11-20'||substr($row['start_time'],0,5)!=='13:00'||substr($row['end_time'],0,5)!=='15:00')throw new RuntimeException('Confirmed workshop details do not match the saved draft.');
            $owner=Db::one("SELECT * FROM admin_users WHERE role='owner' AND disabled_at IS NULL ORDER BY id LIMIT 1");
            if(!$owner)throw new RuntimeException('An enabled Owner is required.');
            $state=is_file($file)?json_decode((string)file_get_contents($file),true,512,JSON_THROW_ON_ERROR):['originalWorkshop'=>$row,'requests'=>[],'responses'=>[]];
            $save=static function()use(&$state,$file):void{
             $json=json_encode($state,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR);
             if(file_put_contents($file.'.writing',$json,LOCK_EX)===false)throw new RuntimeException('Cannot persist management progress.');
             chmod($file.'.writing',0600);rename($file.'.writing',$file);
            };
            $save();
            $gateway=new PsoolaGateway();
            $request=static function(string $step,string $method,string $path,?array $body=null)use(&$state,$save,$gateway):array{
             $key='ismile-free-workshop-'.$step;
             if(strlen($key)>64)throw new RuntimeException('Idempotency key is too long.');
             if($method!=='GET'){
              $record=['method'=>$method,'path'=>$path,'body'=>$body,'key'=>$key];
              if(isset($state['requests'][$step])&&$state['requests'][$step]!==$record)throw new RuntimeException('Saved request changed: '.$step);
              $state['requests'][$step]=$record;$save();
              if(isset($state['responses'][$step]))return $state['responses'][$step];
             }
             for($attempt=0;$attempt<2;$attempt++){
              $result=$gateway->partnerRequest($method,'manage/'.$path,$body,$method==='GET'?[]:['Idempotency-Key: '.$key]);
              $json=$result['json']??[];$requestId=$json['requestId']??null;
              App::log($result['status']>=400?'error':'info','PSOOLA workshop management',['workshop'=>'subperiosteal-implant-protocol','method'=>$method,'path'=>'manage/'.$path,'status'=>$result['status'],'requestId'=>$requestId]);
              echo 'MANAGEMENT_CALL='.json_encode(['step'=>$step,'method'=>$method,'path'=>'manage/'.$path,'status'=>$result['status'],'requestId'=>$requestId]).PHP_EOL;
              if($result['status']!==429)break;
              // Six writes are below the normal limit. Retain the identical request for retry.
              sleep(5);
             }
             if(!in_array($result['status'],[200,201],true))throw new RuntimeException('PSOOLA '.$step.': HTTP '.$result['status'].' '.($json['error']['code']??'').' '.($json['error']['message']??'Request failed').' requestId='.($requestId??'none'));
             if($method!=='GET'){$state['responses'][$step]=$json;$save();}
             return $json;
            };
            
            $column=Db::one("SELECT COLUMN_TYPE FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='workshop_bookings' AND column_name='paid_how'");
            if(!str_contains($column['COLUMN_TYPE']??'',"'free'"))throw new RuntimeException('Free registration migration is not deployed.');
            if(!str_contains((string)file_get_contents('/opt/ismile-test/backend/src/WorkshopCheckout.php'),'private static function registerFree'))throw new RuntimeException('Native free registration is not deployed.');
            if(!is_file('/opt/ismile-test/site/'.$definition['photo']))throw new RuntimeException('Team portrait is missing.');
            if(!isset($state['orphanedProviderDraft'])){
             $previousFile=App::storage('tmp/subperiosteal-implant-protocol-psoola-management.json');
             if(!is_file($previousFile))throw new RuntimeException('Previous management operation record is missing.');
             $previous=json_decode((string)file_get_contents($previousFile),true,512,JSON_THROW_ON_ERROR);
             $eventId=$previous['eventId']??null;
             if(!$eventId)throw new RuntimeException('Prior draft event is missing.');
             $draft=$request('read-unused-draft','GET','events/'.$eventId);
             if(($draft['event']['status']??'')==='published'||($draft['event']['showOnPsoola']??null)!==false||count($draft['ticketTypes']??[])!==0)throw new RuntimeException('Prior provider draft must remain unpublished with no admission tickets.');
             $state['orphanedProviderDraft']=['eventId'=>$eventId,'showId'=>$previous['showId']??null,'status'=>$draft['event']['status']??null,'showOnPsoola'=>false,'ticketTypes'=>0,'reason'=>'Psoola requires ticket price of at least 1 IQD; free registration remains local.'];$save();
            }
            $kawan=Db::one('SELECT * FROM workshops WHERE id=?',['matrix-effect']);
            if(!$kawan||(int)$kawan['price']!==25000)throw new RuntimeException('Expected existing Kawan workshop.');
            $managedKawan=$request('kawan-read','GET','events/'.$kawan['provider_event_id']);
            $kawanDescription=str_replace('Dt. Kawan Saleh','Dr. Kawan Saleh',(string)$managedKawan['event']['description']);
            if(!str_contains($kawanDescription,'Suitable for all experience levels'))$kawanDescription.="\n\nSuitable for all experience levels.";
            $request('kawan-copy','PATCH','events/'.$kawan['provider_event_id'],['event'=>['description'=>$kawanDescription]]);
            $ticket=null;foreach($managedKawan['ticketTypes'] as $candidate)if($candidate['_id']===$kawan['provider_ticket_type_id'])$ticket=$candidate;
            if(!$ticket)throw new RuntimeException('Existing Kawan admission ticket is missing.');
            $kawanTicketDescription=str_replace('Dt. Kawan Saleh','Dr. Kawan Saleh',(string)$ticket['description']);
            if(!str_contains($kawanTicketDescription,'Suitable for all experience levels'))$kawanTicketDescription.=' Suitable for all experience levels.';
            $request('kawan-ticket-copy','PATCH','events/'.$kawan['provider_event_id'].'/ticket-types/'.$kawan['provider_ticket_type_id'],['ticket'=>['description'=>$kawanTicketDescription]]);
            Db::update('workshops',['speaker_en'=>'Dr. Kawan Saleh','level_en'=>'Suitable for all experience levels','level_ar'=>'مناسب لجميع مستويات الخبرة','level_ku'=>'گونجاوە بۆ هەموو ئاستەکانی ئەزموون','updated_at'=>App::now()],'id=?',['matrix-effect']);
            Audit::log((int)$owner['id'],'workshop.edit','workshop',null,['id'=>'matrix-effect','speaker_en'=>'Dr. Kawan Saleh','level_en'=>'Suitable for all experience levels']);
            Workshops::syncWebsite();@unlink(App::storage('tmp/workshop-catalog-matrix-effect.json'));
            $verifiedKawan=WorkshopCatalog::one('matrix-effect',true);
            if($verifiedKawan['speaker']['en']!=='Dr. Kawan Saleh'||$verifiedKawan['level']['en']!=='Suitable for all experience levels'||$verifiedKawan['price']!==25000)throw new RuntimeException('Kawan corrections were not applied.');
            $state['verifiedKawan']=$verifiedKawan;
            
            
            Db::transaction(static function()use($workshopId,$definition,$owner):void{
             $current=Db::one('SELECT * FROM workshops WHERE id=? FOR UPDATE',[$workshopId]);
             if(!$current||$current['organizer']!=='ismile'||(int)$current['price']!==0||(int)$current['total_seats']!==30)throw new RuntimeException('Free workshop details changed before publication.');
             if($current['status']!=='active'&&(Db::value('SELECT COUNT(*) FROM workshop_bookings WHERE workshop_id=?',[$workshopId])||Db::value('SELECT COUNT(*) FROM workshop_checkouts WHERE workshop_id=?',[$workshopId])))throw new RuntimeException('Unexpected registrations on the hidden workshop.');
             $changes=$definition;unset($changes['id']);
             $changes['status']='active';$changes['provider_event_id']=null;$changes['provider_show_id']=null;$changes['provider_ticket_type_id']=null;$changes['updated_at']=App::now();
             Db::update('workshops',$changes,'id=?',[$workshopId]);
             Audit::log((int)$owner['id'],'workshop.free_publication','workshop',null,['id'=>$workshopId,'price'=>0,'total_seats'=>30,'registration'=>'native-free','presenters'=>3]);
            });
            Workshops::syncWebsite();@unlink(App::storage('tmp/workshop-catalog-'.$workshopId.'.json'));
            $verified=WorkshopCatalog::one($workshopId,true);$local=Workshops::find($workshopId);
            if(!$verified||!$verified['availabilityVerified']||$verified['price']!==0||$verified['status']!=='active'||$verified['totalSeats']!==30||count($verified['presenters']??[])!==3||$verified['level']['en']!=='Suitable for all experience levels'||$local['providerEventId']||$local['providerShowId']||$local['providerTicketTypeId'])throw new RuntimeException('Free live catalog verification failed.');
            $probe='live-free-workshop-check@example.invalid';
            if(Db::value('SELECT id FROM registrations WHERE LOWER(email)=?',[$probe]))throw new RuntimeException('Verification email unexpectedly exists.');
            try{WorkshopCheckout::start($workshopId,$probe);throw new RuntimeException('Unregistered email was accepted.');}catch(\Ismile\UserError $e){if($e->getMessage()!=='wd_err_not_registered')throw $e;}
            $state['completedAt']=App::now();$state['verifiedCatalog']=$verified;$save();
            echo 'WORKSHOPS_PUBLISHED='.json_encode(['id'=>$workshopId,'workshop'=>$verified,'kawan'=>$verifiedKawan,'registration'=>'native-free','orphanedProviderDraft'=>$state['orphanedProviderDraft'],'purchaseCreatedByVerification'=>false],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            
            NATIVE_FREE_WORKSHOP_PHP
