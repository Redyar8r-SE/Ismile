name: Workshop kawan-management-create
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: kawan-management-create workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'KAWAN_MANAGEMENT_PHP'
            <?php
            declare(strict_types=1);
            require '/opt/ismile-test/backend/bootstrap.php';
            
            use Ismile\App;
            use Ismile\Audit;
            use Ismile\Db;
            use Ismile\WorkshopCatalog;
            use Ismile\WorkshopCheckout;
            use Ismile\Workshops;
            use Ismile\Payments\PsoolaGateway;
            
            $workshopId='matrix-effect';
            $file=App::storage('tmp/matrix-effect-psoola-management.json');
            $lock=fopen($file.'.lock','c');
            if(!$lock||!flock($lock,LOCK_EX|LOCK_NB))throw new RuntimeException('Matrix Effect creation is already running.');
            $row=Db::one('SELECT * FROM workshops WHERE id=?',[$workshopId]);
            if(!$row||$row['organizer']!=='ismile'||(int)$row['price']!==25000||(int)$row['total_seats']!==25||$row['scheduled_date']!=='2026-11-20'||substr($row['start_time'],0,5)!=='13:00'||substr($row['end_time'],0,5)!=='15:00')throw new RuntimeException('Confirmed workshop details do not match the saved draft.');
            $owner=Db::one("SELECT * FROM admin_users WHERE role='owner' AND disabled_at IS NULL ORDER BY id LIMIT 1");
            if(!$owner)throw new RuntimeException('An enabled Owner is required.');
            $state=is_file($file)?json_decode((string)file_get_contents($file),true,512,JSON_THROW_ON_ERROR):['originalWorkshop'=>$row,'requests'=>[],'responses'=>[]];
            $save=static function()use(&$state,$file):void{
             $json=json_encode($state,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR);
             if(file_put_contents($file.'.writing',$json,LOCK_EX)===false)throw new RuntimeException('Cannot persist management progress.');
             chmod($file.'.writing',0600);rename($file.'.writing',$file);
            };
            $save();
            $gateway=new PsoolaGateway();
            $request=static function(string $step,string $method,string $path,?array $body=null)use(&$state,$save,$gateway):array{
             $key='ismile-ws-matrix-effect-'.$step;
             if(strlen($key)>64)throw new RuntimeException('Idempotency key is too long.');
             if($method!=='GET'){
              $record=['method'=>$method,'path'=>$path,'body'=>$body,'key'=>$key];
              if(isset($state['requests'][$step])&&$state['requests'][$step]!==$record)throw new RuntimeException('Saved request changed: '.$step);
              $state['requests'][$step]=$record;$save();
              if(isset($state['responses'][$step]))return $state['responses'][$step];
             }
             for($attempt=0;$attempt<2;$attempt++){
              $result=$gateway->partnerRequest($method,'manage/'.$path,$body,$method==='GET'?[]:['Idempotency-Key: '.$key]);
              $json=$result['json']??[];$requestId=$json['requestId']??null;
              App::log($result['status']>=400?'error':'info','PSOOLA workshop management',['workshop'=>'matrix-effect','method'=>$method,'path'=>'manage/'.$path,'status'=>$result['status'],'requestId'=>$requestId]);
              echo 'MANAGEMENT_CALL='.json_encode(['step'=>$step,'method'=>$method,'path'=>'manage/'.$path,'status'=>$result['status'],'requestId'=>$requestId]).PHP_EOL;
              if($result['status']!==429)break;
              // Six writes are below the normal limit. Retain the identical request for retry.
              sleep(5);
             }
             if(!in_array($result['status'],[200,201],true))throw new RuntimeException('PSOOLA '.$step.': HTTP '.$result['status'].' '.($json['error']['code']??'').' '.($json['error']['message']??'Request failed').' requestId='.($requestId??'none'));
             if($method!=='GET'){$state['responses'][$step]=$json;$save();}
             return $json;
            };
            $start=(new DateTimeImmutable('2026-11-20T13:00:00+03:00'))->getTimestamp()*1000;
            $end=(new DateTimeImmutable('2026-11-20T15:00:00+03:00'))->getTimestamp()*1000;
            if($start!==1795168800000||$end!==1795176000000)throw new RuntimeException('Iraq schedule conversion failed.');
            $description="iSmile 2026 hands-on workshop with Dt. Kawan Saleh.\n\nMatrix Effect: From Ceramic Powder to Natural Aesthetics.\n\n20 November 2026, 1:00–3:00 PM at Grand Millennium Sulaimani. All times are local to Iraq (Asia/Baghdad). Limited to 25 attendees. 25,000 IQD per seat.\n\nA paid iSmile summit ticket is required. Use the same email used for your summit ticket and complete online payment through PSOOLA to reserve your workshop seat.";
            $ticketDescription='Dt. Kawan Saleh. A paid iSmile summit ticket is required. Use the same summit email and pay online through PSOOLA to reserve your workshop seat.';
            $category='td785em4z4zsgk26cencfv067587a1xd';$venue='r571e95gwse9zqj368qhqdv54h8g22kq';
            if(!isset($state['eventId'])){
             $catalog=$request('managed-list','GET','events');
             foreach($catalog['events']??[] as $event)if(($event['title']??'')===$row['title_en'])throw new RuntimeException('A matching provider event already exists; verify it before creating another.');
             $result=$request('create','POST','events',['categoryId'=>$category,'event'=>[
              'title'=>$row['title_en'],'titleI18n'=>['en'=>$row['title_en']],
              'description'=>$description,'locationId'=>'n17btw319q1ffp2gnqkbefgvr987bq43',
              'startDate'=>$start,'endDate'=>$end,'showEndDateTime'=>true,'tags'=>['ismile-2026','workshop','dentistry']
             ]]);
             $state['eventId']=$result['event']['_id']??null;
             if(!$state['eventId']||($result['event']['showOnPsoola']??null)!==false)throw new RuntimeException('Creation did not return a hidden provider event.');
             $save();
            }
            $eventId=$state['eventId'];
            if(!empty($row['provider_event_id'])&&$row['provider_event_id']!==$eventId)throw new RuntimeException('Workshop is already linked to another provider event.');
            Db::update('workshops',['provider_event_id'=>$eventId,'updated_at'=>App::now()],'id=?',[$workshopId]);
            if(!isset($state['showId'])){
             $result=$request('show','POST','events/'.$eventId.'/shows',['venueId'=>$venue,'dateTime'=>$start,'endTime'=>$end]);
             $shows=array_values(array_filter($result['shows']??[],static fn($s)=>(int)($s['dateTime']??0)===$start&&(int)($s['endTime']??0)===$end&&($s['venueId']??'')===$venue));
             if(count($shows)!==1)throw new RuntimeException('Expected one matching workshop session.');
             $state['showId']=$shows[0]['_id'];$save();
            }
            $showId=$state['showId'];
            Db::update('workshops',['provider_show_id'=>$showId,'updated_at'=>App::now()],'id=?',[$workshopId]);
            if(!isset($state['ticketTypeId'])){
             $result=$request('ticket','POST','events/'.$eventId.'/ticket-types',['showId'=>$showId,'ticket'=>['name'=>'Workshop Admission','description'=>$ticketDescription,'price'=>25000,'quantity'=>25]]);
             $tickets=array_values(array_filter($result['ticketTypes']??[],static fn($t)=>($t['showId']??'')===$showId&&($t['name']??'')==='Workshop Admission'&&(int)($t['price']??0)===25000&&(int)($t['quantity']??0)===25));
             if(count($tickets)!==1)throw new RuntimeException('Expected one matching admission ticket.');
             $state['ticketTypeId']=$tickets[0]['_id'];$save();
            }
            $ticketId=$state['ticketTypeId'];
            Db::update('workshops',['provider_ticket_type_id'=>$ticketId,'updated_at'=>App::now()],'id=?',[$workshopId]);
            $artwork=[
             'coverImageWeb'=>['r2Key'=>'events/ismile-2026/web-3qta010q.jpg','url'=>'https://assets.psoola.com/events/ismile-2026/web-3qta010q.jpg','width'=>1200,'height'=>1500,'mimeType'=>'image/jpeg'],
             'coverImageMobile'=>['r2Key'=>'events/ismile-2026/mobile-dvgbspt1.jpg','url'=>'https://assets.psoola.com/events/ismile-2026/mobile-dvgbspt1.jpg','width'=>1300,'height'=>900,'mimeType'=>'image/jpeg'],
             'heroImageDesktop'=>['r2Key'=>'events/ismile-2026/heroDesktop-9bs8nfyv.jpg','url'=>'https://assets.psoola.com/events/ismile-2026/heroDesktop-9bs8nfyv.jpg','width'=>1920,'height'=>1080,'mimeType'=>'image/jpeg'],
             'heroImagePhone'=>['r2Key'=>'events/ismile-2026/heroPhone-y90cw3b5.jpg','url'=>'https://assets.psoola.com/events/ismile-2026/heroPhone-y90cw3b5.jpg','width'=>1080,'height'=>1350,'mimeType'=>'image/jpeg']
            ];
            $request('artwork','PATCH','events/'.$eventId,['event'=>$artwork]);
            $request('on-sale','PATCH','events/'.$eventId.'/shows/'.$showId,['status'=>'on_sale']);
            $request('publish','POST','events/'.$eventId.'/status',['status'=>'published']);
            $managed=$request('verify','GET','events/'.$eventId);
            $event=$managed['event']??[];
            $shows=array_values(array_filter($managed['shows']??[],static fn($s)=>($s['_id']??'')===$showId));
            $tickets=array_values(array_filter($managed['ticketTypes']??[],static fn($t)=>($t['_id']??'')===$ticketId));
            if(($event['status']??'')!=='published'||($event['showOnPsoola']??null)!==false||($managed['commerce']['categoryId']??'')!==$category||count($shows)!==1||count($tickets)!==1||$shows[0]['status']!=='on_sale'||(int)$shows[0]['dateTime']!==$start||(int)$shows[0]['endTime']!==$end||(int)$tickets[0]['price']!==25000||(int)$tickets[0]['quantity']!==25||$tickets[0]['currency']!=='IQD')throw new RuntimeException('Provider verification failed.');
            foreach($artwork as $key=>$value)if(($event[$key]??null)!=$value)throw new RuntimeException('Provider artwork mismatch: '.$key);
            $sales=$gateway->partnerRequest('GET','events/'.$eventId);
            if($sales['status']!==200)throw new RuntimeException('Published workshop is not available through the sales API.');
            $candidate=Workshops::find($workshopId);$catalog=WorkshopCatalog::fromEvent($sales['json']['event'],$candidate);
            if($catalog['price']!==25000||$catalog['scheduledDate']!=='2026-11-20'||$catalog['startTime']!=='13:00'||$catalog['endTime']!=='15:00'||$catalog['seatsLeft']<0||$catalog['seatsLeft']>25)throw new RuntimeException('Sales catalog does not match the workshop.');
            Db::transaction(static function()use($workshopId,$row,$owner,$eventId,$showId,$ticketId):void{
             $current=Db::one('SELECT * FROM workshops WHERE id=? FOR UPDATE',[$workshopId]);
             foreach(['title_en','organizer','price','total_seats','scheduled_date','start_time','end_time','photo'] as $key)if($current[$key]!==$row[$key])throw new RuntimeException('Workshop changed during provider creation: '.$key);
             Db::update('workshops',['status'=>'active','updated_at'=>App::now()],'id=?',[$workshopId]);
             Audit::log((int)$owner['id'],'workshop.psoola_publication','workshop',null,['id'=>$workshopId,'provider_event_id'=>$eventId,'provider_show_id'=>$showId,'provider_ticket_type_id'=>$ticketId,'price'=>25000,'total_seats'=>25,'showOnPsoola'=>false]);
            });
            Workshops::syncWebsite();
            $verified=WorkshopCatalog::one($workshopId,true);
            if(!$verified||!$verified['availabilityVerified']||$verified['status']!=='active'||$verified['price']!==25000||$verified['organizer']!=='ismile')throw new RuntimeException('iSmile catalog verification failed.');
            $probe='matrix-effect-check@example.invalid';
            if(!Db::value('SELECT id FROM registrations WHERE LOWER(email)=?',[$probe])){
             try{WorkshopCheckout::start($workshopId,$probe);throw new RuntimeException('Unregistered email was accepted.');}catch(\Ismile\UserError $e){if($e->getMessage()!=='wd_err_not_registered')throw $e;}
            }
            $state['completedAt']=App::now();$state['verifiedCatalog']=$verified;$save();
            echo 'WORKSHOPS_PUBLISHED='.json_encode(['id'=>$workshopId,'providerEventId'=>$eventId,'providerShowId'=>$showId,'providerTicketTypeId'=>$ticketId,'showOnPsoola'=>false,'workshop'=>$verified,'purchaseCreatedByVerification'=>false],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            
            KAWAN_MANAGEMENT_PHP
