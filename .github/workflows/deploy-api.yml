name: Workshop kawan-photo-shared
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: kawan-photo-shared workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            node <<'KAWAN_PORTRAIT_NODE'
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
            const relative='assets/uploads/workshops/matrix-effect-kawan-saleh.webp';
            const source=path.join('/opt/ismile-test/site',relative),bytes=fs.readFileSync(source);
            const hash=crypto.createHash('sha256').update(bytes).digest('hex');
            if(hash!=='a964c81428634a265123e850aa6578a5889c9985c1e6f35e2d2368346f03b335')throw Error('Trainer portrait source mismatch');
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const matches=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'server/workshops.mjs')));
            if(matches.length!==1)throw Error('Expected one live iSmile website');
            const root=fs.realpathSync(matches[0].pm2_env.pm_cwd);
            const env=fs.readFileSync(path.join(root,'.env'),'utf8');
            const shared=path.resolve(env.match(/^CONTENT_ROOT=(.*)$/m)?.[1]?.trim().replace(/^['"]|['"]$/g,'')||path.resolve(root,'../../shared-content'));
            for(const directory of [root,shared]){
             const target=path.resolve(directory,relative);if(!target.startsWith(directory+path.sep))throw Error('Invalid portrait target');
             if(fs.existsSync(target)&&crypto.createHash('sha256').update(fs.readFileSync(target)).digest('hex')!==hash)throw Error('A different portrait exists at the target');
             fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target+'.writing',bytes,{mode:0o644});fs.renameSync(target+'.writing',target);
            }
            console.log('WORKSHOPS_VERIFIED='+JSON.stringify({portrait:relative,sha256:hash,application:matches[0].name,status:'installed in release and persistent content'}));
            KAWAN_PORTRAIT_NODE
