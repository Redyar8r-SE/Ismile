name: Guest ticket database source audit (SELECT only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load existing SSH connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Read existing guest ticket origins without changing records
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            node <<'PSOOLA_READ_ONLY_CATALOGUE'
            const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
            let report;
            try{report=JSON.parse(cp.execFileSync('php',['-r',"\nrequire '/opt/ismile-test/backend/bootstrap.php';\nuse Ismile\\Db;\n$report=['checked_at'=>gmdate('c'),'mode'=>'SELECT only; no issuance','complimentary_registrations'=>(int)Db::value(\"SELECT COUNT(*) FROM registrations WHERE status='complimentary'\"),'provider_order_groups'=>Db::all('SELECT status,is_complimentary,provider_currency,COUNT(*) AS count,MIN(provider_amount) AS minimum_amount,MAX(provider_amount) AS maximum_amount FROM sponsored_ticket_orders GROUP BY status,is_complimentary,provider_currency'),'examples'=>[]];\n$rows=Db::all(\"SELECT r.id,r.ref,t.source,o.id AS local_order_id,o.status AS provider_order_status,o.is_complimentary,o.provider_amount,o.provider_currency,o.provider_order_id FROM registrations r LEFT JOIN tickets t ON t.registration_id=r.id LEFT JOIN sponsored_ticket_orders o ON o.registration_id=r.id WHERE r.status='complimentary' ORDER BY r.id DESC LIMIT 10\");\nforeach($rows as $row)$report['examples'][]=['registration_id'=>(int)$row['id'],'ticket_source'=>$row['source'],'has_psoola_order'=>!empty($row['provider_order_id']),'provider_order_status'=>$row['provider_order_status'],'provider_complimentary_flag'=>$row['is_complimentary']===null?null:(bool)$row['is_complimentary'],'provider_amount'=>$row['provider_amount']===null?null:(int)$row['provider_amount'],'provider_currency'=>$row['provider_currency']];\n$report['workshop_guest_counts']=Db::all('SELECT state,COUNT(*) AS count FROM guest_workshop_orders GROUP BY state');\necho json_encode($report,JSON_THROW_ON_ERROR);\n"],{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:60000}));}
            catch(error){report={checked_at:new Date().toISOString(),request_method:'GET',catalogue_lookup_failed:true,exit_code:error.status??null};}
            const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
            const data=Buffer.concat([cipher.update(JSON.stringify(report),'utf8'),cipher.final()]);
            const wrapped=crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA6Up+reUpZu5YdfGjl9Lf\ngADB+C3XeKLsTkMSp4vGhUVU+XFNVTrRppNjdy4Zma7DfGtN4cPsDE+XdIf2RU/H\nfO/gZHab7aPc3V9aROsAlYoCFJoICn1U50aQctvCk2vWY/v1tEnwyT3s/jtZ1obk\nYPMLqL+zcnJqBhkMTabqQ6lYsM8KIyxfSEUfJS9cSgwHV72WOQzlBWTWcThoR3Ni\n2sVID4X2d1rOQwk0nThE7sCpVaUV7uWFnDYHdWKNINW4gBY9e9Gn4l+bEXsH9cR5\nQyNS2VqZvQbRKPqwiRXFBWOXjvt/mL+uPXIMtUiUh8Dge7Fumwg6KC8h/XcI8Crd\n1ThTjT4qUXuQgOZcDq6wJIT/eUptl4NGyKGke8Bhhp6ikThTp9jgSdImFT5kpiuq\n4w3gj7Hd8YF60XGm2CaRlbQkyMI/Uff/y7BpzVaGH5SQY9y+XcseIAhmxBd34w7i\nIoH1EIY/9tqlksiTGVfzZtp835qhievPU8htdaJ5VWZRAgMBAAE=\n-----END PUBLIC KEY-----\n",oaepHash:'sha256'},key);
            console.log('ENCRYPTED_CATALOGUE:'+Buffer.from(JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')})).toString('base64'));
            PSOOLA_READ_ONLY_CATALOGUE
