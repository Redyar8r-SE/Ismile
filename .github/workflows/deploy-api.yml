name: Workshop chenar-paytekht-final
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: chenar-paytekht-final workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            test -f /opt/ismile-test/backend/tools/publish-chenar-workshop.php
            runuser -u www-data -- php /opt/ismile-test/backend/tools/publish-chenar-workshop.php --apply
            node <<'CHENAR_SPONSOR_CONTENT'
            
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');
            const sponsor={"name":"PAYTEKHT","tier":"silver","logo":"assets/sponsors/paytekht-silver-20261111.jpeg","bg":"#FFFFFF","tile":true},hashes={"assets/workshops/chenar-subhi.png":"551b83db4fe162e00c7c5fe0aa983a729fbaec2db502d9b2196bbb554b284915","assets/sponsors/paytekht-silver-20261111.jpeg":"7c025f5347705b5ef4597915d918db978b22ef168b04418f7cbe54d06a857dae"};
            const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const candidates=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,sponsor.logo)));
            if(candidates.length!==1)throw Error('Expected one deployed website with the approved artwork');
            const current=fs.realpathSync(candidates[0].pm2_env.pm_cwd);
            for(const [file,hash] of Object.entries(hashes))if(crypto.createHash('sha256').update(fs.readFileSync(path.join(current,file))).digest('hex')!==hash)throw Error('Artwork differs: '+file);
            const environment=fs.readFileSync(path.join(current,'.env'),'utf8'),match=environment.match(/^CONTENT_ROOT=(.*)$/m);
            const shared=match&&match[1].trim()?match[1].trim():path.resolve(current,'../../shared-content');
            const backendSite='/opt/ismile-test/site';
            const rows=JSON.parse(fs.readFileSync(path.join(backendSite,'data/workshops.json'),'utf8'));
            const workshop=rows.find(w=>w.id==='implant-digital-prosthetic-workflow');
            if(!workshop||workshop.organizer!=='company'||workshop.company!==null||workshop.price!==0||workshop.totalSeats!==25||workshop.companyPhone!=='0750 427 0507')throw Error('Approved workshop missing from database publication');
            const backup=path.join(path.dirname(shared),'content-backups','chenar-paytekht-'+Date.now());fs.mkdirSync(backup,{recursive:true,mode:0o700});
            function update(file,kind,index){
             if(!fs.existsSync(file)&&kind==='workshops'){
              const stat=fs.statSync(path.dirname(file)),temporary=file+'.chenar-paytekht-writing';
              fs.writeFileSync(temporary,JSON.stringify(rows,null,2)+String.fromCharCode(10),{mode:0o644});fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,file);
              console.log(JSON.stringify({created:file,count:rows.length,source:'database'}));return;
             }
             const raw=fs.readFileSync(file,'utf8'),doc=JSON.parse(raw),stat=fs.statSync(file);
             fs.writeFileSync(path.join(backup,index+'-'+path.basename(file)),raw,{mode:0o600});
             if(kind==='sponsors'){
              if(!Array.isArray(doc.sponsors))throw Error('Invalid sponsor content');
              const found=doc.sponsors.filter(s=>s.name===sponsor.name);if(found.length>1)throw Error('Duplicate sponsor');
              if(found.length){if(JSON.stringify(found[0])!==JSON.stringify(sponsor))throw Error('Existing sponsor differs');}
              else doc.sponsors.splice(doc.sponsors.findLastIndex(s=>s.tier==='silver')+1,0,sponsor);
             }else{
              if(!Array.isArray(doc))throw Error('Invalid workshop content');
              const found=doc.filter(w=>w.id===workshop.id);if(found.length>1)throw Error('Duplicate workshop');
              if(found.length){if(JSON.stringify(found[0])!==JSON.stringify(workshop))throw Error('Existing workshop differs');}
              else doc.push(workshop);
             }
             const temporary=file+'.chenar-paytekht-writing';fs.writeFileSync(temporary,JSON.stringify(doc,null,2)+String.fromCharCode(10));fs.chmodSync(temporary,stat.mode&0o777);fs.chownSync(temporary,stat.uid,stat.gid);fs.renameSync(temporary,file);
             console.log(JSON.stringify({updated:file,count:kind==='sponsors'?doc.sponsors.length:doc.length}));
            }
            update(path.join(shared,'data/sponsors.json'),'sponsors',0);
            update(path.join(backendSite,'data/sponsors.json'),'sponsors',1);
            update(path.join(shared,'data/workshops.json'),'workshops',2);
            console.log('WORKSHOPS_PUBLISHED='+JSON.stringify({id:workshop.id,company:null,free:true,totalSeats:25,phone:workshop.companyPhone,sponsor:sponsor.name,sponsorTier:sponsor.tier,imagesVerified:true}));
            
            CHENAR_SPONSOR_CONTENT
