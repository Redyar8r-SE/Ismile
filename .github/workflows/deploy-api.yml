name: Workshop vip-restore-now
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: vip-restore-now workshops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -eu
            runuser -u www-data -- php <<'VIP_RESTORE_DB'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\{App,Db};
            Db::transaction(static function(){foreach(['vip_package_enabled'=>'0','vip_package_sales_open'=>'0','vip_registration_limit'=>'6'] as $k=>$v)Db::run('INSERT INTO settings(k,v,updated_at) VALUES(?,?,?) ON DUPLICATE KEY UPDATE v=VALUES(v),updated_at=VALUES(updated_at)',[$k,$v,App::now()]);});
            $keys=['vip_explore','xp_extras_note','vip_package_not_ready','vip_workshop_required','vip_workshop_full','vip_lunch_one'];
            foreach(['data/tickets.json',...array_map(static fn($l)=>'data/i18n/site-'.$l.'.json',['en','ar','ku'])] as $relative){
             $file=App::siteFile($relative);$backup=App::storage('tmp/vip-200-before-'.str_replace('/','-',$relative));if(!is_file($backup))throw new RuntimeException('VIP original content backup missing');
             $old=json_decode(file_get_contents($backup),true,512,JSON_THROW_ON_ERROR);$data=json_decode(file_get_contents($file),true,512,JSON_THROW_ON_ERROR);
             foreach($relative==='data/tickets.json'?['vip']:$keys as $key){if(array_key_exists($key,$old))$data[$key]=$old[$key];else unset($data[$key]);}
             file_put_contents($file,json_encode($data,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR).PHP_EOL,LOCK_EX);
            }
            echo 'VIP database settings and original content restored.'.PHP_EOL;
            VIP_RESTORE_DB
            node <<'VIP_RESTORE_PUBLIC'
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
            (async()=>{
             const apps=JSON.parse(cp.execFileSync('pm2',['jlist'],{encoding:'utf8',stdio:['ignore','pipe','pipe']})),matches=apps.filter(a=>a.pm2_env?.pm_cwd&&fs.existsSync(path.join(a.pm2_env.pm_cwd,'js/sections/registration.js')));if(matches.length!==1)throw Error('Website process ambiguous');
             const current=fs.realpathSync(matches[0].pm2_env.pm_cwd),env=fs.readFileSync(path.join(current,'.env'),'utf8'),match=env.match(/^CONTENT_ROOT=(.*)$/m),shared=match?.[1]?.trim()||path.join(current,'.site-content');
             const files=['register.html','js/register.js','js/sections/registration.js','js/sections/registration-experience.js','data/tickets.json',...['en','ar','ku'].map(l=>'data/i18n/site-'+l+'.json')];
             const keys=['vip_explore','xp_extras_note','vip_package_not_ready','vip_workshop_required','vip_workshop_full','vip_lunch_one'];
             for(const name of files){const r=await fetch('https://raw.githubusercontent.com/Redyar8r-SE/Ismile/40359166969dc8bf30e8b05d8dce2ccf4e908e5f/'+name);if(!r.ok)throw Error('Original source unavailable '+name);const bytes=Buffer.from(await r.arrayBuffer()),target=path.join(current,name),stat=fs.statSync(target);const temp=target+'.vip-restore';fs.writeFileSync(temp,bytes);fs.chmodSync(temp,stat.mode&0o777);fs.chownSync(temp,stat.uid,stat.gid);fs.renameSync(temp,target);
              const override=path.join(shared,name);if(name.startsWith('data/')&&fs.existsSync(override)){const old=JSON.parse(bytes),data=JSON.parse(fs.readFileSync(override,'utf8')),selected=name==='data/tickets.json'?['vip']:keys;for(const key of selected){if(key in old)data[key]=old[key];else delete data[key];}const st=fs.statSync(override),tmp=override+'.vip-restore';fs.writeFileSync(tmp,JSON.stringify(data,null,2)+'\n');fs.chmodSync(tmp,st.mode&0o777);fs.chownSync(tmp,st.uid,st.gid);fs.renameSync(tmp,override);}
             }
             const page=path.join(current,'vip.html');if(fs.existsSync(page))fs.writeFileSync(page,'<!doctype html><meta http-equiv="refresh" content="0;url=register.html"><a href="register.html">VIP registration</a>');
             console.log('WORKSHOPS_VERIFIED='+JSON.stringify({previousVipDesignRestored:true,packageChangesReverted:true}));
            })().catch(e=>{console.error(e.message);process.exitCode=1;});
            VIP_RESTORE_PUBLIC
