name: Desk workshop trace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load saved server connection
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/connection.env"
          set -a
          source "$RUNNER_TEMP/connection.env"
          set +a
          echo "::add-mask::$DEPLOY_PASSWORD"
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD DEPLOY_SSH_PORT; do
            test -n "${!key}"
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Trace recent workshop registrations (read-only, no names)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set -eu
            printf '%s\n' '0da143d62d4f8f9945ec4966792943ad8940840cd405f8c57016add500a96d32  /opt/ismile-test/backend/src/WorkshopCashSale.php' | sha256sum --check
            runuser -u www-data -- php <<'TRACE'
            <?php
            require '/opt/ismile-test/backend/bootstrap.php';
            use Ismile\Db;
            $since = date('Y-m-d H:i:s', time() - 8 * 3600);
            $out = ['serverNow' => date('Y-m-d H:i')];
            $out['audit'] = Db::all("SELECT a.created_at, a.action, u.role AS by_role, r.status AS summit_status FROM audit_log a LEFT JOIN admin_users u ON u.id = a.user_id LEFT JOIN registrations r ON a.target_type = 'registration' AND r.id = a.target_id WHERE a.created_at > ? AND (a.action LIKE 'workshop.%' OR a.action LIKE 'checkout.%' OR a.action LIKE 'payment.%') ORDER BY a.id DESC LIMIT 30", [$since]);
            $out['checkouts'] = Db::all("SELECT c.id, c.created_at, c.workshop_id, c.provider_status, c.amount, c.booking_id IS NOT NULL AS has_booking, c.fulfillment_error, c.last_error, r.status AS summit_status FROM workshop_checkouts c JOIN registrations r ON r.id = c.registration_id WHERE c.created_at > ? ORDER BY c.id DESC LIMIT 20", [$since]);
            $out['bookings'] = Db::all("SELECT b.id, b.created_at, b.workshop_id, b.payment_status, b.paid_how, b.amount_paid, b.removed_at IS NOT NULL AS removed, u.role AS booked_by_role, r.status AS summit_status FROM workshop_bookings b JOIN registrations r ON r.id = b.registration_id LEFT JOIN admin_users u ON u.id = b.booked_by WHERE b.created_at > ? OR b.updated_at > ? ORDER BY b.id DESC LIMIT 20", [$since, $since]);
            $out['ticketOrders'] = Db::all("SELECT o.id, o.created_at, o.workshop_id, o.provider_status, o.last_error FROM workshop_ticket_orders o WHERE o.created_at > ? ORDER BY o.id DESC LIMIT 20", [$since]);
            echo 'TRACE=' . json_encode($out, JSON_UNESCAPED_SLASHES) . PHP_EOL;
            TRACE
